name = "commons-api-v1-edge-preview"
main = "src/index.ts"
compatibility_date = "2026-07-19"
compatibility_flags = ["global_fetch_private_origin"]
workers_dev = true

# Default/preview namespaces are intentionally isolated from production.
[[ratelimits]]
name = "COLD_TOKEN_LIMIT"
namespace_id = "20260719101"
[ratelimits.simple]
limit = 10
period = 60

[[ratelimits]]
name = "COLD_IP_LIMIT"
namespace_id = "20260719102"
[ratelimits.simple]
limit = 100
period = 60

[[ratelimits]]
name = "TIER_100_LIMIT"
namespace_id = "20260719103"
[ratelimits.simple]
limit = 100
period = 60

[[ratelimits]]
name = "TIER_300_LIMIT"
namespace_id = "20260719104"
[ratelimits.simple]
limit = 300
period = 60

[[ratelimits]]
name = "TIER_1000_LIMIT"
namespace_id = "20260719105"
[ratelimits.simple]
limit = 1000
period = 60

[[ratelimits]]
name = "TIER_3000_LIMIT"
namespace_id = "20260719106"
[ratelimits.simple]
limit = 3000
period = 60

# Production routing exists only behind an explicit `--env production` deploy.
# A normal `wrangler deploy` can create/update preview but cannot attach this
# Worker to commons.email. Do not run the production command before review.
[env.production]
name = "commons-api-v1-edge"
workers_dev = false
routes = [{ pattern = "commons.email/api/v1/*", zone_name = "commons.email" }]

[[env.production.ratelimits]]
name = "COLD_TOKEN_LIMIT"
namespace_id = "20260719201"
[env.production.ratelimits.simple]
limit = 10
period = 60

[[env.production.ratelimits]]
name = "COLD_IP_LIMIT"
namespace_id = "20260719202"
[env.production.ratelimits.simple]
limit = 100
period = 60

[[env.production.ratelimits]]
name = "TIER_100_LIMIT"
namespace_id = "20260719203"
[env.production.ratelimits.simple]
limit = 100
period = 60

[[env.production.ratelimits]]
name = "TIER_300_LIMIT"
namespace_id = "20260719204"
[env.production.ratelimits.simple]
limit = 300
period = 60

[[env.production.ratelimits]]
name = "TIER_1000_LIMIT"
namespace_id = "20260719205"
[env.production.ratelimits.simple]
limit = 1000
period = 60

[[env.production.ratelimits]]
name = "TIER_3000_LIMIT"
namespace_id = "20260719206"
[env.production.ratelimits.simple]
limit = 3000
period = 60
