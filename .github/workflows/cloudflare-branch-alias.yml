name: Reconcile Cloudflare Trusted Staging Edge

on:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: Exact source SHA deployed to the trusted staging edge
        required: true
        type: string

# This workflow mutates the Pages-domain and DNS exposure boundary. It must not
# overlap publication, forced exposure cleanup, or release recovery.
concurrency:
  group: cloudflare-pages-publication
  cancel-in-progress: false

permissions: {}

jobs:
  reconcile:
    # A dispatch can select an arbitrary ref. Only protected main may supply
    # executable workflow authority to the Cloudflare write capability.
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: Staging
    permissions:
      contents: read
    env:
      EXPECTED_COMMIT: ${{ inputs.expected_commit }}
      TRUSTED_GATE_SHA: ${{ github.workflow_sha }}
      WORKFLOW_REF: ${{ github.workflow_ref }}
      REPOSITORY: ${{ github.repository }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.PROTECTED_CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: '019d1184e655db74b7589794a2a2a533'
      CLOUDFLARE_ZONE_ID: ${{ secrets.PROTECTED_CLOUDFLARE_ZONE_ID }}
      PAGES_ORIGIN_ACCESS_TOKEN: ${{ secrets.PROTECTED_PAGES_ORIGIN_ACCESS_TOKEN_PREVIEW }}
      PAGES_ORIGIN_ACCESS_SERVICE_TOKEN_ID_PREVIEW: ${{ secrets.PROTECTED_PAGES_ORIGIN_ACCESS_SERVICE_TOKEN_ID_PREVIEW }}

    steps:
      - name: Checkout immutable protected staging-exposure gate
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.workflow_sha }}
          path: gate
          fetch-depth: 0
          persist-credentials: false

      - name: Authenticate immutable staging-exposure authority
        run: |
          set -euo pipefail
          expected_workflow_ref="${REPOSITORY}/.github/workflows/cloudflare-branch-alias.yml@refs/heads/${DEFAULT_BRANCH}"
          if ! [[ "$TRUSTED_GATE_SHA" =~ ^[0-9a-f]{40}$ ]] || \
            ! [[ "$EXPECTED_COMMIT" =~ ^[0-9a-f]{40}$ ]] || \
            [ "$DEFAULT_BRANCH" != "main" ] || \
            [ "$WORKFLOW_REF" != "$expected_workflow_ref" ]; then
            echo "::error::Staging exposure reconciliation requires exact protected-main authority and one exact release SHA."
            exit 1
          fi
          gate_checkout=$(git -C gate rev-parse --verify 'HEAD^{commit}')
          trusted_default=$(git -C gate rev-parse --verify "refs/remotes/origin/${DEFAULT_BRANCH}^{commit}")
          if [ "$gate_checkout" != "$TRUSTED_GATE_SHA" ] || \
            [ "$TRUSTED_GATE_SHA" != "$trusted_default" ]; then
            echo "::error::The staging exposure workflow is not the current protected-main head."
            exit 1
          fi

      - name: Setup trusted Node.js runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: 'gate/.node-version'

      - name: Install trusted Cloudflare tooling
        run: npm ci --ignore-scripts --prefix gate/.github/release-gate
        timeout-minutes: 10

      - name: Retire direct Pages alias and establish originless route DNS
        id: reconcile_exposure
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_ZONE_ID; do
            if [ -z "${!name:-}" ]; then
              echo "::error::${name} is required from the protected Staging Environment."
              exit 1
            fi
          done
          api='https://api.cloudflare.com/client/v4'
          project='communique-site'
          public_host='staging.commons.email'
          worker='commons-trusted-pages-edge-staging'

          cf_get() {
            local path="$1"
            curl -fsS --max-time 30 \
              --proto '=https' \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H 'Accept: application/json' \
              "${api}${path}"
          }

          cf_mutate() {
            local method="$1"
            local path="$2"
            local payload="${3:-}"
            local output="$RUNNER_TEMP/cloudflare-staging-exposure-mutation.json"
            local args=(
              --silent --show-error --max-time 30 --proto '=https'
              --request "$method"
              --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
              --header 'Accept: application/json'
              --output "$output"
              --write-out '%{http_code}'
            )
            if [ -n "$payload" ]; then
              args+=(--header 'Content-Type: application/json' --data "$payload")
            fi
            local status
            status=$(curl "${args[@]}" "${api}${path}")
            if ! [[ "$status" =~ ^2[0-9][0-9]$ ]] || \
              ! jq -e '.success == true' "$output" >/dev/null; then
              echo "::error::Cloudflare ${method} ${path} did not report exact success (HTTP ${status})."
              cat "$output"
              exit 1
            fi
          }

          pages_domains=$(cf_get \
            "/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${project}/domains")
          printf '%s' "$pages_domains" | jq -e \
            --arg public "$public_host" \
            '.success == true and (.result | type == "array") and
             ((.result_info.total_pages // 1) == 1) and
             ((.result_info.total_count // (.result | length)) == (.result | length)) and
             ([.result[] | select(.name != "pages-origin.commons.email" and
              .name != "pages-origin-staging.commons.email" and .name != $public)] | length == 0) and
             ([.result[] | select((.name == "pages-origin.commons.email" or
              .name == "pages-origin-staging.commons.email") and .status == "active")] | length == 2)' \
            >/dev/null
          stale_pages_domain_count=$(printf '%s' "$pages_domains" | jq -er \
            --arg public "$public_host" '[.result[] | select(.name == $public)] | length')
          if [ "$stale_pages_domain_count" -gt 1 ]; then
            echo "::error::The stale public Pages domain is duplicated."
            exit 1
          fi
          if [ "$stale_pages_domain_count" = "1" ]; then
            cf_mutate DELETE \
              "/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${project}/domains/${public_host}"
          fi

          dns=$(cf_get "/zones/${CLOUDFLARE_ZONE_ID}/dns_records?name=${public_host}")
          printf '%s' "$dns" | jq -e \
            '.success == true and (.result | type == "array") and (.result | length <= 1)' \
            >/dev/null
          dns_count=$(printf '%s' "$dns" | jq -er '.result | length')
          dns_payload=$(jq -nc \
            --arg type AAAA \
            --arg name "$public_host" \
            --arg content '100::' \
            '{type:$type,name:$name,content:$content,proxied:true,ttl:1}')
          if [ "$dns_count" = "0" ]; then
            cf_mutate POST "/zones/${CLOUDFLARE_ZONE_ID}/dns_records" "$dns_payload"
          elif ! printf '%s' "$dns" | jq -e \
            --arg name "$public_host" \
            '.result[0].type == "AAAA" and .result[0].name == $name and
             .result[0].content == "100::" and .result[0].proxied == true and .result[0].ttl == 1' \
            >/dev/null; then
            dns_id=$(printf '%s' "$dns" | jq -er \
              '.result[0].id | select(test("^[a-f0-9]{32}$"))')
            cf_mutate PUT "/zones/${CLOUDFLARE_ZONE_ID}/dns_records/${dns_id}" "$dns_payload"
          fi

          final_domains=$(cf_get \
            "/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${project}/domains")
          printf '%s' "$final_domains" | jq -e \
            '.success == true and (.result | type == "array") and
             ((.result_info.total_pages // 1) == 1) and
             ((.result_info.total_count // (.result | length)) == 2) and
             ([.result[] | .name] | sort) ==
              (["pages-origin-staging.commons.email","pages-origin.commons.email"] | sort) and
             ([.result[] | select(.status == "active")] | length == 2)' >/dev/null
          final_dns=$(cf_get "/zones/${CLOUDFLARE_ZONE_ID}/dns_records?name=${public_host}")
          printf '%s' "$final_dns" | jq -e \
            --arg name "$public_host" \
            '.success == true and (.result | length == 1) and
             .result[0].type == "AAAA" and .result[0].name == $name and
             .result[0].content == "100::" and .result[0].proxied == true and .result[0].ttl == 1' \
            >/dev/null

          routes_file="$RUNNER_TEMP/trusted-staging-edge-routes.json"
          cf_get "/zones/${CLOUDFLARE_ZONE_ID}/workers/routes" > "$routes_file"
          node gate/scripts/verify-trusted-pages-release-edge.mjs verify-route-inventory \
            --environment preview \
            --expected present \
            < "$routes_file" >/dev/null

          status_file="$RUNNER_TEMP/trusted-staging-edge-deployment.json"
          version_file="$RUNNER_TEMP/trusted-staging-edge-version.json"
          gate/.github/release-gate/node_modules/.bin/wrangler deployments status \
            --name "$worker" --json > "$status_file"
          version_id=$(jq -er \
            '.versions | select(length == 1) | .[0] | select(.percentage == 100) | .version_id' \
            "$status_file")
          if ! [[ "$version_id" =~ ^([a-f0-9]{32}|[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12})$ ]]; then
            echo "::error::The active staging edge version id is invalid."
            exit 1
          fi
          gate/.github/release-gate/node_modules/.bin/wrangler versions view "$version_id" \
            --name "$worker" --json > "$version_file"
          jq -e --arg sha "$EXPECTED_COMMIT" '.annotations["workers/tag"] == $sha' \
            "$version_file" >/dev/null

      - name: Prove exact trusted staging-edge topology and denial boundary
        run: |
          set -euo pipefail
          settings=$(curl -fsS --max-time 30 \
            --proto '=https' \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/commons-trusted-pages-edge-staging/settings")
          release_transaction=$(printf '%s' "$settings" | jq -er \
            '.result.bindings | map(select(.name == "PUBLIC_RELEASE_TRANSACTION_ID" and
             .type == "plain_text")) | select(length == 1) | .[0].text |
             select(test("^[1-9][0-9]{0,19}-[1-9][0-9]{0,9}$"))')
          PUBLIC_RELEASE_TRANSACTION_ID="$release_transaction" \
            node gate/scripts/verify-trusted-pages-release-edge.mjs --environment preview >/dev/null

      - name: Summarize trusted staging ownership
        run: |
          {
            echo '### Trusted staging edge reconciled'
            echo "- Trusted edge release: ${EXPECTED_COMMIT}"
            echo "- Public owner: \`commons-trusted-pages-edge-staging\` on \`staging.commons.email/*\`"
            echo "- Public DNS: proxied originless \`AAAA 100::\` (route removal fails closed)"
            echo "- Pages origins: \`pages-origin.commons.email\`, \`pages-origin-staging.commons.email\` only"
            echo "- Direct \`staging.commons.email\` Pages custom-domain attachment: absent"
          } >> "$GITHUB_STEP_SUMMARY"
