name: Deploy to Cloudflare Pages

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch/environment to deploy'
        required: true
        default: production
        type: choice
        options:
          - production
          - main
          - staging
      ref:
        description: 'Git ref to deploy. Defaults to branch.'
        required: false
        type: string
        default: ''
  workflow_run:
    workflows: [CI Tests]
    types: [completed]
    branches: [production, main, staging]

concurrency:
  group: deploy-${{ github.event_name == 'workflow_dispatch' && inputs.branch || github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  source-verify:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      DEPLOY_BRANCH: ${{ github.event_name == 'workflow_dispatch' && inputs.branch || github.event.workflow_run.head_branch }}
      DEPLOY_EVENT: ${{ github.event_name }}
    outputs:
      verified_sha: ${{ steps.resolve-sha.outputs.sha }}
    steps:
      # This job has no secrets and executes no code from the requested tree.
      # It establishes repository identity and branch ancestry before npm ci can
      # run lifecycle scripts in either downstream job.
      - name: Checkout requested ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && (inputs.ref || inputs.branch) || github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Resolve and validate requested SHA
        id: resolve-sha
        run: |
          verified_sha=$(git rev-parse HEAD)
          git fetch --no-tags origin "${DEPLOY_BRANCH}"
          if ! git merge-base --is-ancestor "${verified_sha}" "origin/${DEPLOY_BRANCH}"; then
            echo "::error::Requested ref ${verified_sha} is not contained in origin/${DEPLOY_BRANCH}."
            exit 1
          fi
          # A slower CI run for push A must not deploy after newer push B. Manual
          # dispatch intentionally retains ancestor semantics for audited rollback.
          if [ "${DEPLOY_EVENT}" = "workflow_run" ]; then
            branch_head=$(git rev-parse "origin/${DEPLOY_BRANCH}")
            if [ "${verified_sha}" != "${branch_head}" ]; then
              echo "::error::Skipping stale CI result ${verified_sha}; current ${DEPLOY_BRANCH} head is ${branch_head}."
              exit 1
            fi
          fi
          echo "sha=${verified_sha}" >> "$GITHUB_OUTPUT"

  manual-verify:
    needs: source-verify
    if: github.event_name == 'workflow_dispatch' && needs.source-verify.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      NODE_ENV: test
      CI: true
      PUBLIC_CONVEX_URL: https://placeholder.convex.cloud
      OAUTH_REDIRECT_BASE_URL: http://localhost:5173
      GOOGLE_CLIENT_ID: test-google-client-id
      GOOGLE_CLIENT_SECRET: test-google-client-secret
      FACEBOOK_CLIENT_ID: test-facebook-client-id
      FACEBOOK_CLIENT_SECRET: test-facebook-client-secret
      DISCORD_CLIENT_ID: test-discord-client-id
      DISCORD_CLIENT_SECRET: test-discord-client-secret
      LINKEDIN_CLIENT_ID: test-linkedin-client-id
      LINKEDIN_CLIENT_SECRET: test-linkedin-client-secret
      TWITTER_CLIENT_ID: test-twitter-client-id
      TWITTER_CLIENT_SECRET: test-twitter-client-secret
      INTERNAL_API_SECRET: ci-test-internal-api-secret-padding-32b
      INTERNAL_API_SECRET_PREVIOUS: ci-test-internal-api-secret-previous-32b
      UNSUBSCRIBE_SECRET: ci-test-unsubscribe-secret-padding-32-bytes
      ADDRESS_RESOLUTION_TOKEN_SECRET: ci-test-address-resolution-token-32b-pad
      SESSION_CREATION_SECRET: ci-test-session-creation-secret-32b-padding
      BLAST_DISPATCH_SECRET: ci-test-blast-dispatch-secret-32b-padding-x
      BLAST_RECEIPTS_SECRET: ci-test-blast-receipts-secret-32b-padding-x
    steps:
      - name: Checkout source-verified SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.source-verify.outputs.verified_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Enforce Convex query-efficiency guardrail
        run: npm run check:convex-queries

      - name: Run public-discovery focused verification
        run: |
          npx vitest --run \
            convex/templates-read-budget.convex.test.ts \
            convex/templates-snapshots.convex.test.ts \
            convex/templates-embedding-backfill.convex.test.ts \
            convex/observability-service-ping.convex.test.ts \
            convex/lib/relatedness.test.ts \
            convex/lib/tag_concepts.test.ts \
            tests/unit/convex/public-discovery-writer-contract.test.ts \
            tests/unit/server/public-discovery-cache.test.ts \
            tests/unit/routes/home-page-load.test.ts \
            tests/unit/routes/templates-api-auth.test.ts \
            tests/unit/scripts/public-discovery-readiness.test.ts \
            --config=vitest.config.ts

      - name: Run full test suite
        run: npm run test:run
        timeout-minutes: 10

      - name: Run application type checks
        run: npm run check

      - name: Run Convex type checks
        run: npx tsc --noEmit -p convex/tsconfig.json

  deploy:
    # workflow_run already passed the equivalent CI suite; workflow_dispatch
    # uses manual-verify. source-verify gates repository identity and ancestry
    # for both paths before this secret-bearing job executes requested code.
    needs: [source-verify, manual-verify]
    if: >-
      always() &&
      needs.source-verify.result == 'success' &&
      ((github.event_name == 'workflow_dispatch' && needs.manual-verify.result == 'success') ||
      (github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      # Production is isolated; main and staging intentionally share the same
      # non-production Convex deployment and fixed GitHub Environment.
      name: ${{ (github.event_name == 'workflow_dispatch' && inputs.branch || github.event.workflow_run.head_branch) == 'production' && 'Production' || 'Staging' }}
    env:
      DEPLOY_BRANCH: ${{ github.event_name == 'workflow_dispatch' && inputs.branch || github.event.workflow_run.head_branch }}
      DEPLOY_REF: ${{ needs.source-verify.outputs.verified_sha }}
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_REF }}

      - name: Resolve deploy SHA
        run: echo "DEPLOY_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: npm

      - run: npm ci

      - name: Verify public-discovery KV namespace
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: '019d1184e655db74b7589794a2a2a533'
          PUBLIC_DISCOVERY_KV_ID: '4517015752384e0f8628b85142c69221'
        run: |
          if ! configured_id=$(node <<'NODE'
          const fs = require('node:fs');
          const lines = fs.readFileSync('wrangler.toml', 'utf8').split(/\r?\n/);
          const namespaces = [];
          let current = null;

          const finishNamespace = () => {
            if (current) namespaces.push(current);
            current = null;
          };

          for (const line of lines) {
            const trimmed = line.trim();
            if (trimmed === '[[kv_namespaces]]') {
              finishNamespace();
              current = {};
              continue;
            }
            if (trimmed.startsWith('[')) {
              finishNamespace();
              continue;
            }
            if (!current) continue;
            const field = /^(binding|id)\s*=\s*"([^"]+)"\s*(?:#.*)?$/.exec(trimmed);
            if (field) current[field[1]] = field[2];
          }
          finishNamespace();

          const matches = namespaces.filter(({ binding }) => binding === 'PUBLIC_DISCOVERY_KV');
          if (matches.length !== 1 || typeof matches[0].id !== 'string') {
            throw new Error(
              `wrangler.toml must contain exactly one PUBLIC_DISCOVERY_KV binding with an id; found ${matches.length}`
            );
          }
          process.stdout.write(matches[0].id);
          NODE
          ); then
            echo "::error::Unable to resolve the committed PUBLIC_DISCOVERY_KV binding from wrangler.toml."
            exit 1
          fi
          if [ "$configured_id" != "$PUBLIC_DISCOVERY_KV_ID" ]; then
            echo "::error::wrangler.toml binds PUBLIC_DISCOVERY_KV to ${configured_id}, expected approved namespace ${PUBLIC_DISCOVERY_KV_ID}."
            exit 1
          fi

          namespaces=$(npx wrangler kv namespace list)
          if ! printf '%s' "$namespaces" | jq -e --arg id "$configured_id" \
            'map(select(.id == $id and .title == "PUBLIC_DISCOVERY_KV")) | length == 1' >/dev/null; then
            echo "::error::The committed PUBLIC_DISCOVERY_KV binding is not a live namespace in this Cloudflare account."
            exit 1
          fi

      - name: Load Shadow Atlas build vars
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: '019d1184e655db74b7589794a2a2a533'
          CF_PAGES_PROJECT: communique-site
        run: |
          response=$(curl -fsS \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${CF_PAGES_PROJECT}")

          atlas_url=$(printf '%s' "$response" | jq -r '.result.deployment_configs.production.env_vars.ATLAS_BASE_URL.value // empty')
          vite_atlas_url=$(printf '%s' "$response" | jq -r '.result.deployment_configs.production.env_vars.VITE_ATLAS_BASE_URL.value // empty')
          cell_map_root=$(printf '%s' "$response" | jq -r '.result.deployment_configs.production.env_vars.EXPECTED_CELL_MAP_ROOT.value // empty')
          cell_map_depth=$(printf '%s' "$response" | jq -r '.result.deployment_configs.production.env_vars.EXPECTED_CELL_MAP_DEPTH.value // empty')

          if [ -z "$atlas_url" ]; then
            echo "::error::ATLAS_BASE_URL is not set on Cloudflare Pages project ${CF_PAGES_PROJECT}."
            exit 1
          fi
          if [ -z "$vite_atlas_url" ]; then
            vite_atlas_url="$atlas_url"
          fi
          if ! printf '%s' "$response" | jq -e \
            '.result.source.config.production_deployments_enabled == false and
             .result.source.config.preview_deployment_setting == "none"' >/dev/null; then
            echo "::error::Native Cloudflare Pages production and preview deployments must remain disabled; use this gated Wrangler workflow."
            exit 1
          fi
          if [ "$DEPLOY_BRANCH" = "production" ]; then
            if ! [[ "$atlas_url" =~ ^https://atlas\.commons\.email/v[0-9]{8}$ ]]; then
              echo "::error::Production ATLAS_BASE_URL must be versioned, got: $atlas_url"
              exit 1
            fi
            if ! [[ "$cell_map_root" =~ ^0x[0-9a-fA-F]{64}$ ]]; then
              echo "::error::EXPECTED_CELL_MAP_ROOT is missing or invalid on Cloudflare Pages project ${CF_PAGES_PROJECT}."
              exit 1
            fi
            if ! [[ "$cell_map_depth" =~ ^(18|20|22|24)$ ]]; then
              echo "::error::EXPECTED_CELL_MAP_DEPTH is missing or invalid on Cloudflare Pages project ${CF_PAGES_PROJECT}."
              exit 1
            fi
          fi

          if [ -z "$cell_map_root" ] || [ -z "$cell_map_depth" ]; then
            echo "::warning::Cell map root/depth are not pinned for ${DEPLOY_BRANCH}; non-production health may warn."
          fi

          {
            echo "ATLAS_BASE_URL=$atlas_url"
            echo "VITE_ATLAS_BASE_URL=$vite_atlas_url"
            echo "EXPECTED_CELL_MAP_ROOT=$cell_map_root"
            echo "EXPECTED_CELL_MAP_DEPTH=$cell_map_depth"
          } >> "$GITHUB_ENV"
          echo "Using ATLAS_BASE_URL=$atlas_url"
          echo "Using VITE_ATLAS_BASE_URL=$vite_atlas_url"

      - name: Resolve build environment
        run: |
          # Per-branch Convex backend: production is isolated on its own deployment;
          # staging and preview (main/*) share the non-prod deployment.
          case "${DEPLOY_BRANCH}" in
            production)
              {
                echo "VITE_ENVIRONMENT=production"
                echo "PUBLIC_CONVEX_URL=https://quirky-chinchilla-352.convex.cloud"
              } >> "$GITHUB_ENV"
              ;;
            staging)
              {
                echo "VITE_ENVIRONMENT=staging"
                echo "PUBLIC_CONVEX_URL=https://outstanding-firefly-831.convex.cloud"
              } >> "$GITHUB_ENV"
              ;;
            *)
              {
                echo "VITE_ENVIRONMENT=development"
                echo "PUBLIC_CONVEX_URL=https://outstanding-firefly-831.convex.cloud"
              } >> "$GITHUB_ENV"
              ;;
          esac

      - name: Require deployed public-discovery v4 producer
        # This Pages workflow does not mutate Convex. A successful gate proves
        # the target backend already has the new functions/schema and a v4
        # rematerialization before any branch can upload an edge consumer.
        run: |
          if [ "${DEPLOY_BRANCH}" = "production" ]; then
            PUBLIC_DISCOVERY_MAX_AGE_HOURS=26 \
              PUBLIC_DISCOVERY_REQUIRE_CONTENT=true \
              PUBLIC_DISCOVERY_CONTRACT_ONLY=false \
              npm run verify:public-discovery-readiness
          else
            PUBLIC_DISCOVERY_REQUIRE_CONTENT=false \
              PUBLIC_DISCOVERY_CONTRACT_ONLY=true \
              npm run verify:public-discovery-readiness
          fi

      - name: Sync Shadow Atlas vars into Wrangler config
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'wrangler.toml';
          const updates = {
            ATLAS_BASE_URL: process.env.ATLAS_BASE_URL,
            VITE_ATLAS_BASE_URL: process.env.VITE_ATLAS_BASE_URL,
            EXPECTED_CELL_MAP_ROOT: process.env.EXPECTED_CELL_MAP_ROOT,
            EXPECTED_CELL_MAP_DEPTH: process.env.EXPECTED_CELL_MAP_DEPTH,
            PUBLIC_CONVEX_URL: process.env.PUBLIC_CONVEX_URL,
          };

          for (const [key, value] of Object.entries(updates)) {
            if (!value) {
              throw new Error(`${key} is missing; refusing to deploy stale Shadow Atlas vars.`);
            }
          }

          const lines = fs.readFileSync(path, 'utf8').split(/\r?\n/);
          const start = lines.findIndex((line) => line.trim() === '[vars]');
          if (start === -1) {
            throw new Error('wrangler.toml has no [vars] section.');
          }

          let end = lines.length;
          for (let i = start + 1; i < lines.length; i += 1) {
            if (/^\s*\[/.test(lines[i])) {
              end = i;
              break;
            }
          }

          const block = lines.slice(start + 1, end);
          for (const [key, value] of Object.entries(updates)) {
            const rendered = `${key} = ${JSON.stringify(value)}`;
            const existing = block.findIndex((line) => new RegExp(`^\\s*${key}\\s*=`).test(line));
            if (existing >= 0) {
              block[existing] = rendered;
            } else {
              block.push(rendered);
            }
          }

          lines.splice(start + 1, end - start - 1, ...block);
          fs.writeFileSync(path, lines.join('\n'));
          NODE

          echo "Synced Shadow Atlas runtime vars into wrangler.toml for this deploy."

      - name: Validate Wrangler Shadow Atlas vars
        run: |
          for key in ATLAS_BASE_URL VITE_ATLAS_BASE_URL EXPECTED_CELL_MAP_ROOT EXPECTED_CELL_MAP_DEPTH; do
            if ! grep -q "^${key} = " wrangler.toml; then
              echo "::error::wrangler.toml is missing ${key} after sync."
              exit 1
            fi
          done

      - name: Build
        run: npm run build
        env:
          PUBLIC_CONVEX_URL: ${{ env.PUBLIC_CONVEX_URL }}
          VITE_ENVIRONMENT: ${{ env.VITE_ENVIRONMENT }}
          VITE_ATLAS_BASE_URL: ${{ env.VITE_ATLAS_BASE_URL }}
          ATLAS_BASE_URL: ${{ env.ATLAS_BASE_URL }}
          EXPECTED_CELL_MAP_ROOT: ${{ env.EXPECTED_CELL_MAP_ROOT }}
          EXPECTED_CELL_MAP_DEPTH: ${{ env.EXPECTED_CELL_MAP_DEPTH }}

      - name: Resolve deployment URL
        run: |
          case "${DEPLOY_BRANCH}" in
            production) echo "DEPLOY_PUBLIC_URL=https://commons.email" >> "$GITHUB_ENV" ;;
            staging) echo "DEPLOY_PUBLIC_URL=https://staging.commons.email" >> "$GITHUB_ENV" ;;
            main) echo "DEPLOY_PUBLIC_URL=https://main.communique-site.pages.dev" >> "$GITHUB_ENV" ;;
            *) echo "DEPLOY_PUBLIC_URL=https://${DEPLOY_BRANCH}.communique-site.pages.dev" >> "$GITHUB_ENV" ;;
          esac

      - name: Deploy
        run: |
          set -o pipefail
          deploy_output=$(mktemp)
          npx wrangler pages deploy .svelte-kit/cloudflare --project-name communique-site --branch "$DEPLOY_BRANCH" --commit-hash "$DEPLOY_SHA" 2>&1 | tee "$deploy_output"
          deployment_url=$(sed -nE 's/.*Take a peek over at (https:\/\/[a-z0-9-]+\.communique-site\.pages\.dev).*/\1/p' "$deploy_output" | head -n 1)

          if [ -z "$deployment_url" ]; then
            echo "::error::Unable to parse immutable Cloudflare Pages deployment URL from wrangler output."
            cat "$deploy_output"
            exit 1
          fi

          echo "DEPLOY_HEALTH_URL=${deployment_url}" >> "$GITHUB_ENV"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: '019d1184e655db74b7589794a2a2a533'

      - name: Purge CDN cache
        if: env.DEPLOY_BRANCH == 'production'
        run: |
          response=$(curl -sS --max-time 30 -w "\n%{http_code}" -X POST "https://api.cloudflare.com/client/v4/zones/${{ secrets.CLOUDFLARE_ZONE_ID }}/purge_cache" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"purge_everything":true}') || {
              echo "::warning::Cloudflare cache purge request failed; deployment health check will still run."
              exit 0
            }

          http_status=$(printf '%s\n' "$response" | tail -n 1)
          body=$(printf '%s\n' "$response" | sed '$d')

          if ! [[ "$http_status" =~ ^[0-9]{3}$ ]]; then
            echo "::warning::Cloudflare cache purge returned an unreadable HTTP status; deployment health check will still run."
            exit 0
          fi

          if (( http_status < 200 || http_status >= 300 )); then
            echo "::warning::Cloudflare cache purge returned HTTP ${http_status}; deployment health check will still run."
            exit 0
          fi

          if ! echo "$body" | jq -e '.success == true' >/dev/null; then
            echo "::warning::Cloudflare cache purge response did not report success; deployment health check will still run."
          fi

      - name: Verify deployment health
        run: |
          strict_atlas=false
          if [ "$DEPLOY_BRANCH" = "production" ]; then
            strict_atlas=true
          fi

          for attempt in {1..12}; do
            if response=$(curl -sS --max-time 20 -w "\n%{http_code}" "$DEPLOY_HEALTH_URL/api/health"); then
              http_status=$(printf '%s\n' "$response" | tail -n 1)
              body=$(printf '%s\n' "$response" | sed '$d')

              if echo "$body" | jq -e . >/dev/null 2>&1; then
                echo "$body"

                if [ "$strict_atlas" = "true" ]; then
                  if [ "$http_status" = "200" ] && echo "$body" | jq -e '.status == "ok"' >/dev/null; then
                    exit 0
                  fi
                elif echo "$body" | jq -e '.convex == true and .publicDiscoveryCache.kvBound == true and .atlas.configured == true and .atlas.manifest == true and .atlas.districtIndex == true' >/dev/null; then
                  if ! echo "$body" | jq -e '.atlas.rootPinned == true and .atlas.depthPinned == true' >/dev/null; then
                    echo "::warning::Non-production deploy health has atlas content reachable but root/depth are not pinned yet."
                  fi
                  exit 0
                fi
              else
                echo "Deployment health endpoint returned HTTP ${http_status} and a non-JSON body:"
                printf '%s\n' "$body" | head -c 4000
                printf '\n'
              fi
            else
              echo "Deployment health check failed on attempt ${attempt} before an HTTP response."
            fi

            echo "Deployment health check failed on attempt ${attempt}; retrying..."
            sleep 10
          done
          exit 1

      - name: Probe production domain health
        if: env.DEPLOY_BRANCH == 'production'
        run: |
          domain_challenged=false
          domain_hard_failure=false
          for attempt in {1..12}; do
            if response=$(curl -sS --max-time 20 -w "\n%{http_code}" "$DEPLOY_PUBLIC_URL/api/health"); then
              http_status=$(printf '%s\n' "$response" | tail -n 1)
              body=$(printf '%s\n' "$response" | sed '$d')

              if [ "$http_status" = "200" ] && echo "$body" | jq -e '.status == "ok"' >/dev/null 2>&1; then
                echo "$body"
                exit 0
              fi

              if echo "$body" | jq -e . >/dev/null 2>&1; then
                echo "$body"
                echo "::error::Production domain health endpoint returned JSON but not status ok."
                exit 1
              fi

              if [ "$http_status" = "403" ] && printf '%s' "$body" | grep -Eiq 'Just a moment|cf_chl|challenge-platform'; then
                domain_challenged=true
              else
                domain_hard_failure=true
              fi

              echo "Production domain probe attempt ${attempt} returned HTTP ${http_status}:"
              printf '%s\n' "$body" | head -c 4000
              printf '\n'
            else
              echo "Production domain probe failed on attempt ${attempt} before an HTTP response."
            fi

            if [ "$attempt" = "12" ]; then
              if [ "$domain_challenged" = "true" ] && [ "$domain_hard_failure" = "false" ]; then
                echo "::warning::Production domain health was blocked by a Cloudflare challenge from the GitHub runner; complete external release smoke against ${DEPLOY_PUBLIC_URL}/api/health."
                exit 0
              fi
              if [ "$domain_hard_failure" = "true" ]; then
                echo "::error::Production domain health returned an unexpected response."
                exit 1
              fi
              echo "::warning::Production domain health could not be verified from GitHub-hosted runners; complete external release smoke against ${DEPLOY_PUBLIC_URL}/api/health."
              exit 0
            fi

            sleep 10
          done

      - name: Verify public discovery cache contract
        if: env.DEPLOY_BRANCH == 'production'
        run: |
          first_headers=$(mktemp)
          second_headers=$(mktemp)
          response_body=$(mktemp)

          first_status=$(curl -sS --max-time 20 \
            -D "$first_headers" \
            -o "$response_body" \
            -w "%{http_code}" \
            "$DEPLOY_PUBLIC_URL/api/templates") || {
              echo "::warning::Could not probe the production public-discovery cache contract from the GitHub runner."
              exit 0
            }

          if [ "$first_status" = "403" ] && grep -Eiq 'Just a moment|cf_chl|challenge-platform' "$response_body"; then
            echo "::warning::Cloudflare challenged the public-discovery cache probe; complete the two-request cache-policy smoke externally."
            exit 0
          fi
          if [ "$first_status" != "200" ] || ! jq -e '.success == true' "$response_body" >/dev/null 2>&1; then
            echo "::error::Public discovery returned HTTP ${first_status} or a non-success payload."
            head -c 4000 "$response_body"
            exit 1
          fi

          cache_control=$(awk 'tolower($0) ~ /^cache-control:/ { sub(/^[^:]+:[[:space:]]*/, ""); gsub(/\r/, ""); value=$0 } END { print value }' "$first_headers")
          normalized_cache_control=$(printf '%s' "$cache_control" \
            | awk -F, '{ for (i = 1; i <= NF; i++) { value = tolower($i); gsub(/^[[:space:]]+|[[:space:]]+$/, "", value); print value } }' \
            | sort \
            | paste -sd, -)
          if [ "$normalized_cache_control" != "max-age=60,must-revalidate,public" ]; then
            echo "::error::Unexpected browser Cache-Control on /api/templates: ${cache_control:-missing}"
            exit 1
          fi

          sleep 1
          second_status=$(curl -sS --max-time 20 \
            -D "$second_headers" \
            -o "$response_body" \
            -w "%{http_code}" \
            "$DEPLOY_PUBLIC_URL/api/templates") || {
              echo "::warning::Second public-discovery cache probe failed; complete it externally."
              exit 0
            }
          if [ "$second_status" != "200" ]; then
            echo "::error::Second public-discovery cache probe returned HTTP ${second_status}."
            exit 1
          fi

          cf_cache_status=$(awk 'tolower($0) ~ /^cf-cache-status:/ { sub(/^[^:]+:[[:space:]]*/, ""); gsub(/\r/, ""); value=toupper($0) } END { print value }' "$second_headers")
          age=$(awk 'tolower($0) ~ /^age:/ { sub(/^[^:]+:[[:space:]]*/, ""); gsub(/\r/, ""); value=$0 } END { print value }' "$second_headers")
          if [ "$cf_cache_status" = "HIT" ]; then
            if ! [[ "$age" =~ ^[0-9]+$ ]]; then
              echo "::error::Front-of-Worker cache reported HIT without a valid non-negative Age header."
              exit 1
            fi
            echo "Verified optional front-of-Worker cache: CF-Cache-Status=HIT Age=${age}."
          else
            echo "::notice::No verified front-of-Worker HIT (CF-Cache-Status=${cf_cache_status:-absent}); explicit Cache API + KV remains the deployed cost boundary."
          fi

      - name: Probe production browser-mediated mDL route
        if: env.DEPLOY_BRANCH == 'production'
        run: |
          route_challenged=false
          route_hard_failure=false
          for attempt in {1..12}; do
            if response=$(curl -sS --max-time 20 -w "\n%{http_code}" \
              -X POST \
              -H "Accept: application/json" \
              -H "Origin: ${DEPLOY_PUBLIC_URL}" \
              "${DEPLOY_PUBLIC_URL}/api/identity/verify-mdl/start"); then
              http_status=$(printf '%s\n' "$response" | tail -n 1)
              body=$(printf '%s\n' "$response" | sed '$d')

              if [ "$http_status" = "401" ] && echo "$body" | jq -e '.message == "Authentication required"' >/dev/null 2>&1; then
                echo "Production browser-mediated mDL route is live and requires authentication."
                exit 0
              fi

              if [ "$http_status" = "403" ] && printf '%s' "$body" | grep -Eiq 'Just a moment|cf_chl|challenge-platform'; then
                route_challenged=true
              else
                route_hard_failure=true
              fi

              echo "Production browser-mediated mDL route attempt ${attempt} returned HTTP ${http_status}:"
              printf '%s\n' "$body" | head -c 4000
              printf '\n'
            else
              echo "Production browser-mediated mDL route attempt ${attempt} failed before an HTTP response."
            fi

            if [ "$attempt" = "12" ]; then
              if [ "$route_challenged" = "true" ] && [ "$route_hard_failure" = "false" ]; then
                echo "::warning::Production browser-mediated mDL route was blocked by a Cloudflare challenge from the GitHub runner; complete external route smoke against ${DEPLOY_PUBLIC_URL}/api/identity/verify-mdl/start."
                exit 0
              fi
              if [ "$route_hard_failure" = "true" ]; then
                echo "::error::Production browser-mediated mDL route did not return the expected authentication gate."
                exit 1
              fi
              echo "::warning::Production browser-mediated mDL route could not be verified from GitHub-hosted runners; complete external route smoke against ${DEPLOY_PUBLIC_URL}/api/identity/verify-mdl/start."
              exit 0
            fi

            sleep 10
          done

      - name: Probe production mDL readiness
        if: env.DEPLOY_BRANCH == 'production'
        env:
          INTERNAL_API_SECRET: ${{ secrets.INTERNAL_API_SECRET }}
        run: |
          if [ -z "${INTERNAL_API_SECRET:-}" ]; then
            echo "::error::INTERNAL_API_SECRET is not configured as a GitHub secret."
            exit 1
          fi

          readiness_challenged=false
          readiness_hard_failure=false
          for attempt in {1..12}; do
            if response=$(curl -sS --max-time 20 -w "\n%{http_code}" \
              -H "X-Internal-Secret: ${INTERNAL_API_SECRET}" \
              -H "X-Readiness-Origin: ${DEPLOY_PUBLIC_URL}" \
              "${DEPLOY_HEALTH_URL}/api/internal/identity/mdl-readiness"); then
              http_status=$(printf '%s\n' "${response}" | tail -n 1)
              body=$(printf '%s\n' "${response}" | sed '$d')

              if [ "${http_status}" = "200" ] && echo "${body}" | jq -e '.status == "ok"' >/dev/null 2>&1; then
                echo "${body}" | jq '{status, blockers, warnings}'
                exit 0
              fi

              if echo "${body}" | jq -e . >/dev/null 2>&1; then
                echo "${body}" | jq '{status, blockers, warnings, checks: [.checks[]? | select(.status != "ok")]}'
                readiness_hard_failure=true
              else
                if [ "${http_status}" = "403" ] && printf '%s' "${body}" | grep -Eiq 'Just a moment|cf_chl|challenge-platform'; then
                  readiness_challenged=true
                else
                  readiness_hard_failure=true
                fi
                echo "Production mDL readiness attempt ${attempt} returned HTTP ${http_status} and a non-JSON body:"
                printf '%s\n' "${body}" | head -c 4000
                printf '\n'
              fi
            else
              echo "Production mDL readiness attempt ${attempt} failed before an HTTP response."
              readiness_hard_failure=true
            fi

            if [ "${attempt}" = "12" ]; then
              if [ "${readiness_challenged}" = "true" ] && [ "${readiness_hard_failure}" = "false" ]; then
                echo "::error::Production mDL readiness was blocked by a Cloudflare challenge from the GitHub runner."
              fi
              echo "::error::Production browser-mediated mDL did not pass internal readiness."
              exit 1
            fi

            sleep 10
          done
