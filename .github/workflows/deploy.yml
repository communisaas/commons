      needs.source-verify.result == 'success' &&
      needs.source-verify.outputs.deploy_mode == 'normal' &&
      needs.build-artifact.result == 'success' &&
      needs.build-artifact-replica.result == 'success' &&
      github.ref_name == github.event.repository.default_branch &&
      ((github.event_name == 'workflow_dispatch' && needs.manual-verify.result == 'success') ||
      (github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    env:
      TRUSTED_GATE_SHA: ${{ needs.source-verify.outputs.trusted_gate_sha }}
      PRIMARY_DECLARED_DIGEST: ${{ needs.build-artifact.outputs.artifact_digest }}
      REPLICA_DECLARED_DIGEST: ${{ needs.build-artifact-replica.outputs.artifact_digest }}
    outputs:
      artifact_digest: ${{ steps.verify_artifact_consensus.outputs.digest }}
    steps:
      - name: Checkout immutable consensus gate
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.source-verify.outputs.trusted_gate_sha }}
          path: gate
          persist-credentials: false

      - name: Setup trusted consensus Node.js runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: 'gate/.node-version'

      - name: Download primary artifact by immutable id
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.build-artifact.outputs.artifact_id }}
          path: ${{ runner.temp }}/release-artifact-primary
          merge-multiple: true

      - name: Download replica artifact by immutable id
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.build-artifact-replica.outputs.artifact_id }}
          path: ${{ runner.temp }}/release-artifact-replica
          merge-multiple: true

      - name: Verify independent artifact consensus
        id: verify_artifact_consensus
        run: |
          set -euo pipefail
          test "$(git -C gate rev-parse HEAD)" = "$TRUSTED_GATE_SHA"
          primary_json=$(node gate/scripts/canonical-artifact-tree-digest.mjs \
            --artifact-root "$RUNNER_TEMP/release-artifact-primary" \
            --expected-digest "$PRIMARY_DECLARED_DIGEST")
          replica_json=$(node gate/scripts/canonical-artifact-tree-digest.mjs \
            --artifact-root "$RUNNER_TEMP/release-artifact-replica" \
            --expected-digest "$REPLICA_DECLARED_DIGEST")
          primary_digest=$(printf '%s' "$primary_json" | jq -er '.digest | select(test("^[0-9a-f]{64}$"))')
          replica_digest=$(printf '%s' "$replica_json" | jq -er '.digest | select(test("^[0-9a-f]{64}$"))')
          if [ "$primary_digest" != "$replica_digest" ]; then
            echo "::error::Independent release artifacts are not canonically identical."
            exit 1
          fi
          echo "digest=$primary_digest" >> "$GITHUB_OUTPUT"

  prepare-queue-release-kit:
    name: Prepare immutable Queue release kit before receipt approval
    needs:
      - source-verify
      - build-artifact
      - build-artifact-replica
      - artifact-consensus
    if: >-
      always() &&
      needs.source-verify.result == 'success' &&
      needs.source-verify.outputs.deploy_mode == 'normal' &&
      needs.build-artifact.result == 'success' &&
      needs.build-artifact-replica.result == 'success' &&
      needs.artifact-consensus.result == 'success' &&
      ((github.event_name == 'workflow_dispatch' &&
      (inputs.branch == 'production' || inputs.branch == 'staging')) ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.head_branch == 'staging')) &&
      github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    env:
      DEPLOY_SHA: ${{ needs.source-verify.outputs.verified_sha }}
      TRUSTED_GATE_SHA: ${{ needs.source-verify.outputs.trusted_gate_sha }}
      ARTIFACT_DIGEST: ${{ needs.artifact-consensus.outputs.artifact_digest }}
    outputs:
      artifact_id: ${{ steps.upload_release_kit.outputs.artifact-id }}
      kit_digest: ${{ steps.build_release_kit.outputs.kit_digest }}
      artifact_digest: ${{ steps.build_release_kit.outputs.artifact_digest }}
      source_sha: ${{ steps.build_release_kit.outputs.source_sha }}
      trusted_gate_sha: ${{ steps.build_release_kit.outputs.trusted_gate_sha }}
    steps:
      - name: Checkout immutable protected Queue release gate
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        timeout-minutes: 5
        with:
          ref: ${{ needs.source-verify.outputs.trusted_gate_sha }}
          path: gate
          persist-credentials: false

      - name: Setup immutable Queue release runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        timeout-minutes: 5
        with:
          node-version-file: 'gate/.node-version'
          cache: npm
          cache-dependency-path: 'gate/.github/release-gate/package-lock.json'

      - name: Install immutable Queue release tooling
        timeout-minutes: 10
        run: |
          set -euo pipefail
          test "$(git -C gate rev-parse HEAD)" = "$TRUSTED_GATE_SHA"
          npm ci --ignore-scripts --prefix gate/.github/release-gate
          test ! -e gate/node_modules
          ln -s .github/release-gate/node_modules gate/node_modules

      - name: Download consensus artifact into release kit
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        timeout-minutes: 3
        with:
          artifact-ids: ${{ needs.build-artifact.outputs.artifact_id }}
          path: ${{ runner.temp }}/queue-release-kit/release-artifact
          merge-multiple: true

      - name: Build canonical immutable Queue release kit
        id: build_release_kit
        timeout-minutes: 3
        run: |
          set -euo pipefail
          kit_root="$RUNNER_TEMP/queue-release-kit"
          node gate/scripts/canonical-artifact-tree-digest.mjs \
            --artifact-root "$kit_root/release-artifact" \
            --expected-digest "$ARTIFACT_DIGEST"
          mv gate "$kit_root/gate"
          mkdir -p "$kit_root/pages-config"
          cp "$kit_root/gate/wrangler.toml" "$kit_root/pages-config/wrangler.toml"
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner \
            -C "$RUNNER_TEMP" -cf "$RUNNER_TEMP/queue-release-kit.tar" queue-release-kit
          gzip -n "$RUNNER_TEMP/queue-release-kit.tar"
          kit_digest=$(sha256sum "$RUNNER_TEMP/queue-release-kit.tar.gz" | awk '{print $1}')
          test "${#kit_digest}" = 64
          {
            echo "kit_digest=$kit_digest"
            echo "artifact_digest=$ARTIFACT_DIGEST"
            echo "source_sha=$DEPLOY_SHA"
            echo "trusted_gate_sha=$TRUSTED_GATE_SHA"
          } >> "$GITHUB_OUTPUT"

      - name: Upload immutable Queue release kit
        id: upload_release_kit
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        timeout-minutes: 3
        with:
          name: queue-release-kit-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/queue-release-kit.tar.gz
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  activate-preview:
    name: Activate preview Queue producer with a fresh account-wide receipt
    needs:
      - source-verify
      - build-artifact
      - build-artifact-replica
      - artifact-consensus
      - prepare-queue-release-kit
    if: >-
      always() &&
      needs.source-verify.result == 'success' &&
      needs.source-verify.outputs.deploy_mode == 'normal' &&
      ((github.event_name == 'workflow_dispatch' &&
      (inputs.branch == 'production' || inputs.branch == 'staging')) ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.head_branch == 'staging')) &&
      needs.build-artifact.result == 'success' &&
      needs.build-artifact-replica.result == 'success' &&
      needs.artifact-consensus.result == 'success' &&
      needs.prepare-queue-release-kit.result == 'success' &&
      needs.prepare-queue-release-kit.outputs.source_sha == needs.source-verify.outputs.verified_sha &&
      needs.prepare-queue-release-kit.outputs.artifact_digest == needs.artifact-consensus.outputs.artifact_digest &&
      needs.prepare-queue-release-kit.outputs.trusted_gate_sha == needs.source-verify.outputs.trusted_gate_sha &&
      github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    # Receipt success is bounded to 2+2+2+1+20 = 27 minutes after
    # Environment approval; the remaining job budget is recovery-only.
    timeout-minutes: 55
    environment:
      # Approval happens only after the operator has contained preview and
      # captured this phase's settled account-wide receipt.
      name: Staging
    permissions:
      actions: read
      contents: read
    env:
      DEPLOY_SHA: ${{ needs.source-verify.outputs.verified_sha }}
      TRUSTED_GATE_SHA: ${{ needs.source-verify.outputs.trusted_gate_sha }}
      ARTIFACT_ROOT: ${{ github.workspace }}/queue-release-kit/release-artifact
      ARTIFACT_DIGEST: ${{ needs.artifact-consensus.outputs.artifact_digest }}
    outputs:
      artifact_digest: ${{ steps.preview_phase.outputs.artifact_digest }}
      source_sha: ${{ steps.preview_phase.outputs.source_sha }}
      release_phase: ${{ steps.preview_phase.outputs.release_phase }}
      activation_completed_at: ${{ steps.preview_phase.outputs.completed_at }}
      pages_deployment_id: ${{ steps.preview_phase.outputs.pages_deployment_id }}
      og_version_id: ${{ steps.preview_phase.outputs.og_version_id }}
      trusted_gate_sha: ${{ steps.preview_phase.outputs.trusted_gate_sha }}
      receipt_captured_at: ${{ steps.preview_phase.outputs.receipt_captured_at }}
      receipt_verification_deadline: ${{ steps.preview_phase.outputs.receipt_verification_deadline }}
      release_lease_id: ${{ steps.preview_phase.outputs.release_lease_id }}
      journal_artifact_id: ${{ steps.persist_preview_journal.outputs.artifact-id }}
    steps:
      - name: Download pre-proved immutable Queue release kit
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        timeout-minutes: 2
        with:
          artifact-ids: ${{ needs.prepare-queue-release-kit.outputs.artifact_id }}
          path: ${{ runner.temp }}/queue-release-kit-download

      - name: Verify and extract immutable Queue release kit
        timeout-minutes: 2
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/queue-release-kit-download/queue-release-kit.tar.gz"
          test "$(sha256sum "$archive" | awk '{print $1}')" = "${{ needs.prepare-queue-release-kit.outputs.kit_digest }}"
          tar -xzf "$archive" -C "$GITHUB_WORKSPACE"
          ln -s queue-release-kit/gate gate
          test "$(git -C gate rev-parse HEAD)" = "$TRUSTED_GATE_SHA"
          node gate/scripts/canonical-artifact-tree-digest.mjs \
            --artifact-root "$ARTIFACT_ROOT" \
            --expected-digest "$ARTIFACT_DIGEST"
          echo "PREVIEW_PAGES_CONFIG_CWD=$GITHUB_WORKSPACE/queue-release-kit/pages-config" >> "$GITHUB_ENV"

      - name: Setup exact preview activation Node runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        timeout-minutes: 2
        with:
          node-version-file: 'gate/.node-version'

      - name: Prove private preview storage before any preview mutation
        timeout-minutes: 5
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.PROTECTED_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: '019d1184e655db74b7589794a2a2a533'
        run: >-
          node gate/scripts/reconcile-public-discovery-r2-lifecycle.mjs
          --environment preview

      - name: Require the bounded preview discovery producer before activation
        timeout-minutes: 2
        env:
          PUBLIC_CONVEX_URL: https://outstanding-firefly-831.convex.cloud
          INTERNAL_API_SECRET: ${{ secrets.PROTECTED_INTERNAL_API_SECRET }}
          DISCOVERY_MANIFEST_REFRESH_SECRET: ${{ secrets.PROTECTED_DISCOVERY_MANIFEST_REFRESH_SECRET }}
          PUBLIC_DISCOVERY_REQUIRE_CONTENT: 'false'
          PUBLIC_DISCOVERY_CONTRACT_ONLY: 'true'
        run: |
          set -euo pipefail
          if [ "${#INTERNAL_API_SECRET}" -lt 32 ] || \
            [ "${#DISCOVERY_MANIFEST_REFRESH_SECRET}" -lt 32 ]; then
            echo "::error::Preview producer proof capabilities are absent or too short."
            exit 1
          fi
          node gate/scripts/verify-public-discovery-readiness.mjs

      - name: Prove preview Convex has zero cron authority before activation
        timeout-minutes: 2
        env:
          PROTECTED_CONVEX_PREVIEW_CRON_DATA_VIEW_DEPLOY_KEY: ${{ secrets.PROTECTED_CONVEX_PREVIEW_CRON_DATA_VIEW_DEPLOY_KEY }}
        run: >-
          node gate/scripts/verify-convex-contained-cron-deployments.mjs
          --environment preview
          --expected-state running

      - name: Materialize fresh preview-only Queue Free receipt
        timeout-minutes: 1
        env:
          QUEUE_FREE_ATTESTATION_B64: ${{ secrets.PROTECTED_CLOUDFLARE_QUEUE_FREE_ACTIVATE_PREVIEW_ATTESTATION_B64 }}
          QUEUE_FREE_SIGNATURE_B64: ${{ secrets.PROTECTED_CLOUDFLARE_QUEUE_FREE_ACTIVATE_PREVIEW_SIGNATURE_B64 }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$QUEUE_FREE_ATTESTATION_B64"
          test -n "$QUEUE_FREE_SIGNATURE_B64"
          attestation="$RUNNER_TEMP/cloudflare-queue-preview.json"
          signature="$RUNNER_TEMP/cloudflare-queue-preview.sig"
          printf '%s' "$QUEUE_FREE_ATTESTATION_B64" | base64 --decode > "$attestation"
          printf '%s' "$QUEUE_FREE_SIGNATURE_B64" | base64 --decode > "$signature"
          test -s "$attestation"
          test -s "$signature"
          {
            echo "QUEUE_FREE_ATTESTATION_PATH=$attestation"
            echo "QUEUE_FREE_SIGNATURE_PATH=$signature"
          } >> "$GITHUB_ENV"

      - name: Execute receipt-scoped preview activation transaction
        id: preview_phase
        # The runner enforces a 20-minute success window. The wider step bound
        # reserves time for in-process recovery after a bounded command timeout.
        timeout-minutes: 35
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.PROTECTED_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: '019d1184e655db74b7589794a2a2a533'
          RELEASE_CONTROL_SECRET: ${{ secrets.PROTECTED_RELEASE_CONTROL_SECRET_PREVIEW }}
        run: |
          set -euo pipefail
          result=$(node gate/scripts/run-public-template-og-release-phase.mjs \
            --realm preview \
            --branch staging \
            --artifact-root "$ARTIFACT_ROOT" \
            --artifact-digest "$ARTIFACT_DIGEST" \
            --release-kit "$RUNNER_TEMP/queue-release-kit-download/queue-release-kit.tar.gz" \
            --release-kit-digest "${{ needs.prepare-queue-release-kit.outputs.kit_digest }}" \
            --repository "$GITHUB_REPOSITORY" \
            --repository-id "$GITHUB_REPOSITORY_ID" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --transaction-id "$RELEASE_TRANSACTION_ID" \
            --trusted-root gate \
            --wrangler gate/.github/release-gate/node_modules/.bin/wrangler \
            --pages-config-cwd "$PREVIEW_PAGES_CONFIG_CWD" \
            --attestation "$QUEUE_FREE_ATTESTATION_PATH" \
            --signature "$QUEUE_FREE_SIGNATURE_PATH" \
            --source-sha "$DEPLOY_SHA" \
            --trusted-gate-sha "$TRUSTED_GATE_SHA" \
            --pages-output "$RUNNER_TEMP/pages-deploy-output.txt" \
            --journal "$RUNNER_TEMP/public-template-og-preview-release-journal.json" \
            --coordination-capture none \
            --preview-pages-deployment-id none \
            --preview-og-version-id none \
            --preview-proof none)
          printf '%s' "$result" | jq -e \
            --arg sha "$DEPLOY_SHA" \
            --arg digest "$ARTIFACT_DIGEST" \
            --arg gate "$TRUSTED_GATE_SHA" \
            '.realm == "preview" and .releasePhase == "activate-preview" and
             .releaseSha == $sha and .producerBound == true and
             .deliveryPaused == false and .stagingRuntimeProved == false and
             .targetRuntimeProved == false and .candidateFetchProved == false and
             .artifactDigest == $digest and .trustedGateSha == $gate and
             (.pagesDeploymentId | test("^[0-9a-f-]{32,36}$")) and
             (.ogVersionId | test("^[0-9a-f-]{32,36}$")) and
             (.receiptCapturedAt | type == "string") and
             (.receiptVerificationDeadlineAt | type == "string") and
             (.releaseAuthorityLeaseId | test("^[0-9a-f-]{36}$")) and
             .unmanagedAuthorityUnchanged == true' >/dev/null
          {
            echo "artifact_digest=$ARTIFACT_DIGEST"
            echo "source_sha=$DEPLOY_SHA"
            echo "release_phase=activate-preview"
            echo "pages_deployment_id=$(printf '%s' "$result" | jq -er '.pagesDeploymentId')"
            echo "og_version_id=$(printf '%s' "$result" | jq -er '.ogVersionId')"
            echo "trusted_gate_sha=$(printf '%s' "$result" | jq -er '.trustedGateSha')"
            echo "receipt_captured_at=$(printf '%s' "$result" | jq -er '.receiptCapturedAt')"
            echo "receipt_verification_deadline=$(printf '%s' "$result" | jq -er '.receiptVerificationDeadlineAt')"
            echo "release_lease_id=$(printf '%s' "$result" | jq -er '.releaseAuthorityLeaseId')"
            echo "completed_at=$(date -u +'%Y-%m-%dT%H:%M:%S.000Z')"
          } >> "$GITHUB_OUTPUT"

      - name: Recover an interrupted preview activation from its durable journal
        if: always()
        timeout-minutes: 8
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.PROTECTED_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: '019d1184e655db74b7589794a2a2a533'
          RELEASE_CONTROL_SECRET: ${{ secrets.PROTECTED_RELEASE_CONTROL_SECRET_PREVIEW }}
        run: |
          recovery_result="$RUNNER_TEMP/public-template-og-preview-activation-recovery.json"
          node gate/scripts/run-public-template-og-release-phase.mjs recover \
            --journal "$RUNNER_TEMP/public-template-og-preview-release-journal.json" \
            --trusted-root gate \
            --wrangler gate/.github/release-gate/node_modules/.bin/wrangler \
            --realm preview \
            --source-sha "$DEPLOY_SHA" \
            --trusted-gate-sha "$TRUSTED_GATE_SHA" \
            --artifact-digest "$ARTIFACT_DIGEST" \
            --release-kit-digest "${{ needs.prepare-queue-release-kit.outputs.kit_digest }}" \
            --repository "$GITHUB_REPOSITORY" \
            --repository-id "$GITHUB_REPOSITORY_ID" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --transaction-id "$RELEASE_TRANSACTION_ID" \
            --force false > "$recovery_result"

      - name: Prune failed preview activation exposure after journal recovery
        if: always() && (failure() || cancelled())
        timeout-minutes: 15
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.PROTECTED_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: '019d1184e655db74b7589794a2a2a533'
          CF_PAGES_PROJECT: communique-site
          CF_PAGES_ALLOWED_ALIAS_BRANCHES: production
        run: |
          set -euo pipefail
          test -s "$RUNNER_TEMP/public-template-og-preview-activation-recovery.json"
          reconciliation=$(node gate/scripts/reconcile-cloudflare-pages-exposure.mjs --prune)
          printf '%s\n' "$reconciliation"
          if ! grep -q 'stale=0;' <<<"$reconciliation" || \
            ! grep -q 'preserved=0;' <<<"$reconciliation"; then
            echo "::error::Preview activation recovery retained an exposed candidate deployment."
            exit 1
          fi

      - name: Persist preview recovery journal for post-activation qualification
        id: persist_preview_journal
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: public-template-og-preview-release-journal-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/public-template-og-preview-release-journal.json
          if-no-files-found: ignore
          retention-days: 1

  qualify-preview-generation:
    name: Qualify the inert exact staging candidate after preview activation
    needs:
      - source-verify
      - artifact-consensus
      - prepare-queue-release-kit
      - activate-preview
    if: >-
      always() &&
      needs.source-verify.result == 'success' &&
      needs.artifact-consensus.result == 'success' &&
      needs.prepare-queue-release-kit.result == 'success' &&
      needs.activate-preview.result == 'success' &&
      needs.prepare-queue-release-kit.outputs.source_sha == needs.source-verify.outputs.verified_sha &&
      needs.prepare-queue-release-kit.outputs.artifact_digest == needs.artifact-consensus.outputs.artifact_digest &&
      needs.prepare-queue-release-kit.outputs.trusted_gate_sha == needs.source-verify.outputs.trusted_gate_sha &&
      needs.activate-preview.outputs.source_sha == needs.source-verify.outputs.verified_sha &&
      needs.activate-preview.outputs.artifact_digest == needs.artifact-consensus.outputs.artifact_digest &&
      needs.activate-preview.outputs.trusted_gate_sha == needs.source-verify.outputs.trusted_gate_sha &&
      needs.activate-preview.outputs.journal_artifact_id != ''
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: Staging
    permissions:
      actions: read
      contents: read
    env:
      DEPLOY_SHA: ${{ needs.source-verify.outputs.verified_sha }}
      TRUSTED_GATE_SHA: ${{ needs.source-verify.outputs.trusted_gate_sha }}
      ARTIFACT_DIGEST: ${{ needs.artifact-consensus.outputs.artifact_digest }}
      PREVIEW_PAGES_DEPLOYMENT_ID: ${{ needs.activate-preview.outputs.pages_deployment_id }}
      PREVIEW_OG_VERSION_ID: ${{ needs.activate-preview.outputs.og_version_id }}
    outputs:
      artifact_digest: ${{ steps.qualify_generation.outputs.artifact_digest }}
      source_sha: ${{ steps.qualify_generation.outputs.source_sha }}
      trusted_gate_sha: ${{ steps.qualify_generation.outputs.trusted_gate_sha }}
      pages_deployment_id: ${{ steps.qualify_generation.outputs.pages_deployment_id }}
      og_version_id: ${{ steps.qualify_generation.outputs.og_version_id }}
      proof: ${{ steps.qualify_generation.outputs.proof }}
      completed_at: ${{ steps.qualify_generation.outputs.completed_at }}
      runtime_proved: ${{ steps.qualify_generation.outputs.runtime_proved }}
    steps:
      - name: Checkout immutable protected qualification gate
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        timeout-minutes: 5
        with:
          ref: ${{ needs.source-verify.outputs.trusted_gate_sha }}
          path: gate
          persist-credentials: false

      - name: Setup trusted qualification runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        timeout-minutes: 5
        with:
          node-version-file: 'gate/.node-version'
          cache: npm
          cache-dependency-path: 'gate/.github/release-gate/package-lock.json'

      - name: Install immutable qualification tooling
        timeout-minutes: 10
        run: |
          set -euo pipefail
          test "$(git -C gate rev-parse HEAD)" = "$TRUSTED_GATE_SHA"
          npm ci --ignore-scripts --prefix gate/.github/release-gate
          test ! -e gate/node_modules
          ln -s .github/release-gate/node_modules gate/node_modules

      - name: Download immutable kit for staging edge qualification
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        timeout-minutes: 3
        with:
          artifact-ids: ${{ needs.prepare-queue-release-kit.outputs.artifact_id }}
          path: ${{ runner.temp }}/preview-qualification-kit-download

      - name: Verify and extract staging edge qualification kit
        timeout-minutes: 3
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/preview-qualification-kit-download/queue-release-kit.tar.gz"
          test "$(sha256sum "$archive" | awk '{print $1}')" = "${{ needs.prepare-queue-release-kit.outputs.kit_digest }}"
          kit_root="$RUNNER_TEMP/preview-qualification-kit"
          mkdir -p "$kit_root"
          tar -xzf "$archive" -C "$kit_root"
          edge_artifact_root="$kit_root/queue-release-kit/release-artifact"
          node gate/scripts/canonical-artifact-tree-digest.mjs \
            --artifact-root "$edge_artifact_root" \
            --expected-digest "$ARTIFACT_DIGEST"
          echo "EDGE_ARTIFACT_ROOT=$edge_artifact_root" >> "$GITHUB_ENV"

      - name: Download exact preview recovery journal
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        timeout-minutes: 2
        with:
          artifact-ids: ${{ needs.activate-preview.outputs.journal_artifact_id }}
          path: ${{ runner.temp }}/preview-release-journal

      - name: Re-prove preview Convex cron containment before candidate qualification
        timeout-minutes: 2
        env:
          PROTECTED_CONVEX_PREVIEW_CRON_DATA_VIEW_DEPLOY_KEY: ${{ secrets.PROTECTED_CONVEX_PREVIEW_CRON_DATA_VIEW_DEPLOY_KEY }}
        run: >-
          node gate/scripts/verify-convex-contained-cron-deployments.mjs
          --environment preview
          --expected-state running

      - name: Prove exact inert Pages publication before candidate dispatch
        timeout-minutes: 5
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.PROTECTED_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: '019d1184e655db74b7589794a2a2a533'
          PUBLIC_RELEASE_TRANSACTION_ID: ${{ env.RELEASE_TRANSACTION_ID }}
        run: |
          set -euo pipefail
          test "$(git -C gate rev-parse HEAD)" = "$TRUSTED_GATE_SHA"
          test -n "$PREVIEW_PAGES_DEPLOYMENT_ID"
          test -n "$PREVIEW_OG_VERSION_ID"
          pages=$(DEPLOY_BRANCH=staging DEPLOY_SHA="$DEPLOY_SHA" \
            node gate/scripts/verify-pages-preview-release.mjs)
          test "$(printf '%s' "$pages" | jq -er '.deploymentId')" = "$PREVIEW_PAGES_DEPLOYMENT_ID"
          node gate/scripts/verify-pages-durable-object-binding.mjs --environment preview

      - name: Deploy and prove the exact trusted staging edge
        id: deploy_staging_edge
        timeout-minutes: 10
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.PROTECTED_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: '019d1184e655db74b7589794a2a2a533'
          CLOUDFLARE_ZONE_ID: ${{ secrets.PROTECTED_CLOUDFLARE_ZONE_ID }}
          PAGES_ORIGIN_ACCESS_TOKEN: ${{ secrets.PROTECTED_PAGES_ORIGIN_ACCESS_TOKEN_PREVIEW }}
          PAGES_ORIGIN_ACCESS_SERVICE_TOKEN_ID_PREVIEW: ${{ secrets.PROTECTED_PAGES_ORIGIN_ACCESS_SERVICE_TOKEN_ID_PREVIEW }}
          RELEASE_PROBE_SECRET: ${{ secrets.PROTECTED_RELEASE_PROBE_SECRET_PREVIEW }}
          PUBLIC_RELEASE_TRANSACTION_ID: ${{ env.RELEASE_TRANSACTION_ID }}
        run: |
          set -euo pipefail
          worker=commons-trusted-pages-edge-staging
          capture="$RUNNER_TEMP/trusted-pages-edge-staging-before.json"
          settings_body="$RUNNER_TEMP/trusted-pages-edge-staging-settings.json"
          settings_status=$(curl -sS --max-time 30 -o "$settings_body" -w '%{http_code}' \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${worker}/settings")
          case "$settings_status" in
            200)
              previous_status="$RUNNER_TEMP/trusted-pages-edge-staging-previous-deployment.json"
              gate/.github/release-gate/node_modules/.bin/wrangler deployments status \
                --name "$worker" --json > "$previous_status"
              previous_version_id=$(jq -er \
                '.versions | select(length == 1) | .[0] | select(.percentage == 100) | .version_id' \
                "$previous_status")
              if ! [[ "$previous_version_id" =~ ^([a-f0-9]{32}|[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12})$ ]]; then
                echo "::error::The prior staging edge version is invalid."
                exit 1
              fi
              jq -n --arg version "$previous_version_id" \
                '{state:"present",versionId:$version}' > "$capture"
              routes_file="$RUNNER_TEMP/trusted-pages-edge-staging-routes-before.json"
              curl -fsS --max-time 30 \
                -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/workers/routes" \
                > "$routes_file"
              node gate/scripts/verify-trusted-pages-release-edge.mjs verify-route-inventory \
                --environment preview \
                --expected present \
                < "$routes_file" >/dev/null
              ;;
            404)
              routes_file="$RUNNER_TEMP/trusted-pages-edge-staging-routes-before.json"
              curl -fsS --max-time 30 \
                -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/workers/routes" \
                > "$routes_file"
              node gate/scripts/verify-trusted-pages-release-edge.mjs verify-route-inventory \
                --environment preview \
                --expected absent \
                < "$routes_file" >/dev/null
              jq -n '{state:"absent"}' > "$capture"
              ;;
            *)
              echo "::error::Could not capture the prior trusted staging edge (HTTP ${settings_status})."
              exit 1
              ;;
          esac
          chmod 600 "$capture"

          node gate/scripts/finalize-trusted-release-worker.mjs validate \
            --artifact-root "$EDGE_ARTIFACT_ROOT" \
            --trusted-source-root gate \
            --profile trusted-pages-edge-staging
          if ! printf '%s' "$PAGES_ORIGIN_ACCESS_TOKEN" | jq -e \
            'type == "object" and (keys | sort) == ["cf-access-client-id","cf-access-client-secret"] and
             (."cf-access-client-id" | type == "string" and test("^[A-Za-z0-9._-]{16,256}$")) and
             (."cf-access-client-secret" | type == "string" and test("^[A-Za-z0-9._-]{32,512}$"))' \
            >/dev/null; then
            echo "::error::The staging origin Access capability is malformed."
            exit 1
          fi
          probe_bytes=$(printf '%s' "$RELEASE_PROBE_SECRET" | wc -c | tr -d ' ')
          if [ "$probe_bytes" -lt 32 ] || [ "$probe_bytes" -gt 512 ] || \
            [ "$PAGES_ORIGIN_ACCESS_TOKEN" = "$RELEASE_PROBE_SECRET" ] || \
            ! [[ "$PAGES_ORIGIN_ACCESS_SERVICE_TOKEN_ID_PREVIEW" =~ ^[a-f0-9]{32}$ ]]; then
            echo "::error::Staging edge capabilities are absent, malformed, or reused."
            exit 1
          fi
          umask 077
          secrets_file="$RUNNER_TEMP/trusted-pages-edge-staging-secrets.json"
          trap 'rm -f "$secrets_file"' EXIT
          jq -n \
            --arg access "$PAGES_ORIGIN_ACCESS_TOKEN" \
            --arg probe "$RELEASE_PROBE_SECRET" \
            '{PAGES_ORIGIN_ACCESS_TOKEN:$access,RELEASE_PROBE_SECRET:$probe}' \
            > "$secrets_file"
          : > "$RUNNER_TEMP/trusted-pages-edge-staging-deploy-attempted"
          gate/.github/release-gate/node_modules/.bin/wrangler deploy \
            "$EDGE_ARTIFACT_ROOT/trusted-pages-edge-staging/index.js" \
            --no-bundle \
            --config gate/wrangler.trusted-pages-release-edge-staging.toml \
            --var "PUBLIC_RELEASE_TRANSACTION_ID:${RELEASE_TRANSACTION_ID}" \
            --secrets-file "$secrets_file" \
            --tag "$DEPLOY_SHA" \
            --message "Exact-SHA trusted staging Pages edge transaction ${RELEASE_TRANSACTION_ID}"
          rm -f "$secrets_file"
          trap - EXIT

          current_status="$RUNNER_TEMP/trusted-pages-edge-staging-current-deployment.json"
          current_version="$RUNNER_TEMP/trusted-pages-edge-staging-current-version.json"
          gate/.github/release-gate/node_modules/.bin/wrangler deployments status \
            --name "$worker" --json > "$current_status"
          current_version_id=$(jq -er \
            '.versions | select(length == 1) | .[0] | select(.percentage == 100) | .version_id' \
            "$current_status")
          gate/.github/release-gate/node_modules/.bin/wrangler versions view "$current_version_id" \
            --name "$worker" --json > "$current_version"
          jq -e --arg sha "$DEPLOY_SHA" '.annotations["workers/tag"] == $sha' \
            "$current_version" >/dev/null
          node gate/scripts/verify-trusted-pages-release-edge.mjs --environment preview >/dev/null

      - name: Probe the inert candidate with its sole purpose capability
        id: probe_candidate
        timeout-minutes: 3
        env:
          RELEASE_PROBE_SECRET: ${{ secrets.PROTECTED_RELEASE_PROBE_SECRET_PREVIEW }}
        run: |
          set -euo pipefail
          result=$(node gate/scripts/qualify-public-discovery-generation.mjs \
            --environment preview \
            --source-sha "$DEPLOY_SHA" \
            --transaction-id "$RELEASE_TRANSACTION_ID")
          printf '%s' "$result" | jq -e \
            --arg sha "$DEPLOY_SHA" \
            --arg transaction "$RELEASE_TRANSACTION_ID" \
            '.environment == "preview" and .releaseSha == $sha and .transactionId == $transaction and
             .proof == "candidate-fetch-completed" and .candidateFetchProved == true and
             (.completedAt | type == "string")' >/dev/null
          {
            echo "proof=$(printf '%s' "$result" | jq -er '.proof')"
            echo "completed_at=$(printf '%s' "$result" | jq -er '.completedAt')"
          } >> "$GITHUB_OUTPUT"

      - name: Qualify and finalize preview through trusted authority controls
        id: qualify_generation
        timeout-minutes: 52
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.PROTECTED_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: '019d1184e655db74b7589794a2a2a533'
          RELEASE_CONTROL_SECRET: ${{ secrets.PROTECTED_RELEASE_CONTROL_SECRET_PREVIEW }}
          QUEUE_FREE_ATTESTATION_B64: ${{ secrets.PROTECTED_CLOUDFLARE_QUEUE_FREE_ACTIVATE_PREVIEW_ATTESTATION_B64 }}
          QUEUE_FREE_SIGNATURE_B64: ${{ secrets.PROTECTED_CLOUDFLARE_QUEUE_FREE_ACTIVATE_PREVIEW_SIGNATURE_B64 }}
        run: |
          set -euo pipefail
          test "${{ steps.probe_candidate.outputs.proof }}" = "candidate-fetch-completed"
          test "$(git -C gate rev-parse HEAD)" = "$TRUSTED_GATE_SHA"
          journal="$RUNNER_TEMP/preview-release-journal/public-template-og-preview-release-journal.json"
          release_lease_id=$(jq -er '.releaseAuthority.leaseId' "$journal")
          receipt_deadline=$(jq -er '.receipt.verificationDeadlineAt' "$journal")
          test "$release_lease_id" = "${{ needs.activate-preview.outputs.release_lease_id }}"
          test "$receipt_deadline" = "${{ needs.activate-preview.outputs.receipt_verification_deadline }}"
          umask 077
          attestation="$RUNNER_TEMP/cloudflare-queue-preview-qualification.json"
          signature="$RUNNER_TEMP/cloudflare-queue-preview-qualification.sig"
          printf '%s' "$QUEUE_FREE_ATTESTATION_B64" | base64 --decode > "$attestation"
          printf '%s' "$QUEUE_FREE_SIGNATURE_B64" | base64 --decode > "$signature"
          status_file="$RUNNER_TEMP/public-template-og-preview-qualified-deployment.json"
          version_file="$RUNNER_TEMP/public-template-og-preview-qualified-version.json"
          gate/.github/release-gate/node_modules/.bin/wrangler deployments status \
            --name commons-public-template-og-nonprod --json > "$status_file"
          live_version=$(jq -er \
            '.versions | select(length == 1) | .[0] | select(.percentage == 100) | .version_id' \
            "$status_file")
          test "$live_version" = "$PREVIEW_OG_VERSION_ID"
          gate/.github/release-gate/node_modules/.bin/wrangler versions view "$live_version" \
            --name commons-public-template-og-nonprod --json > "$version_file"
          node gate/scripts/verify-public-template-og-deployment.mjs \
            --environment preview \
            --config gate/wrangler.public-template-og.toml \
            --expected-source-sha "$DEPLOY_SHA" \
            --expected-transaction-id "$RELEASE_TRANSACTION_ID" \
            --deployment-status "$status_file" \
            --active-version "$version_file" \
            --producer-posture bound \
            --delivery-posture active
          qualified=$(node gate/scripts/qualify-public-discovery-generation.mjs qualify-preview-authority \
            --environment preview \
            --source-sha "$DEPLOY_SHA" \
            --transaction-id "$RELEASE_TRANSACTION_ID" \
            --release-lease-id "$release_lease_id" \
            --receipt-verification-deadline "$receipt_deadline" \
            --attestation "$attestation" \
            --signature "$signature" \
            --allowed-signers gate/.github/cloudflare-queue-allowed-signers)
          printf '%s' "$qualified" | jq -e \
            --arg sha "$DEPLOY_SHA" \
            --arg transaction "$RELEASE_TRANSACTION_ID" \
            '.environment == "preview" and .releaseSha == $sha and .transactionId == $transaction and
             .releaseAuthorityQualified == true and
             .receiptVerificationDeadlineAt == "${{ needs.activate-preview.outputs.receipt_verification_deadline }}"' >/dev/null
          finalized=$(node gate/scripts/qualify-public-discovery-generation.mjs finalize \
            --environment preview \
            --source-sha "$DEPLOY_SHA" \
            --transaction-id "$RELEASE_TRANSACTION_ID" \
            --release-lease-id "$release_lease_id" \
            --receipt-verification-deadline "$receipt_deadline" \
            --attestation "$attestation" \
            --signature "$signature" \
            --allowed-signers gate/.github/cloudflare-queue-allowed-signers)
          printf '%s' "$finalized" | jq -e --arg sha "$DEPLOY_SHA" --arg transaction "$RELEASE_TRANSACTION_ID" \
            '.environment == "preview" and .releaseSha == $sha and .transactionId == $transaction and
             .releaseAuthorityFinalized == true' >/dev/null
          {
            echo "artifact_digest=$ARTIFACT_DIGEST"
            echo "source_sha=$DEPLOY_SHA"
            echo "trusted_gate_sha=$TRUSTED_GATE_SHA"
            echo "pages_deployment_id=$PREVIEW_PAGES_DEPLOYMENT_ID"
            echo "og_version_id=$PREVIEW_OG_VERSION_ID"
            echo "proof=${{ steps.probe_candidate.outputs.proof }}"
            echo "completed_at=${{ steps.probe_candidate.outputs.completed_at }}"
            echo "runtime_proved=true"
          } >> "$GITHUB_OUTPUT"

      - name: Reconcile successful staging candidate exposure
        if: success()
        timeout-minutes: 15
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.PROTECTED_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: '019d1184e655db74b7589794a2a2a533'
          CF_PAGES_PROJECT: communique-site
          CF_PAGES_ALLOWED_ALIAS_BRANCHES: production,staging
        run: |
          set -euo pipefail
          reconciliation=$(node gate/scripts/reconcile-cloudflare-pages-exposure.mjs --prune)
          printf '%s\n' "$reconciliation"
          if ! grep -q 'stale=0;' <<<"$reconciliation" || \
            ! grep -q 'preserved=0;' <<<"$reconciliation"; then
            echo "::error::Staging qualification retained an undeclared Pages deployment."
            exit 1
          fi

      - name: Force containment and exact rollback when preview qualification fails
        if: always() && (failure() || cancelled())
        timeout-minutes: 8
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.PROTECTED_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: '019d1184e655db74b7589794a2a2a533'
          RELEASE_CONTROL_SECRET: ${{ secrets.PROTECTED_RELEASE_CONTROL_SECRET_PREVIEW }}
        run: |
          journal="$RUNNER_TEMP/preview-release-journal/public-template-og-preview-release-journal.json"
          recovery_result="$RUNNER_TEMP/public-template-og-preview-qualification-recovery.json"
          node gate/scripts/run-public-template-og-release-phase.mjs recover \
            --journal "$journal" \
            --trusted-root gate \
            --wrangler gate/.github/release-gate/node_modules/.bin/wrangler \
            --realm preview \
            --source-sha "$DEPLOY_SHA" \
            --trusted-gate-sha "$TRUSTED_GATE_SHA" \
            --artifact-digest "$ARTIFACT_DIGEST" \
            --release-kit-digest "${{ needs.prepare-queue-release-kit.outputs.kit_digest }}" \
            --repository "$GITHUB_REPOSITORY" \
            --repository-id "$GITHUB_REPOSITORY_ID" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --transaction-id "$RELEASE_TRANSACTION_ID" \
            --force true > "$recovery_result"
          jq -e \
            --arg sha "$DEPLOY_SHA" \
            --arg transaction "$RELEASE_TRANSACTION_ID" \
            '.sourceSha == $sha and .transactionId == $transaction and
             ((.recovered == true and .reason == "recovered") or
              (.recovered == false and (.reason == "committed-terminal" or .reason == "superseded")))' \
            "$recovery_result" >/dev/null

      - name: Restore the prior trusted staging edge after qualification failure
        if: always() && (failure() || cancelled())
        timeout-minutes: 5
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.PROTECTED_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: '019d1184e655db74b7589794a2a2a533'
          CLOUDFLARE_ZONE_ID: ${{ secrets.PROTECTED_CLOUDFLARE_ZONE_ID }}
        run: |
          set -euo pipefail
          worker=commons-trusted-pages-edge-staging
          capture="$RUNNER_TEMP/trusted-pages-edge-staging-before.json"
          attempted="$RUNNER_TEMP/trusted-pages-edge-staging-deploy-attempted"
          if [ ! -f "$attempted" ]; then
            exit 0
          fi
          recovery_result="$RUNNER_TEMP/public-template-og-preview-qualification-recovery.json"
          if [ ! -s "$recovery_result" ] || \
            ! jq -e '.recovered == true and .reason == "recovered"' "$recovery_result" >/dev/null; then
            echo "::warning::The staging authority is committed/superseded or recovery is unproven; preserving the current edge."
            exit 0
          fi
          test -s "$capture"
          state=$(jq -er '.state | select(. == "present" or . == "absent")' "$capture")
          if [ "$state" = "present" ]; then
            previous_version_id=$(jq -er '.versionId' "$capture")
            if ! [[ "$previous_version_id" =~ ^([a-f0-9]{32}|[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12})$ ]]; then
              echo "::error::The captured staging edge rollback version is invalid."
              exit 1
            fi
            current=$(gate/.github/release-gate/node_modules/.bin/wrangler deployments status \
              --name "$worker" --json)
            current_version_id=$(printf '%s' "$current" | jq -er \
              '.versions | select(length == 1) | .[0] | select(.percentage == 100) | .version_id')
            if [ "$current_version_id" != "$previous_version_id" ]; then
              gate/.github/release-gate/node_modules/.bin/wrangler rollback "$previous_version_id" \
                --name "$worker" \
                --message "Restore staging Pages edge after failed ${DEPLOY_SHA} handoff" \
                --yes
            fi
            restored=$(gate/.github/release-gate/node_modules/.bin/wrangler deployments status \
              --name "$worker" --json)
            printf '%s' "$restored" | jq -e --arg version "$previous_version_id" \
              '.versions | length == 1 and .[0].percentage == 100 and .[0].version_id == $version' \
              >/dev/null
          else
            settings_body="$RUNNER_TEMP/trusted-pages-edge-staging-recovery-settings.json"
            settings_status=$(curl -sS --max-time 30 -o "$settings_body" -w '%{http_code}' \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${worker}/settings")
            if [ "$settings_status" = "200" ]; then
              gate/.github/release-gate/node_modules/.bin/wrangler delete "$worker" --force
            elif [ "$settings_status" != "404" ]; then
              echo "::error::Could not inspect the newly created staging edge during recovery."
              exit 1
            fi
            settings_status=$(curl -sS --max-time 30 -o "$settings_body" -w '%{http_code}' \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${worker}/settings")
            test "$settings_status" = "404"
          fi
          routes_file="$RUNNER_TEMP/trusted-pages-edge-staging-routes-restored.json"
          curl -fsS --max-time 30 \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/workers/routes" \
            > "$routes_file"
          node gate/scripts/verify-trusted-pages-release-edge.mjs verify-route-inventory \
            --environment preview \
            --expected "$state" \
            < "$routes_file" >/dev/null

      - name: Reconcile failed staging qualification after recovery
        if: always() && (failure() || cancelled())
        timeout-minutes: 15
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.PROTECTED_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: '019d1184e655db74b7589794a2a2a533'
          CF_PAGES_PROJECT: communique-site
        run: |
          set -euo pipefail
          recovery_result="$RUNNER_TEMP/public-template-og-preview-qualification-recovery.json"
          test -s "$recovery_result"
          if jq -e '.recovered == true and .reason == "recovered"' \
            "$recovery_result" >/dev/null; then
            export CF_PAGES_ALLOWED_ALIAS_BRANCHES=production
          elif jq -e \
            '.recovered == false and (.reason == "committed-terminal" or .reason == "superseded")' \
            "$recovery_result" >/dev/null; then
            export CF_PAGES_ALLOWED_ALIAS_BRANCHES=production,staging
          else
            echo "::error::Staging recovery state is not safe for exposure reconciliation."
            exit 1
          fi
          reconciliation=$(node gate/scripts/reconcile-cloudflare-pages-exposure.mjs --prune)
          printf '%s\n' "$reconciliation"
          if ! grep -q 'stale=0;' <<<"$reconciliation" || \
            ! grep -q 'preserved=0;' <<<"$reconciliation"; then
            echo "::error::Staging recovery retained an undeclared Pages deployment."
            exit 1
          fi

  production-queue-preflight:
    name: Complete production prerequisites before fresh receipt approval
    needs:
      - source-verify
      - artifact-consensus
      - prepare-queue-release-kit
      - qualify-preview-generation
    if: >-
      always() &&
      needs.source-verify.result == 'success' &&
      needs.source-verify.outputs.deploy_mode == 'normal' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.branch == 'production' &&
      needs.artifact-consensus.result == 'success' &&
      needs.prepare-queue-release-kit.result == 'success' &&
      needs.qualify-preview-generation.result == 'success' &&
      needs.qualify-preview-generation.outputs.source_sha == needs.source-verify.outputs.verified_sha &&
      needs.qualify-preview-generation.outputs.artifact_digest == needs.artifact-consensus.outputs.artifact_digest &&
      needs.qualify-preview-generation.outputs.trusted_gate_sha == needs.source-verify.outputs.trusted_gate_sha &&
      needs.qualify-preview-generation.outputs.runtime_proved == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    environment:
      name: Production
    permissions:
      actions: read
      contents: read
    env:
      DEPLOY_SHA: ${{ needs.source-verify.outputs.verified_sha }}
      TRUSTED_GATE_SHA: ${{ needs.source-verify.outputs.trusted_gate_sha }}
      ARTIFACT_DIGEST: ${{ needs.artifact-consensus.outputs.artifact_digest }}
      ARTIFACT_ROOT: ${{ github.workspace }}/queue-release-kit/release-artifact
    outputs:
      source_sha: ${{ steps.preflight.outputs.source_sha }}
      artifact_digest: ${{ steps.preflight.outputs.artifact_digest }}
      trusted_gate_sha: ${{ steps.preflight.outputs.trusted_gate_sha }}
      completed_at: ${{ steps.preflight.outputs.completed_at }}
      manifest_cron_state: ${{ steps.capture_manifest_cron.outputs.state }}
      manifest_cron_version_id: ${{ steps.capture_manifest_cron.outputs.version_id }}
      manifest_cron_release_sha: ${{ steps.capture_manifest_cron.outputs.release_sha }}
    steps:
      - name: Download pre-proved immutable Queue release kit for production preflight
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        timeout-minutes: 3
        with:
          artifact-ids: ${{ needs.prepare-queue-release-kit.outputs.artifact_id }}
          path: ${{ runner.temp }}/queue-release-kit-download

      - name: Verify and extract production preflight kit
        timeout-minutes: 3
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/queue-release-kit-download/queue-release-kit.tar.gz"
          test "$(sha256sum "$archive" | awk '{print $1}')" = "${{ needs.prepare-queue-release-kit.outputs.kit_digest }}"
          tar -xzf "$archive" -C "$GITHUB_WORKSPACE"
          ln -s queue-release-kit/gate gate
          test "$(git -C gate rev-parse HEAD)" = "$TRUSTED_GATE_SHA"
          node gate/scripts/canonical-artifact-tree-digest.mjs \
            --artifact-root "$ARTIFACT_ROOT" \
            --expected-digest "$ARTIFACT_DIGEST"

      - name: Setup exact production preflight runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        timeout-minutes: 3
        with:
          node-version-file: 'gate/.node-version'

      - name: Prove both private storage realms before production eligibility
        timeout-minutes: 5
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.PROTECTED_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: '019d1184e655db74b7589794a2a2a533'
        run: >-
          node gate/scripts/reconcile-public-discovery-r2-lifecycle.mjs
          --environment all

      - name: Require the bounded production discovery producer contract before eligibility
        timeout-minutes: 2
        env:
          PUBLIC_CONVEX_URL: https://quirky-chinchilla-352.convex.cloud
          INTERNAL_API_SECRET: ${{ secrets.PROTECTED_INTERNAL_API_SECRET_PRODUCTION }}
          DISCOVERY_MANIFEST_REFRESH_SECRET: ${{ secrets.PROTECTED_DISCOVERY_MANIFEST_REFRESH_SECRET }}
          PUBLIC_DISCOVERY_MAX_AGE_HOURS: '26'
          # Cold production is the state this bootstrap stage exists to repair.
          # The post-bootstrap activation re-runs the content-required proof.
          PUBLIC_DISCOVERY_REQUIRE_CONTENT: 'false'
          PUBLIC_DISCOVERY_CONTRACT_ONLY: 'true'
        run: |
          set -euo pipefail
          if [ "${#INTERNAL_API_SECRET}" -lt 32 ] || \
            [ "${#DISCOVERY_MANIFEST_REFRESH_SECRET}" -lt 32 ]; then
            echo "::error::Production producer proof capabilities are absent or too short."
            exit 1
          fi
          node gate/scripts/verify-public-discovery-readiness.mjs

      - name: Prove fresh signed Convex quota before Cloudflare producer eligibility
        timeout-minutes: 3
        env:
          CONVEX_TEAM_QUOTA_ATTESTATION_B64: ${{ secrets.PROTECTED_CONVEX_TEAM_QUOTA_ATTESTATION_B64 }}
          CONVEX_TEAM_QUOTA_SIGNATURE_B64: ${{ secrets.PROTECTED_CONVEX_TEAM_QUOTA_SIGNATURE_B64 }}
          CONVEX_USAGE_LIMITS_VIEW_TOKEN: ${{ secrets.PROTECTED_CONVEX_USAGE_LIMITS_VIEW_TOKEN }}
        run: |
          set -euo pipefail
          umask 077
          attestation="$RUNNER_TEMP/convex-team-quota.json"
          signature="$RUNNER_TEMP/convex-team-quota.sig"
          printf '%s' "$CONVEX_TEAM_QUOTA_ATTESTATION_B64" | base64 --decode > "$attestation"
          printf '%s' "$CONVEX_TEAM_QUOTA_SIGNATURE_B64" | base64 --decode > "$signature"
          node gate/scripts/verify-convex-native-usage-limits.mjs \
            --environment production \
            --source-sha "$DEPLOY_SHA" \
            --purpose full-normal-release \
            --minimum-validity-seconds 180 \
            --attestation "$attestation" \
            --signature "$signature" \
            --allowed-signers gate/.github/convex-quota-allowed-signers

      - name: Deploy and prove exact team-global Convex work-budget Worker
        timeout-minutes: 10
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.PROTECTED_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: '019d1184e655db74b7589794a2a2a533'
        run: |
          set -euo pipefail
          node gate/scripts/finalize-trusted-release-worker.mjs validate \
            --artifact-root "$ARTIFACT_ROOT" \
            --trusted-source-root gate \
            --profile convex-work-budget
          gate/.github/release-gate/node_modules/.bin/wrangler deploy \
            "$ARTIFACT_ROOT/convex-work-budget/index.js" \
            --no-bundle \
            --config gate/wrangler.convex-work-budget.toml \
            --tag "$DEPLOY_SHA" \
            --message "Pre-receipt exact-SHA team-global Convex work budget"
          node gate/scripts/verify-convex-work-budget-deployment.mjs \
            --environment production --worker-only

      # Bootstrap authority is implemented by this exact gate artifact. It
      # must be active before the bootstrap job can arm the new control path;
      # activation later re-deploys the same exact transaction under its
      # receipt-scoped recovery journal.
      - name: Deploy and prove exact production manifest gate before bootstrap
        timeout-minutes: 10
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.PROTECTED_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: '019d1184e655db74b7589794a2a2a533'
        run: |
          set -euo pipefail
          worker=commons-public-discovery-manifest-gate
          message="commons-release-v1 transaction=${RELEASE_TRANSACTION_ID} gate=${TRUSTED_GATE_SHA} artifact=${ARTIFACT_DIGEST} component=manifest-gate realm=production"
          node gate/scripts/finalize-trusted-release-worker.mjs validate \
            --artifact-root "$ARTIFACT_ROOT" \
            --trusted-source-root gate \
            --profile manifest-gate
          gate/.github/release-gate/node_modules/.bin/wrangler deploy \
            "$ARTIFACT_ROOT/manifest-gate/index.js" \
            --no-bundle \
            --config gate/wrangler.public-discovery-manifest-gate.toml \
            --tag "$DEPLOY_SHA" \
            --message "$message"
          node gate/scripts/verify-public-discovery-gate-deployments.mjs \
            --environment production
          deployment="$RUNNER_TEMP/pre-bootstrap-manifest-gate-deployment.json"
          version="$RUNNER_TEMP/pre-bootstrap-manifest-gate-version.json"
          gate/.github/release-gate/node_modules/.bin/wrangler deployments status \
            --name "$worker" --json > "$deployment"
          version_id=$(jq -er \
            '.versions | select(length == 1) | .[0] |
             select(.percentage == 100) | .version_id |
             select(test("^([a-f0-9]{32}|[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12})$"))' \
            "$deployment")
          gate/.github/release-gate/node_modules/.bin/wrangler versions view \
            "$version_id" --name "$worker" --json > "$version"
          jq -e \
            --arg id "$version_id" \
            --arg sha "$DEPLOY_SHA" \
            --arg message "$message" \
            '.id == $id and
             .annotations["workers/tag"] == $sha and
             .annotations["workers/message"] == $message' \
            "$version" >/dev/null

      - name: Prove both Convex deployments have zero cron authority
        timeout-minutes: 3
        env:
          PROTECTED_CONVEX_PREVIEW_CRON_DATA_VIEW_DEPLOY_KEY: ${{ secrets.PROTECTED_CONVEX_PREVIEW_CRON_DATA_VIEW_DEPLOY_KEY }}
          PROTECTED_CONVEX_PRODUCTION_CRON_DATA_VIEW_DEPLOY_KEY: ${{ secrets.PROTECTED_CONVEX_PRODUCTION_CRON_DATA_VIEW_DEPLOY_KEY }}
        run: >-
          node gate/scripts/verify-convex-contained-cron-deployments.mjs
          --environment all
          --expected-state running

      - name: Capture exact manifest cron rollback baseline
        id: capture_manifest_cron
        timeout-minutes: 3
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.PROTECTED_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: '019d1184e655db74b7589794a2a2a533'
        run: |
          set -euo pipefail
          worker=commons-public-discovery-manifest-cron
          settings="$RUNNER_TEMP/manifest-cron-preflight-settings.json"
          status=$(curl -sS --max-time 30 -o "$settings" -w '%{http_code}' \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${worker}/settings")
          case "$status" in
            404)
              jq -e '.success == false and (.errors | type == "array")' "$settings" >/dev/null
              {
                echo 'state=absent'
                echo 'version_id='
                echo 'release_sha='
              } >> "$GITHUB_OUTPUT"
              ;;
            200)
              jq -e '.success == true and (.result.bindings | type == "array")' "$settings" >/dev/null
              deployment="$RUNNER_TEMP/manifest-cron-preflight-deployment.json"
              version="$RUNNER_TEMP/manifest-cron-preflight-version.json"
              gate/.github/release-gate/node_modules/.bin/wrangler deployments status \
                --name "$worker" --json > "$deployment"
              version_id=$(jq -er \
                '.versions | select(length == 1) | .[0] |
                 select(.percentage == 100) | .version_id |
                 select(test("^([a-f0-9]{32}|[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12})$"))' \
                "$deployment")
              gate/.github/release-gate/node_modules/.bin/wrangler versions view "$version_id" \
                --name "$worker" --json > "$version"
              release_sha=$(jq -er \
                '.annotations["workers/tag"] | select(test("^[a-f0-9]{40}$"))' "$version")
              node gate/scripts/verify-public-discovery-cron-deployment.mjs
              {
                echo 'state=present'
                echo "version_id=$version_id"
                echo "release_sha=$release_sha"
              } >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::Manifest cron baseline returned HTTP ${status}; expected exact 200 or 404."
              exit 1
              ;;
          esac

      - name: Seal production preflight handoff before receipt capture
        id: preflight
        timeout-minutes: 1
        run: |
          {
            echo "source_sha=$DEPLOY_SHA"
            echo "artifact_digest=$ARTIFACT_DIGEST"
            echo "trusted_gate_sha=$TRUSTED_GATE_SHA"
            echo "completed_at=$(date -u +'%Y-%m-%dT%H:%M:%S.000Z')"
          } >> "$GITHUB_OUTPUT"

  bootstrap-production-discovery:
    name: Certify or bootstrap the production discovery corpus
    needs:
      - source-verify
      - artifact-consensus
      - prepare-queue-release-kit
      - qualify-preview-generation
      - production-queue-preflight
    if: >-
      always() &&
      needs.source-verify.result == 'success' &&
      needs.source-verify.outputs.deploy_mode == 'normal' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.branch == 'production' &&
      needs.artifact-consensus.result == 'success' &&
      needs.prepare-queue-release-kit.result == 'success' &&
      needs.qualify-preview-generation.result == 'success' &&
      needs.production-queue-preflight.result == 'success' &&
      needs.production-queue-preflight.outputs.source_sha == needs.source-verify.outputs.verified_sha &&
      needs.production-queue-preflight.outputs.artifact_digest == needs.artifact-consensus.outputs.artifact_digest &&
      needs.production-queue-preflight.outputs.trusted_gate_sha == needs.source-verify.outputs.trusted_gate_sha &&
      needs.qualify-preview-generation.outputs.runtime_proved == 'true'
    runs-on: ubuntu-latest
    # The signed receipt admits with 72 minutes remaining. Bootstrap authority
    # is capped at 60 minutes. The seed stops ten minutes before expiry: exact
    # R2/Queue convergence gets at most five minutes and cleanup retains five.
    timeout-minutes: 90
    environment:
      name: Production
    permissions:
      actions: read
      contents: read
    env:
      DEPLOY_SHA: ${{ needs.source-verify.outputs.verified_sha }}
      TRUSTED_GATE_SHA: ${{ needs.source-verify.outputs.trusted_gate_sha }}
      ARTIFACT_DIGEST: ${{ needs.artifact-consensus.outputs.artifact_digest }}
      ARTIFACT_ROOT: ${{ github.workspace }}/queue-release-kit/release-artifact
      BOOTSTRAP_WORKER: commons-public-discovery-bootstrap
    outputs:
      source_sha: ${{ steps.bootstrap_handoff.outputs.source_sha }}
      artifact_digest: ${{ steps.bootstrap_handoff.outputs.artifact_digest }}
      trusted_gate_sha: ${{ steps.bootstrap_handoff.outputs.trusted_gate_sha }}
      bootstrap_complete: ${{ steps.bootstrap_handoff.outputs.bootstrap_complete }}
      bootstrap_performed: ${{ steps.bootstrap_handoff.outputs.bootstrap_performed }}
      generation: ${{ steps.bootstrap_handoff.outputs.generation }}
      completed_at: ${{ steps.bootstrap_handoff.outputs.completed_at }}
    steps:
      - name: Download immutable release kit for production discovery bootstrap
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        timeout-minutes: 3
        with:
          artifact-ids: ${{ needs.prepare-queue-release-kit.outputs.artifact_id }}
          path: ${{ runner.temp }}/queue-release-kit-download

      - name: Verify and extract production discovery bootstrap kit
        timeout-minutes: 3
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/queue-release-kit-download/queue-release-kit.tar.gz"
          test "$(sha256sum "$archive" | awk '{print $1}')" = "${{ needs.prepare-queue-release-kit.outputs.kit_digest }}"
          tar -xzf "$archive" -C "$GITHUB_WORKSPACE"
          ln -s queue-release-kit/gate gate
          test "$(git -C gate rev-parse HEAD)" = "$TRUSTED_GATE_SHA"
          node gate/scripts/canonical-artifact-tree-digest.mjs \
            --artifact-root "$ARTIFACT_ROOT" \
            --expected-digest "$ARTIFACT_DIGEST"
          test -s "$ARTIFACT_ROOT/pages/_worker.js"
          test -x gate/.github/release-gate/node_modules/.bin/wrangler
          test -x gate/.github/release-gate/node_modules/.bin/tsx

      - name: Setup exact production discovery bootstrap runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        timeout-minutes: 3
        with:
          node-version-file: 'gate/.node-version'

      - name: Classify exact production discovery completion before mutation
        id: classify_bootstrap
        timeout-minutes: 8
        env:
          CLOUDFLARE_ACCOUNT_ID: '019d1184e655db74b7589794a2a2a533'
          R2_ACCESS_KEY_ID: ${{ secrets.PROTECTED_PUBLIC_DISCOVERY_R2_READ_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.PROTECTED_PUBLIC_DISCOVERY_R2_READ_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          proof="$RUNNER_TEMP/public-discovery-bootstrap-initial-completion.json"
          error="$RUNNER_TEMP/public-discovery-bootstrap-initial-completion.err"
          set +e
          gate/node_modules/.bin/tsx \
            gate/scripts/verify-public-discovery-bootstrap-completion.ts \
            > "$proof" 2> "$error"
          verifier_status=$?
          set -e
          if [ "$verifier_status" -eq 0 ]; then
            jq -e \
              '.proof == "production-bootstrap-complete" and
               .environment == "production" and
               (.manifest.listGeneration | type == "string") and
               (.manifest.graphGeneration | type == "string")' "$proof" >/dev/null
            echo 'required=false' >> "$GITHUB_OUTPUT"
          elif head -n 1 "$error" | grep -q '^PUBLIC_DISCOVERY_BOOTSTRAP_INCOMPLETE:'; then
            test ! -s "$proof"
            echo 'required=true' >> "$GITHUB_OUTPUT"
          else
            echo '::error::Production bootstrap completion failed outside the typed incomplete state.'
            exit 1
          fi

      - name: Materialize and admit exact schema-2 bootstrap Queue receipt
        id: bootstrap_receipt
        timeout-minutes: 2
        env:
          QUEUE_FREE_ATTESTATION_B64: ${{ secrets.PROTECTED_CLOUDFLARE_QUEUE_FREE_BOOTSTRAP_PRODUCTION_ATTESTATION_B64 }}
          QUEUE_FREE_SIGNATURE_B64: ${{ secrets.PROTECTED_CLOUDFLARE_QUEUE_FREE_BOOTSTRAP_PRODUCTION_SIGNATURE_B64 }}
          QUEUE_FREE_OPERATOR_PRINCIPAL: ${{ secrets.PROTECTED_CLOUDFLARE_QUEUE_FREE_BOOTSTRAP_PRODUCTION_OPERATOR_PRINCIPAL }}
          PRODUCTION_PREFLIGHT_COMPLETED_AT: ${{ needs.production-queue-preflight.outputs.completed_at }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$QUEUE_FREE_ATTESTATION_B64"
          test -n "$QUEUE_FREE_SIGNATURE_B64"
          test -n "$QUEUE_FREE_OPERATOR_PRINCIPAL"
          attestation="$RUNNER_TEMP/cloudflare-queue-bootstrap-production.json"
          signature="$RUNNER_TEMP/cloudflare-queue-bootstrap-production.sig"
          admission="$RUNNER_TEMP/cloudflare-queue-bootstrap-admission.json"
          printf '%s' "$QUEUE_FREE_ATTESTATION_B64" | base64 --decode > "$attestation"
          printf '%s' "$QUEUE_FREE_SIGNATURE_B64" | base64 --decode > "$signature"
          jq -e --arg completed "$PRODUCTION_PREFLIGHT_COMPLETED_AT" \
            '.releasePhase == "bootstrap-production" and
             .observations[0].observedAt >= $completed and
             .observations[1].observedAt >= $completed and
             .capturedAt >= .observations[1].observedAt' "$attestation" >/dev/null
          node gate/scripts/verify-cloudflare-queue-free-envelope.mjs \
            --attestation "$attestation" \
            --signature "$signature" \
            --allowed-signers gate/.github/cloudflare-queue-allowed-signers \
            --release-phase bootstrap-production \
            --source-sha "$DEPLOY_SHA" \
            --min-validity-seconds 4320 \
            --operator-principal "$QUEUE_FREE_OPERATOR_PRINCIPAL" \
            --transaction-id "$RELEASE_TRANSACTION_ID" > "$admission"
          jq -e \
            --arg transaction "$RELEASE_TRANSACTION_ID" \
            --arg principal "$QUEUE_FREE_OPERATOR_PRINCIPAL" \
            '.releasePhase == "bootstrap-production" and
             .releaseTransactionId == $transaction and
             .operatorPrincipal == $principal and
             .remainingValiditySeconds >= 4320 and
             .authorizedManagedDelta.maximumReceiptAgeSeconds == 4320' \
            "$admission" >/dev/null
          deadline=$(ADMISSION_PATH="$admission" node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const proof = JSON.parse(readFileSync(process.env.ADMISSION_PATH, 'utf8'));
          const deadline = Math.min(
            Date.parse(proof.expiresAt),
            Date.parse(proof.capturedAt) + proof.authorizedManagedDelta.maximumReceiptAgeSeconds * 1000
          );
          if (!Number.isSafeInteger(deadline)) throw new Error('Bootstrap receipt deadline is invalid.');
          console.log(new Date(deadline).toISOString());
          NODE
          )
          {
            echo "QUEUE_FREE_ATTESTATION_PATH=$attestation"
            echo "QUEUE_FREE_SIGNATURE_PATH=$signature"
            echo "QUEUE_FREE_OPERATOR_PRINCIPAL=$QUEUE_FREE_OPERATOR_PRINCIPAL"
            echo "BOOTSTRAP_RECEIPT_VERIFICATION_DEADLINE=$deadline"
          } >> "$GITHUB_ENV"

      - name: Prove completed corpus has no retained bootstrap route or script
        if: steps.classify_bootstrap.outputs.required == 'false'
        timeout-minutes: 3
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.PROTECTED_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: '019d1184e655db74b7589794a2a2a533'
          CLOUDFLARE_ZONE_ID: ${{ secrets.PROTECTED_CLOUDFLARE_ZONE_ID }}
        run: |
          set -euo pipefail
          node gate/scripts/verify-public-discovery-bootstrap-deployment.mjs \
            route --expected absent >/dev/null
          settings="$RUNNER_TEMP/public-discovery-bootstrap-complete-settings.json"
          status=$(curl -sS --max-time 30 -o "$settings" -w '%{http_code}' \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${BOOTSTRAP_WORKER}/settings")
          test "$status" = 404
          jq -e '.success == false and (.errors | type == "array")' "$settings" >/dev/null

      - name: Prove signed empty consumer-ready Queue baseline before code mutation
        timeout-minutes: 3
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.PROTECTED_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: '019d1184e655db74b7589794a2a2a533'
        run: |
          set -euo pipefail
          ready=$(node gate/scripts/verify-cloudflare-queue-release-phase.mjs \
            --attestation "$QUEUE_FREE_ATTESTATION_PATH" \
            --signature "$QUEUE_FREE_SIGNATURE_PATH" \
            --allowed-signers gate/.github/cloudflare-queue-allowed-signers \
            --release-phase bootstrap-production \
            --source-sha "$DEPLOY_SHA" \
            --state bootstrap-consumer-ready \
            --min-validity-seconds 3960 \
            --operator-principal "$QUEUE_FREE_OPERATOR_PRINCIPAL" \
            --transaction-id "$RELEASE_TRANSACTION_ID")
          printf '%s' "$ready" | jq -e \
            --arg transaction "$RELEASE_TRANSACTION_ID" \
            '.releasePhase == "bootstrap-production" and
             .state == "bootstrap-consumer-ready" and
             .releaseTransactionId == $transaction and
             .bootstrapConsumerReady == true and
             .bootstrapConsumerWorkBudgetExact == true and
             .bootstrapProducerAttached == false and
             .primaryDeliveryPaused == false and
             .primaryProducerCount == 0 and
             .queueConfigurationUnchanged == true and
             .queueConfigurationUnchangedExceptAuthorizedProducer == false and
             .authorizedTransientProducerDeltaOnly == true and
             .unmanagedAuthorityUnchanged == true and
             .positiveBacklogObserved == false and
             .remainingValiditySeconds >= 3960' >/dev/null

      - name: Seal durable bootstrap recovery custody before temporary authority
        timeout-minutes: 5
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.PROTECTED_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: '019d1184e655db74b7589794a2a2a533'
          CLOUDFLARE_ZONE_ID: ${{ secrets.PROTECTED_CLOUDFLARE_ZONE_ID }}
          RELEASE_RECOVERY_R2_ACCESS_KEY_ID: ${{ secrets.PROTECTED_RELEASE_RECOVERY_R2_ACCESS_KEY_ID }}
          RELEASE_RECOVERY_R2_SECRET_ACCESS_KEY: ${{ secrets.PROTECTED_RELEASE_RECOVERY_R2_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          custody=$(node gate/scripts/public-discovery-bootstrap-recovery-custody.mjs seal \
            --repository "$GITHUB_REPOSITORY" \
            --repository-id "$GITHUB_REPOSITORY_ID" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --transaction-id "$RELEASE_TRANSACTION_ID" \
            --source-sha "$DEPLOY_SHA" \
            --trusted-gate-sha "$TRUSTED_GATE_SHA" \
            --config gate/wrangler.public-discovery-bootstrap.toml)
          printf '%s' "$custody" | jq -e \
            --arg sha "$DEPLOY_SHA" \
            --arg transaction "$RELEASE_TRANSACTION_ID" \
            '.state == "custody-sealed" and .stage == "intent" and
             .sourceSha == $sha and .transactionId == $transaction and
             (.digest | test("^[a-f0-9]{64}$"))' >/dev/null

      - name: Deploy and converge exact transaction-bound production Queue consumer
        timeout-minutes: 8
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.PROTECTED_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: '019d1184e655db74b7589794a2a2a533'
        run: |
          set -euo pipefail
          worker=commons-public-template-og
          message="commons-release-v1 transaction=${RELEASE_TRANSACTION_ID} gate=${TRUSTED_GATE_SHA} artifact=${ARTIFACT_DIGEST} component=og-consumer realm=production"
          set +e
          gate/.github/release-gate/node_modules/.bin/wrangler deploy \
            "$ARTIFACT_ROOT/public-template-og-consumer/index.js" \
            --no-bundle \
            --config gate/wrangler.public-template-og.toml \
            --var "PUBLIC_RELEASE_SHA:${DEPLOY_SHA}" \
            --var "PUBLIC_RELEASE_TRANSACTION_ID:${RELEASE_TRANSACTION_ID}" \
            --tag "$DEPLOY_SHA" \
            --message "$message"
          deploy_status=$?
          set -e

          deployment="$RUNNER_TEMP/bootstrap-og-consumer-deployment.json"
          version="$RUNNER_TEMP/bootstrap-og-consumer-version.json"
          gate/.github/release-gate/node_modules/.bin/wrangler deployments status \
            --name "$worker" --json > "$deployment"
          version_id=$(jq -er \
            '.versions | select(length == 1) | .[0] |
             select(.percentage == 100) | .version_id |
             select(test("^([a-f0-9]{32}|[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12})$"))' \
            "$deployment")
          gate/.github/release-gate/node_modules/.bin/wrangler versions view \
            "$version_id" --name "$worker" --json > "$version"
          jq -e \
            --arg id "$version_id" \
            --arg sha "$DEPLOY_SHA" \
            --arg message "$message" \
            '.id == $id and
             .annotations["workers/tag"] == $sha and
             .annotations["workers/message"] == $message' \
            "$version" >/dev/null
          node gate/scripts/verify-public-template-og-deployment.mjs \
            --environment production \
            --config gate/wrangler.public-template-og.toml \
            --expected-source-sha "$DEPLOY_SHA" \
            --expected-transaction-id "$RELEASE_TRANSACTION_ID" \
            --deployment-status "$deployment" \
            --active-version "$version" \
            --producer-posture compatible \
            --delivery-posture active > "$RUNNER_TEMP/bootstrap-og-consumer-proof.json"
          jq -e \
            --arg sha "$DEPLOY_SHA" \
            --arg transaction "$RELEASE_TRANSACTION_ID" \
            '.realm == "production" and .releaseSha == $sha and
             .releaseTransactionId == $transaction and
             .producerBound == false and .deliveryPosture == "active" and
             (.consumerId | type == "string" and length > 0)' \
            "$RUNNER_TEMP/bootstrap-og-consumer-proof.json" >/dev/null
          converged=$(node gate/scripts/verify-cloudflare-queue-release-phase.mjs \
            --attestation "$QUEUE_FREE_ATTESTATION_PATH" \
            --signature "$QUEUE_FREE_SIGNATURE_PATH" \
            --allowed-signers gate/.github/cloudflare-queue-allowed-signers \
            --release-phase bootstrap-production \
            --source-sha "$DEPLOY_SHA" \
            --state bootstrap-consumer-ready \
            --min-validity-seconds 3960 \
            --operator-principal "$QUEUE_FREE_OPERATOR_PRINCIPAL" \
            --transaction-id "$RELEASE_TRANSACTION_ID")
          printf '%s' "$converged" | jq -e \
            '.bootstrapConsumerReady == true and
             .bootstrapConsumerWorkBudgetExact == true and
             .bootstrapProducerAttached == false and
             .primaryDeliveryPaused == false and .primaryProducerCount == 0 and
             .positiveBacklogObserved == false and
             .remainingValiditySeconds >= 3960' >/dev/null
          if [ "$deploy_status" -ne 0 ]; then
            echo '::warning::Consumer deploy command lost its response, but exact live convergence proved the owned result.'
          fi

      - name: Arm bounded production bootstrap authority
        if: steps.classify_bootstrap.outputs.required == 'true'
        timeout-minutes: 2
        env:
          RELEASE_CONTROL_SECRET: ${{ secrets.PROTECTED_RELEASE_CONTROL_SECRET_PRODUCTION }}
        run: |
          set -euo pipefail
          lease=$(node -e 'console.log(crypto.randomUUID())')
          not_after=$(BOOTSTRAP_RECEIPT_VERIFICATION_DEADLINE="$BOOTSTRAP_RECEIPT_VERIFICATION_DEADLINE" \
            node --input-type=module <<'NODE'
          const now = Date.now();
          const receipt = Date.parse(process.env.BOOTSTRAP_RECEIPT_VERIFICATION_DEADLINE ?? '');
          const maximum = now + 59 * 60 * 1000;
          if (!Number.isSafeInteger(receipt) || receipt - now < 66 * 60 * 1000) {
            throw new Error('Bootstrap receipt no longer retains its attached-state reserve.');
          }
          console.log(new Date(Math.min(receipt, maximum)).toISOString());
          NODE
          )
          {
            echo "BOOTSTRAP_AUTHORITY_LEASE_ID=$lease"
            echo "BOOTSTRAP_AUTHORITY_NOT_AFTER=$not_after"
          } >> "$GITHUB_ENV"
          armed=$(node gate/scripts/control-public-discovery-bootstrap-authority.mjs arm \
            --lease-id "$lease" \
            --not-after "$not_after" \
            --source-sha "$DEPLOY_SHA" \
            --transaction-id "$RELEASE_TRANSACTION_ID")
          printf '%s' "$armed" | jq -e \
            --arg lease "$lease" \
            --arg notAfter "$not_after" \
            --arg sha "$DEPLOY_SHA" \
            --arg transaction "$RELEASE_TRANSACTION_ID" \
             '.status == "armed" and .leaseId == $lease and .notAfter == $notAfter and
             .sourceSha == $sha and .transactionId == $transaction' >/dev/null

      - name: Deploy exact finalized Pages artifact on the temporary bootstrap route
        if: steps.classify_bootstrap.outputs.required == 'true'
        timeout-minutes: 5
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.PROTECTED_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: '019d1184e655db74b7589794a2a2a533'
          DISCOVERY_MANIFEST_REFRESH_SECRET: ${{ secrets.PROTECTED_DISCOVERY_MANIFEST_REFRESH_SECRET }}
          INTERNAL_API_SECRET: ${{ secrets.PROTECTED_INTERNAL_API_SECRET_PRODUCTION }}
        run: |
          set -euo pipefail
          umask 077
          if [ "${#DISCOVERY_MANIFEST_REFRESH_SECRET}" -lt 32 ] || \
            [ "${#INTERNAL_API_SECRET}" -lt 32 ] || \
            [ "$DISCOVERY_MANIFEST_REFRESH_SECRET" = "$INTERNAL_API_SECRET" ]; then
            echo '::error::Bootstrap application capabilities are absent, short, or reused.'
            exit 1
          fi
          secrets_file="$RUNNER_TEMP/public-discovery-bootstrap-secrets.json"
          BOOTSTRAP_SECRETS_FILE="$secrets_file" node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';
          writeFileSync(
            process.env.BOOTSTRAP_SECRETS_FILE,
            JSON.stringify({
              DISCOVERY_MANIFEST_REFRESH_SECRET: process.env.DISCOVERY_MANIFEST_REFRESH_SECRET,
              INTERNAL_API_SECRET: process.env.INTERNAL_API_SECRET
            }),
            { flag: 'wx', mode: 0o600 }
          );
          NODE
          gate/.github/release-gate/node_modules/.bin/wrangler deploy \
            "$ARTIFACT_ROOT/pages/_worker.js" \
            --no-bundle \
            --config gate/wrangler.public-discovery-bootstrap.toml \
            --var "PUBLIC_RELEASE_TRANSACTION_ID:${RELEASE_TRANSACTION_ID}" \
            --secrets-file "$secrets_file" \
            --tag "$DEPLOY_SHA" \
            --message "Exact-SHA bootstrap transaction=${RELEASE_TRANSACTION_ID} component=bootstrap"

      - name: Prove and record the exact temporary bootstrap deployment
        if: steps.classify_bootstrap.outputs.required == 'true'
        timeout-minutes: 5
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.PROTECTED_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: '019d1184e655db74b7589794a2a2a533'
          CLOUDFLARE_ZONE_ID: ${{ secrets.PROTECTED_CLOUDFLARE_ZONE_ID }}
          RELEASE_RECOVERY_R2_ACCESS_KEY_ID: ${{ secrets.PROTECTED_RELEASE_RECOVERY_R2_ACCESS_KEY_ID }}
          RELEASE_RECOVERY_R2_SECRET_ACCESS_KEY: ${{ secrets.PROTECTED_RELEASE_RECOVERY_R2_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          deployment="$RUNNER_TEMP/public-discovery-bootstrap-deployment.json"
          version="$RUNNER_TEMP/public-discovery-bootstrap-version.json"
          gate/.github/release-gate/node_modules/.bin/wrangler deployments status \
            --name "$BOOTSTRAP_WORKER" --json > "$deployment"
          version_id=$(jq -er \
            '.versions | select(length == 1) | .[0] | select(.percentage == 100) |
             .version_id | select(test("^([a-f0-9]{32}|[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12})$"))' \
            "$deployment")
          gate/.github/release-gate/node_modules/.bin/wrangler versions view \
            "$version_id" --name "$BOOTSTRAP_WORKER" --json > "$version"
          proof=$(node gate/scripts/verify-public-discovery-bootstrap-deployment.mjs deployment \
            --config gate/wrangler.public-discovery-bootstrap.toml \
            --expected-source-sha "$DEPLOY_SHA" \
            --expected-transaction "$RELEASE_TRANSACTION_ID" \
            --deployment-status "$deployment" \
            --active-version "$version")
          printf '%s' "$proof" | jq -e \
            --arg sha "$DEPLOY_SHA" \
            --arg transaction "$RELEASE_TRANSACTION_ID" \
            --arg version "$version_id" \
            '.proof == "public-discovery-bootstrap-deployment" and
             .releaseSha == $sha and .transactionId == $transaction and
             .versionId == $version and .routePresent == true' >/dev/null
          custody=$(node gate/scripts/public-discovery-bootstrap-recovery-custody.mjs record-deployed \
            --repository "$GITHUB_REPOSITORY" \
            --repository-id "$GITHUB_REPOSITORY_ID" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --transaction-id "$RELEASE_TRANSACTION_ID" \
            --source-sha "$DEPLOY_SHA" \
            --trusted-gate-sha "$TRUSTED_GATE_SHA" \
            --config gate/wrangler.public-discovery-bootstrap.toml \
            --wrangler gate/.github/release-gate/node_modules/.bin/wrangler)
          printf '%s' "$custody" | jq -e \
            --arg sha "$DEPLOY_SHA" \
            --arg transaction "$RELEASE_TRANSACTION_ID" \
            --arg version "$version_id" \
            '.state == "deployment-recorded" and .stage == "deployed" and
             .sourceSha == $sha and .transactionId == $transaction and
             .versionId == $version and (.digest | test("^[a-f0-9]{64}$"))' >/dev/null

      - name: Prove the receipt-authorized transient Queue producer attachment
        if: steps.classify_bootstrap.outputs.required == 'true'
        timeout-minutes: 3
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.PROTECTED_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: '019d1184e655db74b7589794a2a2a533'
        run: |
          set -euo pipefail
          attached=$(node gate/scripts/verify-cloudflare-queue-release-phase.mjs \
            --attestation "$QUEUE_FREE_ATTESTATION_PATH" \
            --signature "$QUEUE_FREE_SIGNATURE_PATH" \
            --allowed-signers gate/.github/cloudflare-queue-allowed-signers \
            --release-phase bootstrap-production \
            --source-sha "$DEPLOY_SHA" \
            --state bootstrap-producer-attached \
            --min-validity-seconds 3960 \
            --operator-principal "$QUEUE_FREE_OPERATOR_PRINCIPAL" \
            --transaction-id "$RELEASE_TRANSACTION_ID")
          printf '%s' "$attached" | jq -e \
            --arg transaction "$RELEASE_TRANSACTION_ID" \
            '.releasePhase == "bootstrap-production" and
             .state == "bootstrap-producer-attached" and
             .releaseTransactionId == $transaction and
             .bootstrapProducerAttached == true and
             .queueConfigurationUnchanged == false and
             .queueConfigurationUnchangedExceptAuthorizedProducer == true and
             .authorizedTransientProducerDeltaOnly == true and
             .unmanagedAuthorityUnchanged == true and
             .remainingValiditySeconds >= 3960' >/dev/null

      - name: Prove Access and the exact bootstrap adapter boundary before work
        if: steps.classify_bootstrap.outputs.required == 'true'
        timeout-minutes: 2
        env:
          PAGES_ORIGIN_ACCESS_TOKEN: ${{ secrets.PROTECTED_PAGES_ORIGIN_ACCESS_TOKEN_PRODUCTION }}
          DISCOVERY_MANIFEST_REFRESH_SECRET: ${{ secrets.PROTECTED_DISCOVERY_MANIFEST_REFRESH_SECRET }}
          DISCOVERY_MANIFEST_REFRESH_SECRET_PREVIOUS: ${{ secrets.PROTECTED_DISCOVERY_MANIFEST_REFRESH_SECRET_PREVIOUS }}
          INTERNAL_API_SECRET: ${{ secrets.PROTECTED_INTERNAL_API_SECRET_PRODUCTION }}
        run: |
          set -euo pipefail
          boundary=$(node gate/scripts/prove-public-discovery-bootstrap-boundary.mjs \
            --expected-release-sha "$DEPLOY_SHA" \
            --expected-release-transaction "$RELEASE_TRANSACTION_ID" \
            --bootstrap-authority-lease "$BOOTSTRAP_AUTHORITY_LEASE_ID")
          printf '%s' "$boundary" | jq -e \
            --arg sha "$DEPLOY_SHA" \
            --arg transaction "$RELEASE_TRANSACTION_ID" \
            --arg lease "$BOOTSTRAP_AUTHORITY_LEASE_ID" \
            '.action == "prove-public-discovery-bootstrap-boundary" and
             .sourceSha == $sha and .transactionId == $transaction and
             .leaseId == $lease and .accessDeniedBeforeWorker == true and
             .applicationAuthenticationRejected == true and .boundaryProtocol == "v1"' \
            >/dev/null

      - name: Seed the complete production corpus inside the absolute authority deadline
        if: steps.classify_bootstrap.outputs.required == 'true'
        id: bootstrap_seed
        timeout-minutes: 55
        env:
          PAGES_ORIGIN_ACCESS_TOKEN: ${{ secrets.PROTECTED_PAGES_ORIGIN_ACCESS_TOKEN_PRODUCTION }}
          DISCOVERY_MANIFEST_REFRESH_SECRET: ${{ secrets.PROTECTED_DISCOVERY_MANIFEST_REFRESH_SECRET }}
          INTERNAL_API_SECRET: ${{ secrets.PROTECTED_INTERNAL_API_SECRET_PRODUCTION }}
        run: |
          set -euo pipefail
          seed="$RUNNER_TEMP/public-discovery-bootstrap-seed.json"
          node gate/scripts/seed-public-discovery-manifest.mjs \
            --endpoint https://pages-origin.commons.email/api/internal/public-discovery-manifest-refresh \
            --expected-release-sha "$DEPLOY_SHA" \
            --expected-release-transaction "$RELEASE_TRANSACTION_ID" \
            --bootstrap-authority-lease "$BOOTSTRAP_AUTHORITY_LEASE_ID" \
            --bootstrap-authority-not-after "$BOOTSTRAP_AUTHORITY_NOT_AFTER" \
            --bootstrap-cleanup-reserve-milliseconds 600000 \
            --maximum-attempts 25 > "$seed"
          jq -e \
            --arg sha "$DEPLOY_SHA" \
            --arg transaction "$RELEASE_TRANSACTION_ID" \
            --arg lease "$BOOTSTRAP_AUTHORITY_LEASE_ID" \
            --arg notAfter "$BOOTSTRAP_AUTHORITY_NOT_AFTER" \
            '.proof == "public-discovery-manifest-bootstrap-seed" and
             .expectedReleaseSha == $sha and .expectedReleaseTransaction == $transaction and
             .bootstrapAuthorityLeaseId == $lease and
             .bootstrapAuthorityNotAfter == $notAfter and
             .bootstrapCleanupReserveMilliseconds == 600000 and
             (.attempts >= 1 and .attempts <= 25) and
             (.generation | test("^list=[1-9][0-9]*:(0|[1-9][0-9]*);relations=[1-9][0-9]*:(0|[1-9][0-9]*)$"))' \
            "$seed" >/dev/null
          echo "generation=$(jq -er '.generation' "$seed")" >> "$GITHUB_OUTPUT"

      - name: Certify the seeded R2 corpus and exact completed authority
        if: steps.classify_bootstrap.outputs.required == 'true'
        id: bootstrap_completion
        timeout-minutes: 55
        env:
          CLOUDFLARE_ACCOUNT_ID: '019d1184e655db74b7589794a2a2a533'
          R2_ACCESS_KEY_ID: ${{ secrets.PROTECTED_PUBLIC_DISCOVERY_R2_READ_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.PROTECTED_PUBLIC_DISCOVERY_R2_READ_SECRET_ACCESS_KEY }}
          RELEASE_CONTROL_SECRET: ${{ secrets.PROTECTED_RELEASE_CONTROL_SECRET_PRODUCTION }}
          SEED_GENERATION: ${{ steps.bootstrap_seed.outputs.generation }}
        run: |
          set -euo pipefail
          proof="$RUNNER_TEMP/public-discovery-bootstrap-completion.json"
          candidate="$RUNNER_TEMP/public-discovery-bootstrap-completion-candidate.json"
          error="$RUNNER_TEMP/public-discovery-bootstrap-completion.err"
          completion_deadline_ms=$(BOOTSTRAP_AUTHORITY_NOT_AFTER="$BOOTSTRAP_AUTHORITY_NOT_AFTER" \
            node --input-type=module <<'NODE'
          const notAfter = Date.parse(process.env.BOOTSTRAP_AUTHORITY_NOT_AFTER ?? '');
          if (!Number.isSafeInteger(notAfter)) {
            throw new Error('Bootstrap authority completion deadline is invalid.');
          }
          console.log(notAfter - 300_000);
          NODE
          )
          attempt=0
          while true; do
            attempt=$((attempt + 1))
            now_ms=$(date -u +%s%3N)
            remaining_ms=$((completion_deadline_ms - now_ms))
            if [ "$remaining_ms" -le 0 ]; then
              echo '::error::Exact R2 completion did not settle before the bootstrap cleanup reserve.'
              exit 1
            fi
            command_timeout=$((remaining_ms / 1000))
            if [ "$command_timeout" -gt 120 ]; then command_timeout=120; fi
            if [ "$command_timeout" -lt 1 ]; then command_timeout=1; fi
            : > "$candidate"
            : > "$error"
            set +e
            timeout --signal=TERM --kill-after=5s "${command_timeout}s" \
              gate/node_modules/.bin/tsx \
              gate/scripts/verify-public-discovery-bootstrap-completion.ts \
              > "$candidate" 2> "$error"
            verifier_status=$?
            set -e
            if [ "$verifier_status" -eq 0 ]; then
              mv "$candidate" "$proof"
              break
            fi
            if ! head -n 1 "$error" | grep -q '^PUBLIC_DISCOVERY_BOOTSTRAP_INCOMPLETE:'; then
              cat "$error" >&2
              echo "::error::Exact R2 completion verifier failed on attempt ${attempt}."
              exit 1
            fi
            now_ms=$(date -u +%s%3N)
            remaining_ms=$((completion_deadline_ms - now_ms))
            if [ "$remaining_ms" -le 15000 ]; then
              cat "$error" >&2
              echo '::error::Exact R2 completion remained incomplete at the cleanup boundary.'
              exit 1
            fi
            sleep 15
          done
          completion_generation=$(jq -er \
            '"list=" + .manifest.listGeneration + ";relations=" + .manifest.graphGeneration' \
            "$proof")
          test "$completion_generation" = "$SEED_GENERATION"
          jq -e \
            --arg generation "$SEED_GENERATION" \
            '.proof == "production-bootstrap-complete" and
             .environment == "production" and
             ("list=" + .manifest.listGeneration + ";relations=" +
              .manifest.graphGeneration) == $generation and
             .checkpoint.total == .artifacts.coordinates and
             .inventory.entries == .checkpoint.total' "$proof" >/dev/null
          authority=$(node gate/scripts/control-public-discovery-bootstrap-authority.mjs inspect \
            --lease-id "$BOOTSTRAP_AUTHORITY_LEASE_ID" \
            --not-after "$BOOTSTRAP_AUTHORITY_NOT_AFTER" \
            --source-sha "$DEPLOY_SHA" \
            --transaction-id "$RELEASE_TRANSACTION_ID")
          printf '%s' "$authority" | jq -e \
            --arg lease "$BOOTSTRAP_AUTHORITY_LEASE_ID" \
            --arg notAfter "$BOOTSTRAP_AUTHORITY_NOT_AFTER" \
            --arg generation "$SEED_GENERATION" \
            '.status == "completed" and .leaseId == $lease and
             .notAfter == $notAfter and .generation == $generation and
             (.refreshLeaseId | test("^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$")) and
             (.completedAt | type == "string")' >/dev/null
          echo "generation=$completion_generation" >> "$GITHUB_OUTPUT"

      - name: Contain authority and recover the temporary route before script deletion
        if: always()
        timeout-minutes: 12
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.PROTECTED_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: '019d1184e655db74b7589794a2a2a533'
          CLOUDFLARE_ZONE_ID: ${{ secrets.PROTECTED_CLOUDFLARE_ZONE_ID }}
          RELEASE_CONTROL_SECRET: ${{ secrets.PROTECTED_RELEASE_CONTROL_SECRET_PRODUCTION }}
          RELEASE_RECOVERY_R2_ACCESS_KEY_ID: ${{ secrets.PROTECTED_RELEASE_RECOVERY_R2_ACCESS_KEY_ID }}
          RELEASE_RECOVERY_R2_SECRET_ACCESS_KEY: ${{ secrets.PROTECTED_RELEASE_RECOVERY_R2_SECRET_ACCESS_KEY }}
        run: |
          set -uo pipefail
          authority_failure=0
          if [ -n "${BOOTSTRAP_AUTHORITY_LEASE_ID:-}" ] && \
            [ -n "${BOOTSTRAP_AUTHORITY_NOT_AFTER:-}" ]; then
            inspect="$RUNNER_TEMP/public-discovery-bootstrap-authority-cleanup.json"
            if node gate/scripts/control-public-discovery-bootstrap-authority.mjs inspect \
              --lease-id "$BOOTSTRAP_AUTHORITY_LEASE_ID" \
              --not-after "$BOOTSTRAP_AUTHORITY_NOT_AFTER" \
              --source-sha "$DEPLOY_SHA" \
              --transaction-id "$RELEASE_TRANSACTION_ID" > "$inspect"; then
              status=$(jq -er '.status' "$inspect")
              case "$status" in
                armed)
                  contained="$RUNNER_TEMP/public-discovery-bootstrap-authority-contained.json"
                  if ! node gate/scripts/control-public-discovery-bootstrap-authority.mjs contain \
                    --lease-id "$BOOTSTRAP_AUTHORITY_LEASE_ID" \
                    --not-after "$BOOTSTRAP_AUTHORITY_NOT_AFTER" \
                    --source-sha "$DEPLOY_SHA" \
                    --transaction-id "$RELEASE_TRANSACTION_ID" > "$contained" || \
                    ! jq -e '.status == "contained"' "$contained" >/dev/null; then
                    authority_failure=1
                  fi
                  ;;
                absent|completed|contained) ;;
                *) authority_failure=1 ;;
              esac
            else
              authority_failure=1
            fi
          fi

          recovery_failure=0
          journal="$RUNNER_TEMP/public-discovery-bootstrap-custody.json"
          hydrated="$RUNNER_TEMP/public-discovery-bootstrap-custody-hydrated.json"
          if node gate/scripts/public-discovery-bootstrap-recovery-custody.mjs hydrate \
            --repository "$GITHUB_REPOSITORY" \
            --repository-id "$GITHUB_REPOSITORY_ID" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --transaction-id "$RELEASE_TRANSACTION_ID" \
            --trusted-gate-sha "$TRUSTED_GATE_SHA" \
            --journal "$journal" > "$hydrated"; then
            custody_state=$(jq -er '.state' "$hydrated")
            case "$custody_state" in
              present)
                recovery="$RUNNER_TEMP/public-discovery-bootstrap-recovery.json"
                if ! node gate/scripts/recover-public-discovery-bootstrap.mjs \
                  --journal "$journal" \
                  --config gate/wrangler.public-discovery-bootstrap.toml \
                  --wrangler gate/.github/release-gate/node_modules/.bin/wrangler \
                  --trusted-gate-sha "$TRUSTED_GATE_SHA" \
                  > "$recovery" || \
                  ! jq -e \
                    '.state == "bootstrap-contained" or .state == "already-cleaned"' \
                    "$recovery" >/dev/null; then
                  recovery_failure=1
                fi
                ;;
              absent)
                # Custody is sealed before either authority or deployment. An
                # absent chain is safe only if both temporary surfaces stayed absent.
                if ! node gate/scripts/verify-public-discovery-bootstrap-deployment.mjs \
                  route --expected absent >/dev/null; then
                  recovery_failure=1
                fi
                settings="$RUNNER_TEMP/public-discovery-bootstrap-absent-settings.json"
                settings_status=$(curl -sS --max-time 30 -o "$settings" -w '%{http_code}' \
                  -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                  "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${BOOTSTRAP_WORKER}/settings")
                if [ "$settings_status" != 404 ] || \
                  ! jq -e '.success == false and (.errors | type == "array")' \
                    "$settings" >/dev/null; then
                  recovery_failure=1
                fi
                ;;
              *) recovery_failure=1 ;;
            esac
          else
            recovery_failure=1
          fi
          if [ "$authority_failure" -ne 0 ] || [ "$recovery_failure" -ne 0 ]; then
            echo '::error::Bootstrap authority or temporary Worker recovery did not settle.'
            exit 1
          fi

      - name: Prove Queue authority returned to the exact signed baseline
        if: always()
        timeout-minutes: 3
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.PROTECTED_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: '019d1184e655db74b7589794a2a2a533'
        run: |
          set -euo pipefail
          proof="$RUNNER_TEMP/cloudflare-queue-bootstrap-terminal.json"
          error="$RUNNER_TEMP/cloudflare-queue-bootstrap-terminal.err"
          settled=false
          for attempt in 1 2 3 4 5 6; do
            if node gate/scripts/verify-cloudflare-queue-release-phase.mjs \
              --attestation "$QUEUE_FREE_ATTESTATION_PATH" \
              --signature "$QUEUE_FREE_SIGNATURE_PATH" \
              --allowed-signers gate/.github/cloudflare-queue-allowed-signers \
              --release-phase bootstrap-production \
              --source-sha "$DEPLOY_SHA" \
              --state bootstrap-unchanged \
              --min-validity-seconds 180 \
              --operator-principal "$QUEUE_FREE_OPERATOR_PRINCIPAL" \
              --transaction-id "$RELEASE_TRANSACTION_ID" > "$proof" 2> "$error"; then
              settled=true
              break
            fi
            if [ "$attempt" -lt 6 ]; then sleep 10; fi
          done
          if [ "$settled" != true ]; then
            echo '::error::Bootstrap Queue authority did not return to its signed baseline.'
            exit 1
          fi
          jq -e \
            --arg transaction "$RELEASE_TRANSACTION_ID" \
            '.releasePhase == "bootstrap-production" and
             .state == "bootstrap-unchanged" and
             .releaseTransactionId == $transaction and
             .bootstrapConsumerReady == true and
             .bootstrapConsumerWorkBudgetExact == true and
             .bootstrapProducerAttached == false and
             .primaryDeliveryPaused == false and
             .primaryProducerCount == 0 and
             .queueConfigurationUnchanged == true and
             .queueConfigurationUnchangedExceptAuthorizedProducer == false and
             .authorizedTransientProducerDeltaOnly == true and
             .unmanagedAuthorityUnchanged == true and
             .remainingValiditySeconds >= 180' "$proof" >/dev/null

      - name: Re-prove exact production completion after temporary cleanup
        if: success()
        id: final_bootstrap_completion
        timeout-minutes: 10
        env:
          CLOUDFLARE_ACCOUNT_ID: '019d1184e655db74b7589794a2a2a533'
          R2_ACCESS_KEY_ID: ${{ secrets.PROTECTED_PUBLIC_DISCOVERY_R2_READ_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.PROTECTED_PUBLIC_DISCOVERY_R2_READ_SECRET_ACCESS_KEY }}
          EXPECTED_BOOTSTRAP_GENERATION: ${{ steps.bootstrap_completion.outputs.generation }}
        run: |
          set -euo pipefail
          proof="$RUNNER_TEMP/public-discovery-bootstrap-final-completion.json"
          gate/node_modules/.bin/tsx \
            gate/scripts/verify-public-discovery-bootstrap-completion.ts > "$proof"
          generation=$(jq -er \
            '"list=" + .manifest.listGeneration + ";relations=" + .manifest.graphGeneration' \
            "$proof")
          jq -e \
            --arg generation "$generation" \
            '.proof == "production-bootstrap-complete" and
             .environment == "production" and
             ("list=" + .manifest.listGeneration + ";relations=" +
              .manifest.graphGeneration) == $generation and
             .checkpoint.total == .artifacts.coordinates and
             .inventory.entries == .checkpoint.total' "$proof" >/dev/null
          if [ "${{ steps.classify_bootstrap.outputs.required }}" = true ]; then
            test -n "$EXPECTED_BOOTSTRAP_GENERATION"
            test "$generation" = "$EXPECTED_BOOTSTRAP_GENERATION"
            initial="$RUNNER_TEMP/public-discovery-bootstrap-completion.json"
            test -s "$initial"
            diff -u \
              <(jq -S '{artifacts,checkpoint,inventory,manifest}' "$initial") \
              <(jq -S '{artifacts,checkpoint,inventory,manifest}' "$proof")
          fi
          echo "generation=$generation" >> "$GITHUB_OUTPUT"

      - name: Re-prove exact dormant consumer tuple before bootstrap handoff
        if: success()
        timeout-minutes: 5
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.PROTECTED_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: '019d1184e655db74b7589794a2a2a533'
        run: |
          set -euo pipefail
          worker=commons-public-template-og
          message="commons-release-v1 transaction=${RELEASE_TRANSACTION_ID} gate=${TRUSTED_GATE_SHA} artifact=${ARTIFACT_DIGEST} component=og-consumer realm=production"
          deployment="$RUNNER_TEMP/bootstrap-final-og-consumer-deployment.json"
          version="$RUNNER_TEMP/bootstrap-final-og-consumer-version.json"
          gate/.github/release-gate/node_modules/.bin/wrangler deployments status \
            --name "$worker" --json > "$deployment"
          version_id=$(jq -er \
            '.versions | select(length == 1) | .[0] |
             select(.percentage == 100) | .version_id' "$deployment")
          gate/.github/release-gate/node_modules/.bin/wrangler versions view \
            "$version_id" --name "$worker" --json > "$version"
          jq -e \
            --arg id "$version_id" \
            --arg sha "$DEPLOY_SHA" \
            --arg message "$message" \
            '.id == $id and .annotations["workers/tag"] == $sha and
             .annotations["workers/message"] == $message' "$version" >/dev/null
          node gate/scripts/verify-public-template-og-deployment.mjs \
            --environment production \
            --config gate/wrangler.public-template-og.toml \
            --expected-source-sha "$DEPLOY_SHA" \
            --expected-transaction-id "$RELEASE_TRANSACTION_ID" \
            --deployment-status "$deployment" \
            --active-version "$version" \
            --producer-posture compatible \
            --delivery-posture active | jq -e \
              --arg sha "$DEPLOY_SHA" \
              --arg transaction "$RELEASE_TRANSACTION_ID" \
              '.realm == "production" and .releaseSha == $sha and
               .releaseTransactionId == $transaction and
               .producerBound == false and .deliveryPosture == "active"' >/dev/null

      - name: Seal positive production bootstrap handoff
        if: success()
        id: bootstrap_handoff
        timeout-minutes: 1
        run: |
          set -euo pipefail
          generation="${{ steps.final_bootstrap_completion.outputs.generation }}"
          test -n "$generation"
          {
            echo "source_sha=$DEPLOY_SHA"
            echo "artifact_digest=$ARTIFACT_DIGEST"
            echo "trusted_gate_sha=$TRUSTED_GATE_SHA"
            echo 'bootstrap_complete=true'
            echo "bootstrap_performed=${{ steps.classify_bootstrap.outputs.required }}"
            echo "generation=$generation"
            echo "completed_at=$(date -u +'%Y-%m-%dT%H:%M:%S.000Z')"
          } >> "$GITHUB_OUTPUT"

  activate-production:
    name: Activate production Queue producer with a fresh account-wide receipt
    needs:
      - source-verify
      - artifact-consensus
      - prepare-queue-release-kit
      - qualify-preview-generation
      - production-queue-preflight
      - bootstrap-production-discovery
    if: >-
      always() &&
      needs.source-verify.result == 'success' &&
      needs.source-verify.outputs.deploy_mode == 'normal' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.branch == 'production' &&
      needs.artifact-consensus.result == 'success' &&
      needs.prepare-queue-release-kit.result == 'success' &&
      needs.qualify-preview-generation.result == 'success' &&
      needs.production-queue-preflight.result == 'success' &&
      needs.bootstrap-production-discovery.result == 'success' &&
      needs.production-queue-preflight.outputs.source_sha == needs.source-verify.outputs.verified_sha &&
      needs.production-queue-preflight.outputs.artifact_digest == needs.artifact-consensus.outputs.artifact_digest &&
      needs.production-queue-preflight.outputs.trusted_gate_sha == needs.source-verify.outputs.trusted_gate_sha &&
      needs.production-queue-preflight.outputs.manifest_cron_state != '' &&
      needs.bootstrap-production-discovery.outputs.source_sha == needs.source-verify.outputs.verified_sha &&
      needs.bootstrap-production-discovery.outputs.artifact_digest == needs.artifact-consensus.outputs.artifact_digest &&
      needs.bootstrap-production-discovery.outputs.trusted_gate_sha == needs.source-verify.outputs.trusted_gate_sha &&
      needs.bootstrap-production-discovery.outputs.bootstrap_complete == 'true' &&
      needs.bootstrap-production-discovery.outputs.generation != '' &&
      needs.qualify-preview-generation.outputs.runtime_proved == 'true'
    runs-on: ubuntu-latest
    # 2+2+2+1+20 = 27 minutes from approval to successful final proof;
    # remaining time exists only for in-process and outer journal recovery.
    timeout-minutes: 55
    environment:
      name: Production
    permissions:
      actions: read
      contents: read
    env:
      DEPLOY_SHA: ${{ needs.source-verify.outputs.verified_sha }}
      TRUSTED_GATE_SHA: ${{ needs.source-verify.outputs.trusted_gate_sha }}
      ARTIFACT_DIGEST: ${{ needs.artifact-consensus.outputs.artifact_digest }}
      ARTIFACT_ROOT: ${{ github.workspace }}/queue-release-kit/release-artifact
    outputs:
      source_sha: ${{ steps.production_phase.outputs.source_sha }}
      artifact_digest: ${{ steps.production_phase.outputs.artifact_digest }}
      trusted_gate_sha: ${{ steps.production_phase.outputs.trusted_gate_sha }}
      pages_deployment_id: ${{ steps.production_phase.outputs.pages_deployment_id }}
      og_version_id: ${{ steps.production_phase.outputs.og_version_id }}
      completed_at: ${{ steps.production_phase.outputs.completed_at }}
      receipt_verification_deadline: ${{ steps.production_phase.outputs.receipt_verification_deadline }}
      release_lease_id: ${{ steps.production_phase.outputs.release_lease_id }}
      journal_artifact_id: ${{ steps.persist_production_journal.outputs.artifact-id }}
    steps:
      - name: Download pre-proved immutable Queue release kit for production activation
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        timeout-minutes: 2
        with:
          artifact-ids: ${{ needs.prepare-queue-release-kit.outputs.artifact_id }}
          path: ${{ runner.temp }}/queue-release-kit-download

      - name: Verify and extract immutable production activation kit
        timeout-minutes: 2
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/queue-release-kit-download/queue-release-kit.tar.gz"
          test "$(sha256sum "$archive" | awk '{print $1}')" = "${{ needs.prepare-queue-release-kit.outputs.kit_digest }}"
          tar -xzf "$archive" -C "$GITHUB_WORKSPACE"
          ln -s queue-release-kit/gate gate
          test "$(git -C gate rev-parse HEAD)" = "$TRUSTED_GATE_SHA"
          node gate/scripts/canonical-artifact-tree-digest.mjs \
            --artifact-root "$ARTIFACT_ROOT" \
            --expected-digest "$ARTIFACT_DIGEST"
          echo "PRODUCTION_PAGES_CONFIG_CWD=$GITHUB_WORKSPACE/queue-release-kit/pages-config" >> "$GITHUB_ENV"

      - name: Setup exact production activation Node runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        timeout-minutes: 2
        with:
          node-version-file: 'gate/.node-version'

      - name: Re-prove production producer readiness immediately before receipt
        timeout-minutes: 2
        env:
          PUBLIC_CONVEX_URL: https://quirky-chinchilla-352.convex.cloud
          INTERNAL_API_SECRET: ${{ secrets.PROTECTED_INTERNAL_API_SECRET_PRODUCTION }}
          PUBLIC_DISCOVERY_MAX_AGE_HOURS: '26'
          PUBLIC_DISCOVERY_REQUIRE_CONTENT: 'true'
          PUBLIC_DISCOVERY_CONTRACT_ONLY: 'false'
        run: node gate/scripts/verify-public-discovery-readiness.mjs

      - name: Re-prove signed Convex quota immediately before receipt
        timeout-minutes: 3
        env:
          CONVEX_TEAM_QUOTA_ATTESTATION_B64: ${{ secrets.PROTECTED_CONVEX_TEAM_QUOTA_ATTESTATION_B64 }}
          CONVEX_TEAM_QUOTA_SIGNATURE_B64: ${{ secrets.PROTECTED_CONVEX_TEAM_QUOTA_SIGNATURE_B64 }}
          CONVEX_USAGE_LIMITS_VIEW_TOKEN: ${{ secrets.PROTECTED_CONVEX_USAGE_LIMITS_VIEW_TOKEN }}
        run: |
          set -euo pipefail
          umask 077
          quota_attestation="$RUNNER_TEMP/convex-team-quota-before-receipt.json"
          quota_signature="$RUNNER_TEMP/convex-team-quota-before-receipt.sig"
          printf '%s' "$CONVEX_TEAM_QUOTA_ATTESTATION_B64" | base64 --decode > "$quota_attestation"
          printf '%s' "$CONVEX_TEAM_QUOTA_SIGNATURE_B64" | base64 --decode > "$quota_signature"
          node gate/scripts/verify-convex-native-usage-limits.mjs \
            --environment production \
            --source-sha "$DEPLOY_SHA" \
            --purpose full-normal-release \
            --minimum-validity-seconds 180 \
            --attestation "$quota_attestation" \
            --signature "$quota_signature" \
            --allowed-signers gate/.github/convex-quota-allowed-signers

      - name: Re-prove work budget immediately before receipt
        timeout-minutes: 3
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.PROTECTED_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: '019d1184e655db74b7589794a2a2a533'
        run: >-
          node gate/scripts/verify-convex-work-budget-deployment.mjs
          --environment production --worker-only

      - name: Re-prove zero cron authority immediately before receipt
        timeout-minutes: 3
        env:
          PROTECTED_CONVEX_PREVIEW_CRON_DATA_VIEW_DEPLOY_KEY: ${{ secrets.PROTECTED_CONVEX_PREVIEW_CRON_DATA_VIEW_DEPLOY_KEY }}
          PROTECTED_CONVEX_PRODUCTION_CRON_DATA_VIEW_DEPLOY_KEY: ${{ secrets.PROTECTED_CONVEX_PRODUCTION_CRON_DATA_VIEW_DEPLOY_KEY }}
        run: >-
          node gate/scripts/verify-convex-contained-cron-deployments.mjs
          --environment all
          --expected-state running

      # The later qualification runner can die after replacing the scheduler
      # or trusted edge. Seal their exact rollback versions into the same
      # append-only R2 baseline as Queue/Pages before any release mutation.
      - name: Capture production coordination rollback custody before receipt
        timeout-minutes: 8
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.PROTECTED_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: '019d1184e655db74b7589794a2a2a533'
          CLOUDFLARE_ZONE_ID: ${{ secrets.PROTECTED_CLOUDFLARE_ZONE_ID }}
          RELEASE_ORIGIN_PROOF_SECRET: ${{ secrets.PROTECTED_RELEASE_ORIGIN_PROOF_SECRET_PRODUCTION }}
          MANIFEST_CRON_BASELINE_STATE: ${{ needs.production-queue-preflight.outputs.manifest_cron_state }}
          MANIFEST_CRON_BASELINE_VERSION_ID: ${{ needs.production-queue-preflight.outputs.manifest_cron_version_id }}
          MANIFEST_CRON_BASELINE_RELEASE_SHA: ${{ needs.production-queue-preflight.outputs.manifest_cron_release_sha }}
        run: |
          set -euo pipefail
          capture="$RUNNER_TEMP/production-coordination-rollback-capture.json"
          case "$MANIFEST_CRON_BASELINE_STATE" in
            absent)
              test -z "$MANIFEST_CRON_BASELINE_VERSION_ID"
              test -z "$MANIFEST_CRON_BASELINE_RELEASE_SHA"
              absent_manifest="$RUNNER_TEMP/production-coordination-manifest-absent.json"
              absent_manifest_status=$(curl -sS --max-time 30 -o "$absent_manifest" -w '%{http_code}' \
                -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/commons-public-discovery-manifest-cron/settings")
              test "$absent_manifest_status" = "404"
              manifest=$(jq -cn '{state:"absent"}')
              ;;
            present)
              [[ "$MANIFEST_CRON_BASELINE_VERSION_ID" =~ ^([a-f0-9]{32}|[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12})$ ]]
              [[ "$MANIFEST_CRON_BASELINE_RELEASE_SHA" =~ ^[a-f0-9]{40}$ ]]
              current_manifest=$(gate/.github/release-gate/node_modules/.bin/wrangler deployments status \
                --name commons-public-discovery-manifest-cron --json)
              current_manifest_version=$(printf '%s' "$current_manifest" | jq -er \
                '.versions | select(length == 1) | .[0] | select(.percentage == 100) | .version_id')
              test "$current_manifest_version" = "$MANIFEST_CRON_BASELINE_VERSION_ID"
              current_manifest_body="$RUNNER_TEMP/production-coordination-manifest-version.json"
              gate/.github/release-gate/node_modules/.bin/wrangler versions view \
                "$current_manifest_version" --name commons-public-discovery-manifest-cron --json \
                > "$current_manifest_body"
              test "$(jq -er '.annotations["workers/tag"]' "$current_manifest_body")" = "$MANIFEST_CRON_BASELINE_RELEASE_SHA"
              manifest=$(jq -cn \
                --arg version "$MANIFEST_CRON_BASELINE_VERSION_ID" \
                --arg sha "$MANIFEST_CRON_BASELINE_RELEASE_SHA" \
                '{state:"present",versionId:$version,releaseSha:$sha}')
              ;;
            *)
              echo '::error::Manifest cron preflight custody is invalid.'
              exit 1
              ;;
          esac

          worker=commons-trusted-pages-edge
          edge_settings="$RUNNER_TEMP/production-coordination-edge-settings.json"
          edge_status=$(curl -sS --max-time 30 -o "$edge_settings" -w '%{http_code}' \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${worker}/settings")
          if [ "$edge_status" != "200" ]; then
            echo "::error::A retained trusted Pages edge is mandatory before a normal production transaction (HTTP ${edge_status})."
            exit 1
          fi
          edge_deployment="$RUNNER_TEMP/production-coordination-edge-deployment.json"
          edge_version="$RUNNER_TEMP/production-coordination-edge-version.json"
          gate/.github/release-gate/node_modules/.bin/wrangler deployments status \
            --name "$worker" --json > "$edge_deployment"
          edge_version_id=$(jq -er \
            '.versions | select(length == 1) | .[0] | select(.percentage == 100) |
             .version_id | select(test("^([a-f0-9]{32}|[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12})$"))' \
            "$edge_deployment")
          gate/.github/release-gate/node_modules/.bin/wrangler versions view "$edge_version_id" \
            --name "$worker" --json > "$edge_version"
          edge_sha=$(jq -er '.annotations["workers/tag"] | select(test("^[a-f0-9]{40}$"))' \
            "$edge_version")
          edge_transaction=$(jq -er \
            '.result.bindings | map(select(.name == "PUBLIC_RELEASE_TRANSACTION_ID" and
             .type == "plain_text")) | select(length == 1) | .[0].text |
             select(test("^[1-9][0-9]{0,19}-[1-9][0-9]{0,9}$"))' \
            "$edge_settings")
          baseline_pages=$(node gate/scripts/cloudflare-pages-production-control.mjs capture)
          baseline_pages_sha=$(printf '%s' "$baseline_pages" | jq -er \
            '.releaseSha | select(test("^[a-f0-9]{40}$"))')
          baseline_pages_transaction=$(printf '%s' "$baseline_pages" | jq -er \
            '.releaseTransaction | select(test("^[1-9][0-9]{0,19}-[1-9][0-9]{0,9}$"))')
          baseline_pages_component=$(printf '%s' "$baseline_pages" | jq -er \
            '.releaseComponent | select(. == "pages" or . == "pages-containment")')
          test "$edge_sha" = "$baseline_pages_sha"
          test "$edge_transaction" = "$baseline_pages_transaction"
          if [ "$MANIFEST_CRON_BASELINE_STATE" = "present" ]; then
            test "$MANIFEST_CRON_BASELINE_RELEASE_SHA" = "$baseline_pages_sha"
          fi
          node --input-type=module <<'NODE'
          const proof = process.env.RELEASE_ORIGIN_PROOF_SECRET ?? '';
          const bytes = Buffer.byteLength(proof, 'utf8');
          if (
            bytes < 32 || bytes > 512 || !/^[\u0021-\u007e]+$/u.test(proof) ||
            proof === process.env.CLOUDFLARE_API_TOKEN
          ) throw new Error('The retained-pair proof capability is malformed or reused.');
          NODE
          baseline_missing_status=$(curl -sS --max-time 30 \
            --proto '=https' --tlsv1.2 --request GET \
            --header 'Accept: application/json' \
            --header 'x-commons-release-origin-purpose: post-commit-v1' \
            --output /dev/null --write-out '%{http_code}' \
            'https://commons.email/api/release-origin')
          test "$baseline_missing_status" = "421"
          wrong_prefix=A
          if [ "${RELEASE_ORIGIN_PROOF_SECRET:0:1}" = "A" ]; then
            wrong_prefix=B
          fi
          wrong_proof_secret="${wrong_prefix}${RELEASE_ORIGIN_PROOF_SECRET:1}"
          baseline_wrong_status=$(curl -sS --max-time 30 \
            --proto '=https' --tlsv1.2 --request GET \
            --header 'Accept: application/json' \
            --header 'x-commons-release-origin-purpose: post-commit-v1' \
            --header "x-commons-release-origin-proof-secret: ${wrong_proof_secret}" \
            --output /dev/null --write-out '%{http_code}' \
            'https://commons.email/api/release-origin')
          unset wrong_proof_secret
          test "$baseline_wrong_status" = "421"
          baseline_headers="$RUNNER_TEMP/production-coordination-baseline.headers"
          baseline_body="$RUNNER_TEMP/production-coordination-baseline.json"
          baseline_status=$(curl -sS --max-time 30 \
            --proto '=https' --tlsv1.2 --request GET \
            --header 'Accept: application/json' \
            --header 'x-commons-release-origin-purpose: post-commit-v1' \
            --header "x-commons-release-origin-proof-secret: ${RELEASE_ORIGIN_PROOF_SECRET}" \
            --dump-header "$baseline_headers" --output "$baseline_body" --write-out '%{http_code}' \
            'https://commons.email/api/release-origin')
          node gate/scripts/verify-trusted-pages-release-origin-response.mjs \
            --component "$baseline_pages_component" \
            --headers "$baseline_headers" \
            --body "$baseline_body" \
            --status "$baseline_status" \
            --release-sha "$baseline_pages_sha" \
            --transaction-id "$baseline_pages_transaction" >/dev/null
          edge_routes="$RUNNER_TEMP/production-coordination-edge-routes.json"
          curl -fsS --max-time 30 \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/workers/routes" \
            > "$edge_routes"
          node gate/scripts/verify-trusted-pages-release-edge.mjs verify-route-inventory \
            --environment production --expected present < "$edge_routes" >/dev/null
          jq -cn \
            --argjson manifest "$manifest" \
            --arg version "$edge_version_id" \
            --arg sha "$edge_sha" \
            --arg transaction "$edge_transaction" \
            '{schemaVersion:1,manifestCron:$manifest,
              trustedEdge:{state:"present",versionId:$version,releaseSha:$sha,
                releaseTransaction:$transaction}}' > "$capture"
          chmod 600 "$capture"

      - name: Materialize fresh post-qualification production Queue Free receipt
        timeout-minutes: 1
        env:
          QUEUE_FREE_ATTESTATION_B64: ${{ secrets.PROTECTED_CLOUDFLARE_QUEUE_FREE_ACTIVATE_PRODUCTION_ATTESTATION_B64 }}
          QUEUE_FREE_SIGNATURE_B64: ${{ secrets.PROTECTED_CLOUDFLARE_QUEUE_FREE_ACTIVATE_PRODUCTION_SIGNATURE_B64 }}
          PREVIEW_QUALIFIED_AT: ${{ needs.qualify-preview-generation.outputs.completed_at }}
          BOOTSTRAP_COMPLETED_AT: ${{ needs.bootstrap-production-discovery.outputs.completed_at }}
        run: |
          set -euo pipefail
          umask 077
          attestation="$RUNNER_TEMP/cloudflare-queue-production.json"
          signature="$RUNNER_TEMP/cloudflare-queue-production.sig"
          printf '%s' "$QUEUE_FREE_ATTESTATION_B64" | base64 --decode > "$attestation"
          printf '%s' "$QUEUE_FREE_SIGNATURE_B64" | base64 --decode > "$signature"
          jq -e \
            --arg previewCompleted "$PREVIEW_QUALIFIED_AT" \
            --arg bootstrapCompleted "$BOOTSTRAP_COMPLETED_AT" \
            '.releasePhase == "activate-production" and
             .observations[0].observedAt >= $previewCompleted and
             .observations[1].observedAt >= $previewCompleted and
             .observations[0].observedAt >= $bootstrapCompleted and
             .observations[1].observedAt >= $bootstrapCompleted and
             .capturedAt >= .observations[1].observedAt' "$attestation" >/dev/null
          {
            echo "QUEUE_FREE_ATTESTATION_PATH=$attestation"
            echo "QUEUE_FREE_SIGNATURE_PATH=$signature"
          } >> "$GITHUB_ENV"

      - name: Execute fresh-receipt production activation transaction
        id: production_phase
        timeout-minutes: 35
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.PROTECTED_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: '019d1184e655db74b7589794a2a2a533'
          INTERNAL_API_SECRET: ${{ secrets.PROTECTED_INTERNAL_API_SECRET_PRODUCTION }}
          RELEASE_CONTROL_SECRET: ${{ secrets.PROTECTED_RELEASE_CONTROL_SECRET_PRODUCTION }}
        run: |
          set -euo pipefail
          result=$(node gate/scripts/run-public-template-og-release-phase.mjs \
            --realm production \
            --branch production \
            --artifact-root "$ARTIFACT_ROOT" \
            --artifact-digest "$ARTIFACT_DIGEST" \
            --release-kit "$RUNNER_TEMP/queue-release-kit-download/queue-release-kit.tar.gz" \
            --release-kit-digest "${{ needs.prepare-queue-release-kit.outputs.kit_digest }}" \
            --repository "$GITHUB_REPOSITORY" \
            --repository-id "$GITHUB_REPOSITORY_ID" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --transaction-id "$RELEASE_TRANSACTION_ID" \
            --trusted-root gate \
            --wrangler gate/.github/release-gate/node_modules/.bin/wrangler \
            --pages-config-cwd "$PRODUCTION_PAGES_CONFIG_CWD" \
            --attestation "$QUEUE_FREE_ATTESTATION_PATH" \
            --signature "$QUEUE_FREE_SIGNATURE_PATH" \
            --source-sha "$DEPLOY_SHA" \
            --trusted-gate-sha "$TRUSTED_GATE_SHA" \
            --pages-output "$RUNNER_TEMP/pages-deploy-output.txt" \
            --journal "$RUNNER_TEMP/public-template-og-production-release-journal.json" \
            --coordination-capture "$RUNNER_TEMP/production-coordination-rollback-capture.json" \
            --preview-pages-deployment-id "${{ needs.qualify-preview-generation.outputs.pages_deployment_id }}" \
            --preview-og-version-id "${{ needs.qualify-preview-generation.outputs.og_version_id }}" \
            --preview-proof "${{ needs.qualify-preview-generation.outputs.proof }}")
          printf '%s' "$result" | jq -e \
            --arg sha "$DEPLOY_SHA" \
            --arg digest "$ARTIFACT_DIGEST" \
            --arg gate "$TRUSTED_GATE_SHA" \
            --arg preview_pages "${{ needs.qualify-preview-generation.outputs.pages_deployment_id }}" \
            --arg preview_og "${{ needs.qualify-preview-generation.outputs.og_version_id }}" \
            --arg preview_proof "${{ needs.qualify-preview-generation.outputs.proof }}" \
            '.realm == "production" and .releasePhase == "activate-production" and
             .releaseSha == $sha and .artifactDigest == $digest and .trustedGateSha == $gate and
             .producerBound == true and .deliveryPaused == false and
             .targetRuntimeProved == false and .candidateFetchProved == true and
             .qualifiedPreviewPagesDeploymentId == $preview_pages and
             .qualifiedPreviewOgVersionId == $preview_og and
             .qualifiedPreviewProof == $preview_proof and
             (.pagesDeploymentId | test("^[0-9a-f-]{32,36}$")) and
             (.ogVersionId | test("^[0-9a-f-]{32,36}$")) and
             (.receiptVerificationDeadlineAt | type == "string") and
             (.releaseAuthorityLeaseId | test("^[0-9a-f-]{36}$"))' >/dev/null
          {
            echo "source_sha=$DEPLOY_SHA"
            echo "artifact_digest=$ARTIFACT_DIGEST"
            echo "trusted_gate_sha=$TRUSTED_GATE_SHA"
            echo "pages_deployment_id=$(printf '%s' "$result" | jq -er '.pagesDeploymentId')"
            echo "og_version_id=$(printf '%s' "$result" | jq -er '.ogVersionId')"
            echo "receipt_verification_deadline=$(printf '%s' "$result" | jq -er '.receiptVerificationDeadlineAt')"
            echo "release_lease_id=$(printf '%s' "$result" | jq -er '.releaseAuthorityLeaseId')"
            echo "completed_at=$(date -u +'%Y-%m-%dT%H:%M:%S.000Z')"
          } >> "$GITHUB_OUTPUT"

      - name: Recover an interrupted production activation from its durable journal
        if: always()
        timeout-minutes: 8
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.PROTECTED_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: '019d1184e655db74b7589794a2a2a533'
          INTERNAL_API_SECRET: ${{ secrets.PROTECTED_INTERNAL_API_SECRET_PRODUCTION }}
          RELEASE_CONTROL_SECRET: ${{ secrets.PROTECTED_RELEASE_CONTROL_SECRET_PRODUCTION }}
        run: |
          recovery_result="$RUNNER_TEMP/public-template-og-production-activation-recovery.json"
          node gate/scripts/run-public-template-og-release-phase.mjs recover \
            --journal "$RUNNER_TEMP/public-template-og-production-release-journal.json" \
            --trusted-root gate \
            --wrangler gate/.github/release-gate/node_modules/.bin/wrangler \
            --realm production \
            --source-sha "$DEPLOY_SHA" \
            --trusted-gate-sha "$TRUSTED_GATE_SHA" \
            --artifact-digest "$ARTIFACT_DIGEST" \
            --release-kit-digest "${{ needs.prepare-queue-release-kit.outputs.kit_digest }}" \
            --repository "$GITHUB_REPOSITORY" \
            --repository-id "$GITHUB_REPOSITORY_ID" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --transaction-id "$RELEASE_TRANSACTION_ID" \
            --force false > "$recovery_result"

      - name: Reconcile failed production activation after journal recovery
        if: always() && (failure() || cancelled())
        timeout-minutes: 15
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.PROTECTED_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: '019d1184e655db74b7589794a2a2a533'
          CF_PAGES_PROJECT: communique-site
          CF_PAGES_ALLOWED_ALIAS_BRANCHES: production
        run: |
          set -euo pipefail
          test -s "$RUNNER_TEMP/public-template-og-production-activation-recovery.json"
          reconciliation=$(node gate/scripts/reconcile-cloudflare-pages-exposure.mjs \
            --prune \
            --expected-production-sha "$DEPLOY_SHA")
          printf '%s\n' "$reconciliation"
          if ! grep -q 'stale=0;' <<<"$reconciliation" || \
            ! grep -q 'preserved=0;' <<<"$reconciliation"; then
            echo "::error::Production activation recovery retained an exposed deployment."
            exit 1
          fi

      - name: Persist production recovery journal for generation qualification
        id: persist_production_journal
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: public-template-og-production-release-journal-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/public-template-og-production-release-journal.json
          if-no-files-found: ignore
          retention-days: 1

  qualify-production-generation:
    name: Commit and prove trusted production authority
    needs:
      - source-verify
      - artifact-consensus
      - prepare-queue-release-kit
      - qualify-preview-generation
      - production-queue-preflight
      - activate-production
    if: >-
      always() &&
      needs.source-verify.result == 'success' &&
      needs.source-verify.outputs.deploy_mode == 'normal' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.branch == 'production' &&
      needs.artifact-consensus.result == 'success' &&
      needs.prepare-queue-release-kit.result == 'success' &&
      needs.qualify-preview-generation.result == 'success' &&
      needs.production-queue-preflight.result == 'success' &&
      needs.activate-production.result == 'success' &&
      needs.production-queue-preflight.outputs.source_sha == needs.source-verify.outputs.verified_sha &&
      needs.production-queue-preflight.outputs.artifact_digest == needs.artifact-consensus.outputs.artifact_digest &&
      needs.production-queue-preflight.outputs.trusted_gate_sha == needs.source-verify.outputs.trusted_gate_sha &&
      needs.production-queue-preflight.outputs.manifest_cron_state != '' &&
      needs.activate-production.outputs.source_sha == needs.source-verify.outputs.verified_sha &&
      needs.activate-production.outputs.artifact_digest == needs.artifact-consensus.outputs.artifact_digest &&
      needs.activate-production.outputs.trusted_gate_sha == needs.source-verify.outputs.trusted_gate_sha &&
      needs.qualify-preview-generation.outputs.source_sha == needs.source-verify.outputs.verified_sha &&
      needs.qualify-preview-generation.outputs.artifact_digest == needs.artifact-consensus.outputs.artifact_digest &&
      needs.qualify-preview-generation.outputs.trusted_gate_sha == needs.source-verify.outputs.trusted_gate_sha &&
      needs.qualify-preview-generation.outputs.runtime_proved == 'true' &&
      needs.activate-production.outputs.journal_artifact_id != ''
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: Production
    permissions:
      actions: read
      contents: read
    env:
      DEPLOY_SHA: ${{ needs.source-verify.outputs.verified_sha }}
      TRUSTED_GATE_SHA: ${{ needs.source-verify.outputs.trusted_gate_sha }}
      ARTIFACT_DIGEST: ${{ needs.artifact-consensus.outputs.artifact_digest }}
      PRODUCTION_PAGES_DEPLOYMENT_ID: ${{ needs.activate-production.outputs.pages_deployment_id }}
      PRODUCTION_OG_VERSION_ID: ${{ needs.activate-production.outputs.og_version_id }}
      QUALIFIED_PREVIEW_PAGES_DEPLOYMENT_ID: ${{ needs.qualify-preview-generation.outputs.pages_deployment_id }}
      QUALIFIED_PREVIEW_OG_VERSION_ID: ${{ needs.qualify-preview-generation.outputs.og_version_id }}
      QUALIFIED_PREVIEW_PROOF: ${{ needs.qualify-preview-generation.outputs.proof }}
      MANIFEST_CRON_BASELINE_STATE: ${{ needs.production-queue-preflight.outputs.manifest_cron_state }}
      MANIFEST_CRON_BASELINE_VERSION_ID: ${{ needs.production-queue-preflight.outputs.manifest_cron_version_id }}
      MANIFEST_CRON_BASELINE_RELEASE_SHA: ${{ needs.production-queue-preflight.outputs.manifest_cron_release_sha }}
    steps:
      - name: Download immutable kit for production qualification
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        timeout-minutes: 3
        with:
          artifact-ids: ${{ needs.prepare-queue-release-kit.outputs.artifact_id }}
          path: ${{ runner.temp }}/queue-release-kit-download

      - name: Download exact production recovery journal
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        timeout-minutes: 2
        with:
          artifact-ids: ${{ needs.activate-production.outputs.journal_artifact_id }}
          path: ${{ runner.temp }}/production-release-journal

      - name: Verify and extract production qualification kit
        timeout-minutes: 3
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/queue-release-kit-download/queue-release-kit.tar.gz"
          test "$(sha256sum "$archive" | awk '{print $1}')" = "${{ needs.prepare-queue-release-kit.outputs.kit_digest }}"
          tar -xzf "$archive" -C "$GITHUB_WORKSPACE"
          ln -s queue-release-kit/gate gate
          test "$(git -C gate rev-parse HEAD)" = "$TRUSTED_GATE_SHA"
          edge_artifact_root="$GITHUB_WORKSPACE/queue-release-kit/release-artifact"
          node gate/scripts/canonical-artifact-tree-digest.mjs \
            --artifact-root "$edge_artifact_root" \
            --expected-digest "$ARTIFACT_DIGEST"
          echo "EDGE_ARTIFACT_ROOT=$edge_artifact_root" >> "$GITHUB_ENV"

      - name: Setup exact production qualification runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        timeout-minutes: 3
        with:
          node-version-file: 'gate/.node-version'

      - name: Prove immutable production coordination rollback custody
        timeout-minutes: 2
        run: |
          set -euo pipefail
          journal="$RUNNER_TEMP/production-release-journal/public-template-og-production-release-journal.json"
          node --input-type=module - "$journal" <<'NODE'
          import { readFileSync } from 'node:fs';
          import { validatePublicTemplateOgReleaseJournal } from './gate/scripts/run-public-template-og-release-phase.mjs';
          const journal = validatePublicTemplateOgReleaseJournal(
            JSON.parse(readFileSync(process.argv[2], 'utf8'))
          );
          if (journal.realm !== 'production') throw new Error('Coordination custody crossed realms.');
          NODE
          manifest_state=$(jq -er '.coordinationCapture.manifestCron.state' "$journal")
          test "$manifest_state" = "$MANIFEST_CRON_BASELINE_STATE"
          if [ "$manifest_state" = "present" ]; then
            test "$(jq -er '.coordinationCapture.manifestCron.versionId' "$journal")" = "$MANIFEST_CRON_BASELINE_VERSION_ID"
            test "$(jq -er '.coordinationCapture.manifestCron.releaseSha' "$journal")" = "$MANIFEST_CRON_BASELINE_RELEASE_SHA"
          else
            test -z "$MANIFEST_CRON_BASELINE_VERSION_ID"
            test -z "$MANIFEST_CRON_BASELINE_RELEASE_SHA"
          fi

      - name: Re-prove both Convex cron realms before production qualification
        timeout-minutes: 3
        env:
          PROTECTED_CONVEX_PREVIEW_CRON_DATA_VIEW_DEPLOY_KEY: ${{ secrets.PROTECTED_CONVEX_PREVIEW_CRON_DATA_VIEW_DEPLOY_KEY }}
          PROTECTED_CONVEX_PRODUCTION_CRON_DATA_VIEW_DEPLOY_KEY: ${{ secrets.PROTECTED_CONVEX_PRODUCTION_CRON_DATA_VIEW_DEPLOY_KEY }}
        run: >-
          node gate/scripts/verify-convex-contained-cron-deployments.mjs
          --environment all
          --expected-state running

      - name: Prove retained production edge rollback capability before Q
        id: prove_retained_production_edge
        timeout-minutes: 5
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.PROTECTED_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: '019d1184e655db74b7589794a2a2a533'
          CLOUDFLARE_ZONE_ID: ${{ secrets.PROTECTED_CLOUDFLARE_ZONE_ID }}
        run: |
          set -euo pipefail
          worker=commons-trusted-pages-edge
          journal="$RUNNER_TEMP/production-release-journal/public-template-og-production-release-journal.json"
          expected_version=$(jq -er \
            '.coordinationCapture.trustedEdge.versionId |
             select(test("^([a-f0-9]{32}|[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12})$"))' \
            "$journal")
          expected_sha=$(jq -er \
            '.coordinationCapture.trustedEdge.releaseSha | select(test("^[a-f0-9]{40}$"))' \
            "$journal")
          expected_transaction=$(jq -er \
            '.coordinationCapture.trustedEdge.releaseTransaction |
             select(test("^[1-9][0-9]{0,19}-[1-9][0-9]{0,9}$"))' \
            "$journal")
          settings_body="$RUNNER_TEMP/trusted-pages-edge-production-pre-q-settings.json"
          settings_status=$(curl -sS --max-time 30 -o "$settings_body" -w '%{http_code}' \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${worker}/settings")
          test "$settings_status" = "200"
          jq -e --arg transaction "$expected_transaction" \
            '.result.bindings | map(select(.name == "PUBLIC_RELEASE_TRANSACTION_ID" and
             .type == "plain_text" and .text == $transaction)) | length == 1' \
            "$settings_body" >/dev/null
          deployment="$RUNNER_TEMP/trusted-pages-edge-production-pre-q-deployment.json"
          version="$RUNNER_TEMP/trusted-pages-edge-production-pre-q-version.json"
          gate/.github/release-gate/node_modules/.bin/wrangler deployments status \
            --name "$worker" --json > "$deployment"
          test "$(jq -er '.versions | select(length == 1) | .[0] |
            select(.percentage == 100) | .version_id' "$deployment")" = "$expected_version"
          gate/.github/release-gate/node_modules/.bin/wrangler versions view "$expected_version" \
            --name "$worker" --json > "$version"
          test "$(jq -er '.annotations["workers/tag"]' "$version")" = "$expected_sha"
          routes="$RUNNER_TEMP/trusted-pages-edge-production-pre-q-routes.json"
          curl -fsS --max-time 30 \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/workers/routes" \
            > "$routes"
          node gate/scripts/verify-trusted-pages-release-edge.mjs verify-route-inventory \
            --environment production --expected present < "$routes" >/dev/null

      # This hidden-origin route reads only the built release identity. It
      # spends no Convex/R2/Queue budget and does not cross public commit C.
      - name: Wait for exact deployment liveness
        timeout-minutes: 3
        env:
          PAGES_ORIGIN_ACCESS_TOKEN: ${{ secrets.PROTECTED_PAGES_ORIGIN_ACCESS_TOKEN_PRODUCTION }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$PAGES_ORIGIN_ACCESS_TOKEN" | jq -e \
            'type == "object" and (keys | sort) == ["cf-access-client-id","cf-access-client-secret"] and
             (."cf-access-client-id" | type == "string" and test("^[A-Za-z0-9._-]{16,256}$")) and
             (."cf-access-client-secret" | type == "string" and test("^[A-Za-z0-9._-]{32,512}$"))' \
            >/dev/null; then
            echo "::error::The hidden production origin liveness capability is malformed."
            exit 1
          fi
          live=false
          for attempt in {1..12}; do
            if response=$(curl -sS --max-time 10 -w "\n%{http_code}" \
              --proto '=https' \
              --tlsv1.2 \
              --request GET \
              --header "x-commons-pages-origin-access: ${PAGES_ORIGIN_ACCESS_TOKEN}" \
              --header 'x-commons-edge-public-host: commons.email' \
              --header "x-commons-edge-release-sha: ${DEPLOY_SHA}" \
              --header "x-commons-edge-release-transaction: ${RELEASE_TRANSACTION_ID}" \
              --header 'x-forwarded-host: commons.email' \
              --header 'x-forwarded-proto: https' \
              --header "x-expected-release-sha: ${DEPLOY_SHA}" \
              --header "x-expected-release-transaction: ${RELEASE_TRANSACTION_ID}" \
              'https://pages-origin.commons.email/api/live'); then
              http_status=$(printf '%s\n' "$response" | tail -n 1)
              body=$(printf '%s\n' "$response" | sed '$d')
              if [ "$http_status" = "200" ] && printf '%s' "$body" | jq -e \
                --arg sha "$DEPLOY_SHA" \
                --arg transaction "$RELEASE_TRANSACTION_ID" \
                '(keys | sort) == ["release","status","uptime"] and
                 (.release | keys | sort) == ["sha","transactionId"] and
                 .status == "ok" and .release.sha == $sha and
                 .release.transactionId == $transaction and
                 (.uptime | type == "number" and . >= 0)' >/dev/null; then
                live=true
                break
              fi
            fi
            if [ "$attempt" = "12" ]; then
              echo "::error::The hidden production deployment did not converge on exact-tuple liveness."
              exit 1
            fi
            sleep 5
          done
          test "$live" = "true"

      - name: Seed global public-discovery manifest control state
        id: seed_production_manifest
        # A normal release is proof-only: cold/multi-page work belongs to the
        # resumable bootstrap phase. Preserve fifteen minutes of the signed
        # receipt for graph, cron, and Q verification after this one request.
        timeout-minutes: 2
        env:
          PAGES_ORIGIN_ACCESS_TOKEN: ${{ secrets.PROTECTED_PAGES_ORIGIN_ACCESS_TOKEN_PRODUCTION }}
          DISCOVERY_MANIFEST_REFRESH_SECRET: ${{ secrets.PROTECTED_DISCOVERY_MANIFEST_REFRESH_SECRET }}
          INTERNAL_API_SECRET: ${{ secrets.PROTECTED_INTERNAL_API_SECRET_PRODUCTION }}
        run: |
          set -euo pipefail
          journal="$RUNNER_TEMP/production-release-journal/public-template-og-production-release-journal.json"
          receipt_deadline=$(jq -er '.receipt.verificationDeadlineAt' "$journal")
          test "$receipt_deadline" = "${{ needs.activate-production.outputs.receipt_verification_deadline }}"
          seed_proof=$(node gate/scripts/seed-public-discovery-manifest.mjs \
            --endpoint https://pages-origin.commons.email/api/internal/public-discovery-manifest-refresh \
            --expected-release-sha "$DEPLOY_SHA" \
            --expected-release-transaction "$RELEASE_TRANSACTION_ID" \
            --receipt-verification-deadline "$receipt_deadline" \
            --qualification-reserve-milliseconds 900000 \
            --maximum-attempts 1)
          printf '%s\n' "$seed_proof"
          printf '%s' "$seed_proof" | jq -e \
            --arg sha "$DEPLOY_SHA" \
            --arg transaction "$RELEASE_TRANSACTION_ID" \
            --arg receipt_deadline "$receipt_deadline" \
            '.proof == "public-discovery-manifest-deploy-seed" and
             .gateProtocol == "3" and
             .endpoint == "https://pages-origin.commons.email/api/internal/public-discovery-manifest-refresh" and
             .expectedReleaseSha == $sha and .expectedReleaseTransaction == $transaction and
             .receiptVerificationDeadlineAt == $receipt_deadline and
             .qualificationReserveMilliseconds == 900000 and
             (((.receiptVerificationDeadlineAt | sub("\\.000Z$"; "Z") | fromdateiso8601) -
               (.seedCompletionDeadlineAt | sub("\\.000Z$"; "Z") | fromdateiso8601)) == 900) and
             .attempts == 1 and .continuationUsed == false and
             (.generation | type == "string") and
             .list.ready == true and .relations.ready == true' >/dev/null

      - name: Prove exact immutable bundled graph surface
        timeout-minutes: 3
        env:
          PAGES_ORIGIN_ACCESS_TOKEN: ${{ secrets.PROTECTED_PAGES_ORIGIN_ACCESS_TOKEN_PRODUCTION }}
          INTERNAL_API_SECRET: ${{ secrets.PROTECTED_INTERNAL_API_SECRET_PRODUCTION }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$PAGES_ORIGIN_ACCESS_TOKEN" | jq -e \
            'type == "object" and (keys | sort) == ["cf-access-client-id","cf-access-client-secret"] and
             (."cf-access-client-id" | type == "string" and test("^[A-Za-z0-9._-]{16,256}$")) and
             (."cf-access-client-secret" | type == "string" and test("^[A-Za-z0-9._-]{32,512}$"))' \
            >/dev/null || [ "${#INTERNAL_API_SECRET}" -lt 32 ]; then
            echo "::error::Hidden-origin graph proof capabilities are malformed."
            exit 1
          fi
          headers="$RUNNER_TEMP/production-hidden-graph.headers"
          body="$RUNNER_TEMP/production-hidden-graph.body"
          status=$(curl -sS --max-time 30 --max-filesize 1048576 \
            --proto '=https' --tlsv1.2 --request GET \
            --header "x-commons-pages-origin-access: ${PAGES_ORIGIN_ACCESS_TOKEN}" \
            --header 'x-commons-edge-public-host: commons.email' \
            --header "x-commons-edge-release-sha: ${DEPLOY_SHA}" \
            --header "x-commons-edge-release-transaction: ${RELEASE_TRANSACTION_ID}" \
            --header 'x-forwarded-host: commons.email' \
            --header 'x-forwarded-proto: https' \
            --header "x-expected-release-sha: ${DEPLOY_SHA}" \
            --header "x-expected-release-transaction: ${RELEASE_TRANSACTION_ID}" \
            --header "x-internal-secret: ${INTERNAL_API_SECRET}" \
            --dump-header "$headers" --output "$body" --write-out '%{http_code}' \
            'https://pages-origin.commons.email/?view=graph')
          graph_status=$(awk 'tolower($0) ~ /^x-public-discovery-graph:/ {
            sub(/^[^:]+:[[:space:]]*/, ""); gsub(/\r/, ""); value=tolower($0)
          } END { print value }' "$headers")
          if [ "$status" != "200" ] || [ "$graph_status" != "ready" ]; then
            echo "::error::The hidden exact production candidate did not prove its bundled graph."
            head -c 4000 "$body"
            exit 1
          fi

      - name: Deploy public-discovery manifest cron control Worker
        id: manifest_cron_deploy
        timeout-minutes: 6
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.PROTECTED_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: '019d1184e655db74b7589794a2a2a533'
          DISCOVERY_MANIFEST_REFRESH_SECRET: ${{ secrets.PROTECTED_DISCOVERY_MANIFEST_REFRESH_SECRET }}
          DISCOVERY_MANIFEST_REFRESH_SECRET_NONPROD: ${{ secrets.PROTECTED_DISCOVERY_MANIFEST_REFRESH_SECRET_NONPROD }}
          INTERNAL_API_SECRET: ${{ secrets.PROTECTED_INTERNAL_API_SECRET_PRODUCTION }}
          PAGES_ORIGIN_ACCESS_TOKEN: ${{ secrets.PROTECTED_PAGES_ORIGIN_ACCESS_TOKEN_PRODUCTION }}
        run: |
          set -euo pipefail
          case "$MANIFEST_CRON_BASELINE_STATE" in
            absent)
              test -z "$MANIFEST_CRON_BASELINE_VERSION_ID"
              test -z "$MANIFEST_CRON_BASELINE_RELEASE_SHA"
              ;;
            present)
              [[ "$MANIFEST_CRON_BASELINE_VERSION_ID" =~ ^([a-f0-9]{32}|[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12})$ ]]
              [[ "$MANIFEST_CRON_BASELINE_RELEASE_SHA" =~ ^[a-f0-9]{40}$ ]]
              ;;
            *)
              echo "::error::Manifest cron rollback baseline is invalid."
              exit 1
              ;;
          esac
          live_manifest="$RUNNER_TEMP/manifest-cron-before-replacement.json"
          live_manifest_status=$(curl -sS --max-time 30 -o "$live_manifest" -w '%{http_code}' \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/commons-public-discovery-manifest-cron/settings")
          if [ "$MANIFEST_CRON_BASELINE_STATE" = "absent" ]; then
            test "$live_manifest_status" = "404"
          else
            test "$live_manifest_status" = "200"
            live_manifest_deployment="$RUNNER_TEMP/manifest-cron-before-replacement-deployment.json"
            gate/.github/release-gate/node_modules/.bin/wrangler deployments status \
              --name commons-public-discovery-manifest-cron --json > "$live_manifest_deployment"
            test "$(jq -er '.versions | select(length == 1) | .[0] |
              select(.percentage == 100) | .version_id' "$live_manifest_deployment")" = "$MANIFEST_CRON_BASELINE_VERSION_ID"
          fi
          node gate/scripts/finalize-trusted-release-worker.mjs validate \
            --artifact-root "$EDGE_ARTIFACT_ROOT" \
            --trusted-source-root gate \
            --profile manifest-cron
          umask 077
          secrets_file="$RUNNER_TEMP/public-discovery-manifest-cron-secrets.json"
          trap 'rm -f "$secrets_file"' EXIT
          jq -n \
            --arg production "$DISCOVERY_MANIFEST_REFRESH_SECRET" \
            --arg nonprod "$DISCOVERY_MANIFEST_REFRESH_SECRET_NONPROD" \
            '{DISCOVERY_MANIFEST_REFRESH_SECRET:$production,
              DISCOVERY_MANIFEST_REFRESH_SECRET_NONPROD:$nonprod}' > "$secrets_file"
          if ! jq -e \
            '.DISCOVERY_MANIFEST_REFRESH_SECRET != .DISCOVERY_MANIFEST_REFRESH_SECRET_NONPROD and
             (.DISCOVERY_MANIFEST_REFRESH_SECRET | length) >= 32 and
             (.DISCOVERY_MANIFEST_REFRESH_SECRET_NONPROD | length) >= 32' \
            "$secrets_file" >/dev/null || \
            [ "$DISCOVERY_MANIFEST_REFRESH_SECRET" = "$INTERNAL_API_SECRET" ] || \
            [ "$DISCOVERY_MANIFEST_REFRESH_SECRET_NONPROD" = "$INTERNAL_API_SECRET" ] || \
            [ "$DISCOVERY_MANIFEST_REFRESH_SECRET" = "$PAGES_ORIGIN_ACCESS_TOKEN" ] || \
            [ "$DISCOVERY_MANIFEST_REFRESH_SECRET_NONPROD" = "$PAGES_ORIGIN_ACCESS_TOKEN" ]; then
            echo "::error::Manifest cron capabilities are absent, reused, or not realm-isolated."
            exit 1
          fi
          : > "$RUNNER_TEMP/manifest-cron-deploy-attempted"
          gate/.github/release-gate/node_modules/.bin/wrangler deploy \
            "$EDGE_ARTIFACT_ROOT/manifest-cron/index.js" \
            --no-bundle \
            --config gate/wrangler.public-discovery-manifest.toml \
            --secrets-file "$secrets_file" \
            --tag "$DEPLOY_SHA" \
            --message "Exact-SHA two-realm public-discovery cron transaction ${RELEASE_TRANSACTION_ID} before Q"
          rm -f "$secrets_file"
          trap - EXIT
          deployment="$RUNNER_TEMP/manifest-cron-current-deployment.json"
          version="$RUNNER_TEMP/manifest-cron-current-version.json"
          gate/.github/release-gate/node_modules/.bin/wrangler deployments status \
            --name commons-public-discovery-manifest-cron --json > "$deployment"
          version_id=$(jq -er \
            '.versions | select(length == 1) | .[0] | select(.percentage == 100) |
             .version_id | select(test("^([a-f0-9]{32}|[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12})$"))' \
            "$deployment")
          gate/.github/release-gate/node_modules/.bin/wrangler versions view "$version_id" \
            --name commons-public-discovery-manifest-cron --json > "$version"
          jq -e --arg sha "$DEPLOY_SHA" '.annotations["workers/tag"] == $sha' "$version" >/dev/null
          node gate/scripts/verify-public-discovery-cron-deployment.mjs
          printf '%s\n' "$version_id" > "$RUNNER_TEMP/manifest-cron-deployed-version-id"

      - name: Prove trusted production controls and qualify authority
        id: qualify_production_authority
        timeout-minutes: 45
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.PROTECTED_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: '019d1184e655db74b7589794a2a2a533'
          RELEASE_CONTROL_SECRET: ${{ secrets.PROTECTED_RELEASE_CONTROL_SECRET_PRODUCTION }}
          PREVIEW_RELEASE_CONTROL_SECRET: ${{ secrets.PROTECTED_RELEASE_CONTROL_SECRET_PREVIEW }}
          QUEUE_FREE_ATTESTATION_B64: ${{ secrets.PROTECTED_CLOUDFLARE_QUEUE_FREE_ACTIVATE_PRODUCTION_ATTESTATION_B64 }}
          QUEUE_FREE_SIGNATURE_B64: ${{ secrets.PROTECTED_CLOUDFLARE_QUEUE_FREE_ACTIVATE_PRODUCTION_SIGNATURE_B64 }}
        run: |
          set -euo pipefail
          if [ -z "${RELEASE_CONTROL_SECRET:-}" ] || \
            [ -z "${PREVIEW_RELEASE_CONTROL_SECRET:-}" ] || \
            [ "$RELEASE_CONTROL_SECRET" = "$PREVIEW_RELEASE_CONTROL_SECRET" ]; then
            echo "::error::Release control capabilities are absent, reused across realms, or reused by candidate probes."
            exit 1
          fi
          unset PREVIEW_RELEASE_CONTROL_SECRET
          journal="$RUNNER_TEMP/production-release-journal/public-template-og-production-release-journal.json"
          release_lease_id=$(jq -er '.releaseAuthority.leaseId' "$journal")
          receipt_deadline=$(jq -er '.receipt.verificationDeadlineAt' "$journal")
          test "$release_lease_id" = "${{ needs.activate-production.outputs.release_lease_id }}"
          test "$receipt_deadline" = "${{ needs.activate-production.outputs.receipt_verification_deadline }}"
          test -n "$QUALIFIED_PREVIEW_PAGES_DEPLOYMENT_ID"
          test -n "$QUALIFIED_PREVIEW_OG_VERSION_ID"
          test "$QUALIFIED_PREVIEW_PROOF" = "candidate-fetch-completed"
          umask 077
          attestation="$RUNNER_TEMP/cloudflare-queue-production-qualification.json"
          signature="$RUNNER_TEMP/cloudflare-queue-production-qualification.sig"
          printf '%s' "$QUEUE_FREE_ATTESTATION_B64" | base64 --decode > "$attestation"
          printf '%s' "$QUEUE_FREE_SIGNATURE_B64" | base64 --decode > "$signature"
          pages=$(node gate/scripts/cloudflare-pages-production-control.mjs capture)
          test "$(printf '%s' "$pages" | jq -er '.deploymentId')" = "$PRODUCTION_PAGES_DEPLOYMENT_ID"
          test "$(printf '%s' "$pages" | jq -er '.releaseSha')" = "$DEPLOY_SHA"
          node gate/scripts/verify-pages-durable-object-binding.mjs --environment production
          status_file="$RUNNER_TEMP/public-template-og-production-qualified-deployment.json"
          version_file="$RUNNER_TEMP/public-template-og-production-qualified-version.json"
          gate/.github/release-gate/node_modules/.bin/wrangler deployments status \
            --name commons-public-template-og --json > "$status_file"
          live_version=$(jq -er \
            '.versions | select(length == 1) | .[0] | select(.percentage == 100) | .version_id' \
            "$status_file")
          test "$live_version" = "$PRODUCTION_OG_VERSION_ID"
          gate/.github/release-gate/node_modules/.bin/wrangler versions view "$live_version" \
            --name commons-public-template-og --json > "$version_file"
          node gate/scripts/verify-public-template-og-deployment.mjs \
            --environment production \
            --config gate/wrangler.public-template-og.toml \
            --expected-source-sha "$DEPLOY_SHA" \
            --expected-transaction-id "$RELEASE_TRANSACTION_ID" \
            --deployment-status "$status_file" \
            --active-version "$version_file" \
            --producer-posture bound \
            --delivery-posture active
          qualified=$(node gate/scripts/qualify-public-discovery-generation.mjs qualify-production-authority \
            --environment production \
            --source-sha "$DEPLOY_SHA" \
            --transaction-id "$RELEASE_TRANSACTION_ID" \
            --release-lease-id "$release_lease_id" \
            --receipt-verification-deadline "$receipt_deadline" \
            --attestation "$attestation" \
            --signature "$signature" \
            --allowed-signers gate/.github/cloudflare-queue-allowed-signers)
          printf '%s' "$qualified" | jq -e --arg sha "$DEPLOY_SHA" --arg transaction "$RELEASE_TRANSACTION_ID" \
            '.environment == "production" and .releaseSha == $sha and .transactionId == $transaction and
             .candidateRuntimeInitialized == false and .trustedProductionProofs == true and
             .releaseAuthorityQualified == true and
             .receiptVerificationDeadlineAt == "${{ needs.activate-production.outputs.receipt_verification_deadline }}"' >/dev/null

      - name: Deploy and prove the exact trusted production edge
        id: deploy_production_edge
        timeout-minutes: 10
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.PROTECTED_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: '019d1184e655db74b7589794a2a2a533'
          CLOUDFLARE_ZONE_ID: ${{ secrets.PROTECTED_CLOUDFLARE_ZONE_ID }}
          PAGES_ORIGIN_ACCESS_TOKEN: ${{ secrets.PROTECTED_PAGES_ORIGIN_ACCESS_TOKEN_PRODUCTION }}
          PAGES_ORIGIN_ACCESS_SERVICE_TOKEN_ID_PRODUCTION: ${{ secrets.PROTECTED_PAGES_ORIGIN_ACCESS_SERVICE_TOKEN_ID_PRODUCTION }}
          RELEASE_ORIGIN_PROOF_SECRET: ${{ secrets.PROTECTED_RELEASE_ORIGIN_PROOF_SECRET_PRODUCTION }}
          PUBLIC_RELEASE_TRANSACTION_ID: ${{ env.RELEASE_TRANSACTION_ID }}
        run: |
          set -euo pipefail
          worker=commons-trusted-pages-edge
          capture="$RUNNER_TEMP/trusted-pages-edge-production-before.json"
          settings_body="$RUNNER_TEMP/trusted-pages-edge-production-settings.json"
          settings_status=$(curl -sS --max-time 30 -o "$settings_body" -w '%{http_code}' \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${worker}/settings")
          case "$settings_status" in
            200)
              previous_status="$RUNNER_TEMP/trusted-pages-edge-production-previous-deployment.json"
              gate/.github/release-gate/node_modules/.bin/wrangler deployments status \
                --name "$worker" --json > "$previous_status"
              previous_version_id=$(jq -er \
                '.versions | select(length == 1) | .[0] | select(.percentage == 100) | .version_id' \
                "$previous_status")
              if ! [[ "$previous_version_id" =~ ^([a-f0-9]{32}|[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12})$ ]]; then
                echo "::error::The prior production edge version is invalid."
                exit 1
              fi
              previous_version="$RUNNER_TEMP/trusted-pages-edge-production-previous-version.json"
              gate/.github/release-gate/node_modules/.bin/wrangler versions view "$previous_version_id" \
                --name "$worker" --json > "$previous_version"
              previous_release_sha=$(jq -er '.annotations["workers/tag"] | select(test("^[a-f0-9]{40}$"))' \
                "$previous_version")
              previous_release_transaction=$(jq -er \
                '.result.bindings // .bindings |
                 map(select(.name == "PUBLIC_RELEASE_TRANSACTION_ID" and .type == "plain_text")) |
                 select(length == 1) | .[0].text |
                 select(test("^[1-9][0-9]{0,19}-[1-9][0-9]{0,9}$"))' \
                "$settings_body")
              jq -n \
                --arg version "$previous_version_id" \
                --arg sha "$previous_release_sha" \
                --arg transaction "$previous_release_transaction" \
                '{state:"present",versionId:$version,releaseSha:$sha,releaseTransaction:$transaction}' \
                > "$capture"
              ;;
            404)
              jq -n '{state:"absent"}' > "$capture"
              ;;
            *)
              echo "::error::Could not capture the prior trusted production edge (HTTP ${settings_status})."
              exit 1
              ;;
          esac
          chmod 600 "$capture"
          journal="$RUNNER_TEMP/production-release-journal/public-template-og-production-release-journal.json"
          jq -e --slurpfile live "$capture" \
            '.coordinationCapture.trustedEdge == $live[0]' "$journal" >/dev/null
          prior_state=$(jq -er '.state' "$capture")
          prior_routes="$RUNNER_TEMP/trusted-pages-edge-production-routes-before.json"
          curl -fsS --max-time 30 \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/workers/routes" \
            > "$prior_routes"
          node gate/scripts/verify-trusted-pages-release-edge.mjs verify-route-inventory \
            --environment production \
            --expected "$prior_state" \
            < "$prior_routes" >/dev/null
          if ! printf '%s' "$PAGES_ORIGIN_ACCESS_TOKEN" | jq -e \
            'type == "object" and (keys | sort) == ["cf-access-client-id","cf-access-client-secret"] and
             (."cf-access-client-id" | type == "string" and test("^[A-Za-z0-9._-]{16,256}$")) and
             (."cf-access-client-secret" | type == "string" and test("^[A-Za-z0-9._-]{32,512}$"))' \
            >/dev/null || \
            ! [[ "$PAGES_ORIGIN_ACCESS_SERVICE_TOKEN_ID_PRODUCTION" =~ ^[a-f0-9]{32}$ ]]; then
            echo "::error::The production origin Access capability is malformed."
            exit 1
          fi
          node --input-type=module <<'NODE'
          const proof = process.env.RELEASE_ORIGIN_PROOF_SECRET ?? '';
          const accessText = process.env.PAGES_ORIGIN_ACCESS_TOKEN ?? '';
          const access = JSON.parse(accessText);
          const bytes = Buffer.byteLength(proof, 'utf8');
          if (
            bytes < 32 ||
            bytes > 512 ||
            !/^[\u0021-\u007e]+$/u.test(proof) ||
            [
              accessText,
              access['cf-access-client-id'],
              access['cf-access-client-secret'],
              process.env.PAGES_ORIGIN_ACCESS_SERVICE_TOKEN_ID_PRODUCTION,
              process.env.CLOUDFLARE_API_TOKEN
            ].includes(proof)
          ) {
            throw new Error('The production release-origin proof capability is malformed or reused.');
          }
          NODE

          node gate/scripts/finalize-trusted-release-worker.mjs validate \
            --artifact-root "$EDGE_ARTIFACT_ROOT" \
            --trusted-source-root gate \
            --profile trusted-pages-edge
          umask 077
          secrets_file="$RUNNER_TEMP/trusted-pages-edge-production-secrets.json"
          trap 'rm -f "$secrets_file"' EXIT
          jq -n \
            --arg access "$PAGES_ORIGIN_ACCESS_TOKEN" \
            --arg proof "$RELEASE_ORIGIN_PROOF_SECRET" \
            '{PAGES_ORIGIN_ACCESS_TOKEN:$access,RELEASE_ORIGIN_PROOF_SECRET:$proof}' \
            > "$secrets_file"
          : > "$RUNNER_TEMP/trusted-pages-edge-production-deploy-attempted"
          gate/.github/release-gate/node_modules/.bin/wrangler deploy \
            "$EDGE_ARTIFACT_ROOT/trusted-pages-edge/index.js" \
            --no-bundle \
            --config gate/wrangler.trusted-pages-release-edge.toml \
            --var "PUBLIC_RELEASE_TRANSACTION_ID:${RELEASE_TRANSACTION_ID}" \
            --secrets-file "$secrets_file" \
            --tag "$DEPLOY_SHA" \
            --message "Exact-SHA trusted production Pages edge transaction ${RELEASE_TRANSACTION_ID}"
          rm -f "$secrets_file"
          trap - EXIT

          current_status="$RUNNER_TEMP/trusted-pages-edge-production-current-deployment.json"
          current_version="$RUNNER_TEMP/trusted-pages-edge-production-current-version.json"
          gate/.github/release-gate/node_modules/.bin/wrangler deployments status \
            --name "$worker" --json > "$current_status"
          current_version_id=$(jq -er \
            '.versions | select(length == 1) | .[0] | select(.percentage == 100) | .version_id' \
            "$current_status")
          gate/.github/release-gate/node_modules/.bin/wrangler versions view "$current_version_id" \
            --name "$worker" --json > "$current_version"
          jq -e --arg sha "$DEPLOY_SHA" '.annotations["workers/tag"] == $sha' \
            "$current_version" >/dev/null
          node gate/scripts/verify-trusted-pages-release-edge.mjs --environment production >/dev/null
          jq -n \
            --arg version "$current_version_id" \
            --arg sha "$DEPLOY_SHA" \
            --arg transaction "$RELEASE_TRANSACTION_ID" \
            '{versionId:$version,releaseSha:$sha,releaseTransaction:$transaction}' \
            > "$RUNNER_TEMP/trusted-pages-edge-production-deployed.json"
          chmod 600 "$RUNNER_TEMP/trusted-pages-edge-production-deployed.json"

      - name: Commit production authority as the terminal authority mutation
        id: commit_production_authority
        timeout-minutes: 10
        env:
          RELEASE_CONTROL_SECRET: ${{ secrets.PROTECTED_RELEASE_CONTROL_SECRET_PRODUCTION }}
        run: |
          set -euo pipefail
          test -f "$RUNNER_TEMP/trusted-pages-edge-production-deploy-attempted"
          journal="$RUNNER_TEMP/production-release-journal/public-template-og-production-release-journal.json"
          release_lease_id=$(jq -er '.releaseAuthority.leaseId' "$journal")
          receipt_deadline=$(jq -er '.receipt.verificationDeadlineAt' "$journal")
          test "$release_lease_id" = "${{ needs.activate-production.outputs.release_lease_id }}"
          test "$receipt_deadline" = "${{ needs.activate-production.outputs.receipt_verification_deadline }}"
          attestation="$RUNNER_TEMP/cloudflare-queue-production-qualification.json"
          signature="$RUNNER_TEMP/cloudflare-queue-production-qualification.sig"
          test -s "$attestation"
          test -s "$signature"
          node gate/scripts/qualify-public-discovery-generation.mjs finalize \
            --environment production \
            --source-sha "$DEPLOY_SHA" \
            --transaction-id "$RELEASE_TRANSACTION_ID" \
            --release-lease-id "$release_lease_id" \
            --receipt-verification-deadline "$receipt_deadline" \
            --attestation "$attestation" \
            --signature "$signature" \
            --allowed-signers gate/.github/cloudflare-queue-allowed-signers >/dev/null

      # C makes the exact P/Q/T tuple public, but topology and denial-matrix
      # checks alone cannot prove the complete T -> Access -> late-transform ->
      # adapter -> candidate chain. This is the sole post-C success proof. It
      # carries only a dedicated purpose capability, which T consumes and
      # strips before Access/origin forwarding; the path is never admitted to
      # T's landing-page Cache API.
      - name: Prove the exact committed production origin chain
        id: prove_production_origin
        timeout-minutes: 2
        env:
          RELEASE_ORIGIN_PROOF_SECRET: ${{ secrets.PROTECTED_RELEASE_ORIGIN_PROOF_SECRET_PRODUCTION }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const secret = process.env.RELEASE_ORIGIN_PROOF_SECRET ?? '';
          const bytes = Buffer.byteLength(secret, 'utf8');
          if (bytes < 32 || bytes > 512 || !/^[\u0021-\u007e]+$/u.test(secret)) {
            throw new Error('The production release-origin proof capability is malformed.');
          }
          NODE
          headers="$RUNNER_TEMP/production-release-origin-proof.headers"
          body="$RUNNER_TEMP/production-release-origin-proof.json"
          status=$(curl -sS --max-time 30 \
            --proto '=https' \
            --tlsv1.2 \
            --request GET \
            --header 'Accept: application/json' \
            --header 'x-commons-release-origin-purpose: post-commit-v1' \
            --header "x-commons-release-origin-proof-secret: ${RELEASE_ORIGIN_PROOF_SECRET}" \
            --dump-header "$headers" \
            --output "$body" \
            --write-out '%{http_code}' \
            'https://commons.email/api/release-origin')
          node gate/scripts/verify-trusted-pages-release-origin-response.mjs \
            --component pages \
            --headers "$headers" \
            --body "$body" \
            --status "$status" \
            --release-sha "$DEPLOY_SHA" \
            --transaction-id "$RELEASE_TRANSACTION_ID" \
            >/dev/null

      - name: Prove committed production liveness and authenticated readiness
        id: prove_production_readiness
        timeout-minutes: 3
        env:
          INTERNAL_API_SECRET: ${{ secrets.PROTECTED_INTERNAL_API_SECRET_PRODUCTION }}
        run: |
          set -euo pipefail
          if [ -z "${INTERNAL_API_SECRET:-}" ]; then
            echo "::error::The protected production readiness capability is absent."
            exit 1
          fi
          live=false
          for attempt in {1..12}; do
            if response=$(curl -sS --max-time 20 -w "\n%{http_code}" \
              --proto '=https' \
              --tlsv1.2 \
              --request GET \
              'https://commons.email/api/live'); then
              http_status=$(printf '%s\n' "$response" | tail -n 1)
              body=$(printf '%s\n' "$response" | sed '$d')
              if [ "$http_status" = "200" ] && printf '%s' "$body" | jq -e \
                --arg sha "$DEPLOY_SHA" \
                --arg transaction "$RELEASE_TRANSACTION_ID" \
                '.status == "ok" and .boundary == "separate-access-pages-origin" and
                 .release.sha == $sha and .release.transactionId == $transaction' >/dev/null; then
                live=true
                break
              fi
            fi
            if [ "$attempt" = "12" ]; then
              echo "::error::The terminal production edge did not converge on exact-tuple liveness."
              exit 1
            fi
            sleep 5
          done
          test "$live" = "true"

          if ! response=$(curl -sS --max-time 20 -w "\n%{http_code}" \
            --proto '=https' \
            --tlsv1.2 \
            --request GET \
            -H "X-Internal-Secret: ${INTERNAL_API_SECRET}" \
            'https://commons.email/api/health'); then
            echo "::error::The one budgeted production readiness probe failed before an HTTP response."
            exit 1
          fi
          http_status=$(printf '%s\n' "$response" | tail -n 1)
          body=$(printf '%s\n' "$response" | sed '$d')
          if [ "$http_status" != "200" ] || ! printf '%s' "$body" | jq -e \
            --arg sha "$DEPLOY_SHA" \
            --arg transaction "$RELEASE_TRANSACTION_ID" \
            '.status == "ok" and .convex == true and .convexRealm == "production" and
             .release.status == "ok" and .release.sha == $sha and
             .release.transactionId == $transaction and
             .publicDiscoveryCache.status == "ok" and
             .publicDiscoveryCache.r2Bound == true and
             .publicDiscoveryCache.refreshGateBound == true and
             .publicDiscoveryCache.workBudgetBound == true and
             .publicDiscoveryCache.publication.healthy == true and
             .sessionCookieAuthority.status == "ok" and
             .sessionCookieAuthority.keysIsolated == true' >/dev/null; then
            echo "::error::The one budgeted production readiness probe did not prove the exact committed release."
            printf '%s\n' "$body" | head -c 4000
            exit 1
          fi

      # This bounded, capability-free exact-root sequence runs from one runner.
      # A miss or stale response may converge, but only an edge-owned fresh hit
      # with the complete outward cache policy proves the successful release.
      - name: Prove committed anonymous landing cache reaches a trusted hit
        id: prove_production_landing_cache
        timeout-minutes: 2
        run: |
          set -euo pipefail
          result=$(node gate/scripts/prove-public-discovery-edge-cache.mjs)
          printf '%s' "$result" | jq -e \
            '.url == "https://commons.email/" and
             .proof == "trusted-public-discovery-cache-hit" and
             .cacheStatus == "hit" and
             (.attempts | type == "number" and . >= 1 and . <= 12) and
             (.age | type == "number" and . >= 0 and . <= 59) and
             (keys | sort) == ["age", "attempts", "cacheStatus", "proof", "url"]' >/dev/null

      # Prune every undeclared exposure, but retain the exact journal baseline
      # as a rollback reserve until all always-run recovery branches have made
      # their final decision. Terminal cleanup below is the only phase allowed
      # to retire that reserve.
      - name: Reconcile successful normal Pages exposure
        id: reconcile_production_exposure
        if: success()
        timeout-minutes: 15
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.PROTECTED_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: '019d1184e655db74b7589794a2a2a533'
          CF_PAGES_PROJECT: communique-site
          CF_PAGES_ALLOWED_ALIAS_BRANCHES: production
        run: |
          set -euo pipefail
          journal="$RUNNER_TEMP/production-release-journal/public-template-og-production-release-journal.json"
          baseline_deployment_id=$(jq -er \
            '.pagesCapture.deploymentId | select(test("^[0-9a-f-]{32,36}$"))' \
            "$journal")
          reconciliation=$(node gate/scripts/reconcile-cloudflare-pages-exposure.mjs \
            --prune \
            --expected-production-sha "$DEPLOY_SHA" \
            --preserve-deployment-id "$baseline_deployment_id")
          printf '%s\n' "$reconciliation"
          if ! grep -q 'stale=0;' <<<"$reconciliation" || \
            ! grep -q 'preserved=1;' <<<"$reconciliation"; then
            echo "::error::Normal production reconciliation did not retain exactly its rollback reserve."
            exit 1
          fi

      - name: Recover an interrupted authority handoff
        if: always() && (failure() || cancelled())
        timeout-minutes: 8
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.PROTECTED_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: '019d1184e655db74b7589794a2a2a533'
          RELEASE_CONTROL_SECRET: ${{ secrets.PROTECTED_RELEASE_CONTROL_SECRET_PRODUCTION }}
        run: |
          journal="$RUNNER_TEMP/production-release-journal/public-template-og-production-release-journal.json"
          recovery_result="$RUNNER_TEMP/public-template-og-production-qualification-recovery.json"
          node gate/scripts/run-public-template-og-release-phase.mjs recover \
            --journal "$journal" \
            --trusted-root gate \
            --wrangler gate/.github/release-gate/node_modules/.bin/wrangler \
            --realm production \
            --source-sha "$DEPLOY_SHA" \
            --trusted-gate-sha "$TRUSTED_GATE_SHA" \
            --artifact-digest "$ARTIFACT_DIGEST" \
            --release-kit-digest "${{ needs.prepare-queue-release-kit.outputs.kit_digest }}" \
            --repository "$GITHUB_REPOSITORY" \
            --repository-id "$GITHUB_REPOSITORY_ID" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --transaction-id "$RELEASE_TRANSACTION_ID" \
            --force true > "$recovery_result"
          jq -e \
            --arg sha "$DEPLOY_SHA" \
            --arg transaction "$RELEASE_TRANSACTION_ID" \
            '.sourceSha == $sha and .transactionId == $transaction and
             ((.recovered == true and .reason == "recovered") or
              (.recovered == false and (.reason == "committed-terminal" or .reason == "superseded")))' \
            "$recovery_result" >/dev/null

      - name: Restore the prior trusted production edge after recovered handoff failure
        if: always() && (failure() || cancelled())
        timeout-minutes: 5
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.PROTECTED_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: '019d1184e655db74b7589794a2a2a533'
          CLOUDFLARE_ZONE_ID: ${{ secrets.PROTECTED_CLOUDFLARE_ZONE_ID }}
        run: |
          set -euo pipefail
          worker=commons-trusted-pages-edge
          capture="$RUNNER_TEMP/trusted-pages-edge-production-before.json"
          attempted="$RUNNER_TEMP/trusted-pages-edge-production-deploy-attempted"
          if [ ! -f "$attempted" ]; then
            exit 0
          fi
          recovery_result="$RUNNER_TEMP/public-template-og-production-qualification-recovery.json"
          if [ ! -s "$recovery_result" ] || \
            ! jq -e '.recovered == true and .reason == "recovered"' "$recovery_result" >/dev/null; then
            echo "::warning::Production C is committed/superseded or recovery is unproven; preserving the current edge."
            exit 0
          fi
          test -s "$capture"
          state=$(jq -er '.state | select(. == "present" or . == "absent")' "$capture")
          if [ "$state" = "present" ]; then
            previous_version_id=$(jq -er '.versionId' "$capture")
            if ! [[ "$previous_version_id" =~ ^([a-f0-9]{32}|[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12})$ ]]; then
              echo "::error::The captured production edge rollback version is invalid."
              exit 1
            fi
            current=$(gate/.github/release-gate/node_modules/.bin/wrangler deployments status \
              --name "$worker" --json)
            current_version_id=$(printf '%s' "$current" | jq -er \
              '.versions | select(length == 1) | .[0] | select(.percentage == 100) | .version_id')
            if [ "$current_version_id" != "$previous_version_id" ]; then
              gate/.github/release-gate/node_modules/.bin/wrangler rollback "$previous_version_id" \
                --name "$worker" \
                --message "Restore production Pages edge after failed ${DEPLOY_SHA} handoff" \
                --yes
            fi
            restored=$(gate/.github/release-gate/node_modules/.bin/wrangler deployments status \
              --name "$worker" --json)
            printf '%s' "$restored" | jq -e --arg version "$previous_version_id" \
              '.versions | length == 1 and .[0].percentage == 100 and .[0].version_id == $version' \
              >/dev/null
          else
            settings_body="$RUNNER_TEMP/trusted-pages-edge-production-recovery-settings.json"
            settings_status=$(curl -sS --max-time 30 -o "$settings_body" -w '%{http_code}' \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${worker}/settings")
            if [ "$settings_status" = "200" ]; then
              gate/.github/release-gate/node_modules/.bin/wrangler delete "$worker" --force
            elif [ "$settings_status" != "404" ]; then
              echo "::error::Could not inspect the newly created production edge during recovery."
              exit 1
            fi
            settings_status=$(curl -sS --max-time 30 -o "$settings_body" -w '%{http_code}' \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${worker}/settings")
            test "$settings_status" = "404"
          fi
          routes_file="$RUNNER_TEMP/trusted-pages-edge-production-routes-restored.json"
          curl -fsS --max-time 30 \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/workers/routes" \
            > "$routes_file"
          node gate/scripts/verify-trusted-pages-release-edge.mjs verify-route-inventory \
            --environment production \
            --expected "$state" \
            < "$routes_file" >/dev/null

      # A failed or response-lost C cannot be undone. If the origin-chain proof
      # did not succeed, the only admissible recovery is the exact retained
      # Pages/T pair whose old C remains in the bounded terminal ledger. Pages
      # is restored first; until T follows, the tuple mismatch fails closed.
      - name: Restore retained production Pages and edge as one pair after unproved C
        id: restore_production_pair_after_origin_failure
        if: always() && (failure() || cancelled())
        timeout-minutes: 10
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.PROTECTED_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: '019d1184e655db74b7589794a2a2a533'
          CLOUDFLARE_ZONE_ID: ${{ secrets.PROTECTED_CLOUDFLARE_ZONE_ID }}
          CF_PAGES_PROJECT: communique-site
          INTERNAL_API_SECRET: ${{ secrets.PROTECTED_INTERNAL_API_SECRET_PRODUCTION }}
          RELEASE_ORIGIN_PROOF_SECRET: ${{ secrets.PROTECTED_RELEASE_ORIGIN_PROOF_SECRET_PRODUCTION }}
          ORIGIN_PROOF_OUTCOME: ${{ steps.prove_production_origin.outcome }}
          READINESS_PROOF_OUTCOME: ${{ steps.prove_production_readiness.outcome }}
          CACHE_PROOF_OUTCOME: ${{ steps.prove_production_landing_cache.outcome }}
        run: |
          set -euo pipefail
          if [ "$ORIGIN_PROOF_OUTCOME" = "success" ] && \
            [ "$READINESS_PROOF_OUTCOME" = "success" ] && \
            [ "$CACHE_PROOF_OUTCOME" = "success" ]; then
            exit 0
          fi
          node --input-type=module <<'NODE'
          const proof = process.env.RELEASE_ORIGIN_PROOF_SECRET ?? '';
          const bytes = Buffer.byteLength(proof, 'utf8');
          if (
            bytes < 32 ||
            bytes > 512 ||
            !/^[\u0021-\u007e]+$/u.test(proof) ||
            [process.env.INTERNAL_API_SECRET, process.env.CLOUDFLARE_API_TOKEN].includes(proof)
          ) {
            throw new Error('The retained-pair release-origin proof capability is malformed or reused.');
          }
          NODE
          recovery_result="$RUNNER_TEMP/public-template-og-production-qualification-recovery.json"
          if [ ! -s "$recovery_result" ] || \
            ! jq -e --arg sha "$DEPLOY_SHA" --arg transaction "$RELEASE_TRANSACTION_ID" \
              '.sourceSha == $sha and .transactionId == $transaction and
               .recovered == false and .reason == "committed-terminal"' \
              "$recovery_result" >/dev/null; then
            echo "::warning::Terminal C is not exactly proven; preserving current Pages and edge state."
            exit 0
          fi

          worker=commons-trusted-pages-edge
          capture="$RUNNER_TEMP/trusted-pages-edge-production-before.json"
          deployed="$RUNNER_TEMP/trusted-pages-edge-production-deployed.json"
          journal="$RUNNER_TEMP/production-release-journal/public-template-og-production-release-journal.json"
          test -s "$capture"
          test -s "$deployed"
          test -s "$journal"
          state=$(jq -er '.state | select(. == "present" or . == "absent")' "$capture")
          if [ "$state" != "present" ]; then
            echo "::error::C is terminal and its origin proof failed, but no retained Pages/T pair exists. Preserving the current edge so the candidate origin is never exposed directly."
            exit 1
          fi

          previous_version_id=$(jq -er \
            '.versionId | select(test("^([a-f0-9]{32}|[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12})$"))' \
            "$capture")
          previous_release_sha=$(jq -er '.releaseSha | select(test("^[a-f0-9]{40}$"))' "$capture")
          previous_transaction=$(jq -er \
            '.releaseTransaction | select(test("^[1-9][0-9]{0,19}-[1-9][0-9]{0,9}$"))' \
            "$capture")
          deployed_version_id=$(jq -er \
            '.versionId | select(test("^([a-f0-9]{32}|[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12})$"))' \
            "$deployed")
          test "$(jq -er '.releaseSha' "$deployed")" = "$DEPLOY_SHA"
          test "$(jq -er '.releaseTransaction' "$deployed")" = "$RELEASE_TRANSACTION_ID"
          test "$previous_version_id" != "$deployed_version_id"

          baseline_pages_id=$(jq -er \
            '.pagesCapture.deploymentId | select(test("^[0-9a-f-]{32,36}$"))' "$journal")
          baseline_pages_sha=$(jq -er \
            '.pagesCapture.releaseSha | select(test("^[a-f0-9]{40}$"))' "$journal")
          baseline_transaction=$(jq -er \
            '.pagesCapture.releaseTransaction | select(test("^[1-9][0-9]{0,19}-[1-9][0-9]{0,9}$"))' \
            "$journal")
          baseline_gate_sha=$(jq -er \
            '.pagesCapture.trustedGateSha | select(test("^[a-f0-9]{40}$"))' "$journal")
          baseline_artifact_digest=$(jq -er \
            '.pagesCapture.artifactDigest | select(test("^[a-f0-9]{64}$"))' "$journal")
          baseline_component=$(jq -er \
            '.pagesCapture.releaseComponent | select(. == "pages" or . == "pages-containment")' \
            "$journal")
          if [ "$baseline_component" = "pages" ]; then
            jq -e '.pagesCapture.releaseRealm == null' "$journal" >/dev/null
          else
            jq -e '.pagesCapture.releaseRealm == "production"' "$journal" >/dev/null
          fi
          test "$previous_release_sha" = "$baseline_pages_sha"
          test "$previous_transaction" = "$baseline_transaction"
          test "$baseline_transaction" != "$RELEASE_TRANSACTION_ID"
          test "$baseline_pages_id" != "$PRODUCTION_PAGES_DEPLOYMENT_ID"

          # Before mutating either side, prove T is still the exact version this
          # transaction deployed and its route/binding tuple was not superseded.
          current_status="$RUNNER_TEMP/trusted-pages-edge-production-pair-current.json"
          gate/.github/release-gate/node_modules/.bin/wrangler deployments status \
            --name "$worker" --json > "$current_status"
          current_version_id=$(jq -er \
            '.versions | select(length == 1) | .[0] | select(.percentage == 100) | .version_id' \
            "$current_status")
          test "$current_version_id" = "$deployed_version_id"
          current_version="$RUNNER_TEMP/trusted-pages-edge-production-pair-current-version.json"
          gate/.github/release-gate/node_modules/.bin/wrangler versions view "$current_version_id" \
            --name "$worker" --json > "$current_version"
          jq -e --arg sha "$DEPLOY_SHA" '.annotations["workers/tag"] == $sha' \
            "$current_version" >/dev/null
          current_settings="$RUNNER_TEMP/trusted-pages-edge-production-pair-current-settings.json"
          curl -fsS --max-time 30 \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${worker}/settings" \
            > "$current_settings"
          jq -e --arg transaction "$RELEASE_TRANSACTION_ID" \
            '.result.bindings | map(select(.name == "PUBLIC_RELEASE_TRANSACTION_ID" and
             .type == "plain_text" and .text == $transaction)) | length == 1' \
            "$current_settings" >/dev/null
          current_routes="$RUNNER_TEMP/trusted-pages-edge-production-pair-current-routes.json"
          curl -fsS --max-time 30 \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/workers/routes" \
            > "$current_routes"
          node gate/scripts/verify-trusted-pages-release-edge.mjs verify-route-inventory \
            --environment production \
            --expected present \
            < "$current_routes" >/dev/null

          restored_pages=$(node gate/scripts/cloudflare-pages-production-control.mjs rollback \
            --deployment-id "$baseline_pages_id" \
            --expected-release-sha "$baseline_pages_sha" \
            --failed-release-sha "$DEPLOY_SHA" \
            --failed-transaction-id "$RELEASE_TRANSACTION_ID")
          printf '%s\n' "$restored_pages" > "$RUNNER_TEMP/production-pages-pair-restored.json"
          printf '%s' "$restored_pages" | jq -e \
            --arg id "$baseline_pages_id" \
            --arg sha "$baseline_pages_sha" \
            --arg transaction "$baseline_transaction" \
            --arg gate "$baseline_gate_sha" \
            --arg digest "$baseline_artifact_digest" \
            --arg component "$baseline_component" \
            '.deploymentId == $id and .releaseSha == $sha and .releaseTransaction == $transaction and
             .trustedGateSha == $gate and .artifactDigest == $digest and .releaseComponent == $component and
             (($component == "pages" and .releaseRealm == null) or
              ($component == "pages-containment" and .releaseRealm == "production"))' >/dev/null

          gate/.github/release-gate/node_modules/.bin/wrangler rollback "$previous_version_id" \
            --name "$worker" \
            --message "Restore retained Pages/T pair after unproved ${DEPLOY_SHA} C" \
            --yes
          restored_status="$RUNNER_TEMP/trusted-pages-edge-production-pair-restored.json"
          gate/.github/release-gate/node_modules/.bin/wrangler deployments status \
            --name "$worker" --json > "$restored_status"
          jq -e --arg version "$previous_version_id" \
            '.versions | length == 1 and .[0].percentage == 100 and .[0].version_id == $version' \
            "$restored_status" >/dev/null
          restored_version="$RUNNER_TEMP/trusted-pages-edge-production-pair-restored-version.json"
          gate/.github/release-gate/node_modules/.bin/wrangler versions view "$previous_version_id" \
            --name "$worker" --json > "$restored_version"
          jq -e --arg sha "$baseline_pages_sha" '.annotations["workers/tag"] == $sha' \
            "$restored_version" >/dev/null
          restored_settings="$RUNNER_TEMP/trusted-pages-edge-production-pair-restored-settings.json"
          curl -fsS --max-time 30 \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${worker}/settings" \
            > "$restored_settings"
          jq -e --arg transaction "$baseline_transaction" \
            '.result.bindings | map(select(.name == "PUBLIC_RELEASE_TRANSACTION_ID" and
             .type == "plain_text" and .text == $transaction)) | length == 1' \
            "$restored_settings" >/dev/null
          restored_routes="$RUNNER_TEMP/trusted-pages-edge-production-pair-restored-routes.json"
          curl -fsS --max-time 30 \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/workers/routes" \
            > "$restored_routes"
          node gate/scripts/verify-trusted-pages-release-edge.mjs verify-route-inventory \
            --environment production \
            --expected present \
            < "$restored_routes" >/dev/null

          # Purge is an optional acceleration only. Release-qualified cache
          # keys and their hard age ceiling make rollback independent of it.
          purge_response="$RUNNER_TEMP/production-restored-pair-purge.json"
          if purge_status=$(curl -sS --max-time 30 \
            --proto '=https' \
            --request POST \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H 'Content-Type: application/json' \
            --data '{"tags":["public-discovery"]}' \
            --output "$purge_response" \
            --write-out '%{http_code}' \
            "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/purge_cache"); then
            if [ "$purge_status" != "200" ] || \
              ! jq -e '.success == true and (.errors | type == "array" and length == 0)' \
                "$purge_response" >/dev/null; then
              echo "::warning::Optional restored-pair cache-tag purge was not accepted; continuing with release-qualified cache proof."
            fi
          else
            echo "::warning::Optional restored-pair cache-tag purge was unavailable; continuing with release-qualified cache proof."
          fi

          pair_headers="$RUNNER_TEMP/production-restored-pair-proof.headers"
          pair_body="$RUNNER_TEMP/production-restored-pair-proof.json"
          pair_status=$(curl -sS --max-time 30 \
            --proto '=https' \
            --tlsv1.2 \
            --request GET \
            --header 'Accept: application/json' \
            --header 'x-commons-release-origin-purpose: post-commit-v1' \
            --header "x-commons-release-origin-proof-secret: ${RELEASE_ORIGIN_PROOF_SECRET}" \
            --dump-header "$pair_headers" \
            --output "$pair_body" \
            --write-out '%{http_code}' \
            'https://commons.email/api/release-origin')
          node gate/scripts/verify-trusted-pages-release-origin-response.mjs \
            --component "$baseline_component" \
            --headers "$pair_headers" \
            --body "$pair_body" \
            --status "$pair_status" \
            --release-sha "$baseline_pages_sha" \
            --transaction-id "$baseline_transaction" \
            >/dev/null

          if [ "$baseline_component" = "pages" ]; then
            if [ -z "${INTERNAL_API_SECRET:-}" ]; then
              echo "::error::The retained normal pair cannot be readiness-proved without its protected capability."
              exit 1
            fi
            live_response=$(curl -sS --max-time 20 -w "\n%{http_code}" \
              --proto '=https' \
              --tlsv1.2 \
              --request GET \
              'https://commons.email/api/live')
            live_status=$(printf '%s\n' "$live_response" | tail -n 1)
            live_body=$(printf '%s\n' "$live_response" | sed '$d')
            if [ "$live_status" != "200" ] || ! printf '%s' "$live_body" | jq -e \
              --arg sha "$baseline_pages_sha" \
              --arg transaction "$baseline_transaction" \
              '.status == "ok" and .boundary == "separate-access-pages-origin" and
               .release.sha == $sha and .release.transactionId == $transaction' >/dev/null; then
              echo "::error::The retained production pair did not expose exact-tuple liveness."
              exit 1
            fi
            health_response=$(curl -sS --max-time 20 -w "\n%{http_code}" \
              --proto '=https' \
              --tlsv1.2 \
              --request GET \
              -H "X-Internal-Secret: ${INTERNAL_API_SECRET}" \
              'https://commons.email/api/health')
            health_status=$(printf '%s\n' "$health_response" | tail -n 1)
            health_body=$(printf '%s\n' "$health_response" | sed '$d')
            if [ "$health_status" != "200" ] || ! printf '%s' "$health_body" | jq -e \
              --arg sha "$baseline_pages_sha" \
              --arg transaction "$baseline_transaction" \
              '.status == "ok" and .convex == true and .convexRealm == "production" and
               .release.status == "ok" and .release.sha == $sha and
               .release.transactionId == $transaction and
               .publicDiscoveryCache.status == "ok" and
               .publicDiscoveryCache.r2Bound == true and
               .publicDiscoveryCache.refreshGateBound == true and
               .publicDiscoveryCache.workBudgetBound == true and
               .publicDiscoveryCache.publication.healthy == true and
               .sessionCookieAuthority.status == "ok" and
               .sessionCookieAuthority.keysIsolated == true' >/dev/null; then
              echo "::error::The second and final budgeted health call did not prove the retained production pair."
              printf '%s\n' "$health_body" | head -c 4000
              exit 1
            fi

            # The rollback purge must be followed by a new anonymous miss/stale
            # to hit sequence for the retained tuple. Strip every capability
            # carried by this recovery step before invoking the trusted proof.
            restored_cache=$(env \
              -u INTERNAL_API_SECRET \
              -u CLOUDFLARE_API_TOKEN \
              -u CLOUDFLARE_ACCOUNT_ID \
              -u CLOUDFLARE_ZONE_ID \
              node gate/scripts/prove-public-discovery-edge-cache.mjs)
            printf '%s' "$restored_cache" | jq -e \
              '.url == "https://commons.email/" and
               .proof == "trusted-public-discovery-cache-hit" and
               .cacheStatus == "hit" and
               (.attempts | type == "number" and . >= 1 and . <= 12) and
               (.age | type == "number" and . >= 0 and . <= 59) and
               (keys | sort) == ["age", "attempts", "cacheStatus", "proof", "url"]' >/dev/null
          fi

      # The manifest scheduler is part of the published Pages tuple. A failed
      # pre-C handoff restores its exact preflight version (or exact absence).
      # A terminal C retains this release's scheduler unless the retained
      # Pages/T pair was explicitly restored. Never overwrite a newer release.
      - name: Roll back manifest cron after downstream release failure
        id: rollback_manifest_cron
        if: >-
          always() &&
          (failure() || cancelled()) &&
          steps.manifest_cron_deploy.outcome != 'skipped'
        timeout-minutes: 6
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.PROTECTED_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: '019d1184e655db74b7589794a2a2a533'
          COMMIT_OUTCOME: ${{ steps.commit_production_authority.outcome }}
        run: |
          set -euo pipefail
          worker=commons-public-discovery-manifest-cron
          attempted="$RUNNER_TEMP/manifest-cron-deploy-attempted"
          [ -f "$attempted" ] || exit 0

          case "$MANIFEST_CRON_BASELINE_STATE" in
            absent)
              test -z "$MANIFEST_CRON_BASELINE_VERSION_ID"
              test -z "$MANIFEST_CRON_BASELINE_RELEASE_SHA"
              ;;
            present)
              [[ "$MANIFEST_CRON_BASELINE_VERSION_ID" =~ ^([a-f0-9]{32}|[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12})$ ]]
              [[ "$MANIFEST_CRON_BASELINE_RELEASE_SHA" =~ ^[a-f0-9]{40}$ ]]
              ;;
            *)
              echo "::error::Manifest cron rollback baseline is invalid."
              exit 1
              ;;
          esac

          settings="$RUNNER_TEMP/manifest-cron-recovery-settings.json"
          settings_status=$(curl -sS --max-time 30 -o "$settings" -w '%{http_code}' \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${worker}/settings")
          current_state=absent
          current_version_id=
          current_release_sha=
          current_release_message=
          if [ "$settings_status" = "200" ]; then
            current_state=present
            current_deployment="$RUNNER_TEMP/manifest-cron-recovery-deployment.json"
            current_version="$RUNNER_TEMP/manifest-cron-recovery-version.json"
            gate/.github/release-gate/node_modules/.bin/wrangler deployments status \
              --name "$worker" --json > "$current_deployment"
            current_version_id=$(jq -er \
              '.versions | select(length == 1) | .[0] | select(.percentage == 100) | .version_id' \
              "$current_deployment")
            gate/.github/release-gate/node_modules/.bin/wrangler versions view "$current_version_id" \
              --name "$worker" --json > "$current_version"
            current_release_sha=$(jq -er \
              '.annotations["workers/tag"] | select(test("^[a-f0-9]{40}$"))' \
              "$current_version")
            current_release_message=$(jq -er '.annotations["workers/message"] // ""' \
              "$current_version")
          elif [ "$settings_status" = "404" ]; then
            jq -e '.success == false and (.errors | type == "array")' "$settings" >/dev/null
          else
            echo "::error::Manifest cron recovery inspection returned HTTP ${settings_status}."
            exit 1
          fi

          deployed_version_id=
          if [ -s "$RUNNER_TEMP/manifest-cron-deployed-version-id" ]; then
            deployed_version_id=$(tr -d '\n' < "$RUNNER_TEMP/manifest-cron-deployed-version-id")
            [[ "$deployed_version_id" =~ ^([a-f0-9]{32}|[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12})$ ]]
          fi
          owned=false
          if [ "$current_state" = "present" ] && \
            { { [ "$current_release_sha" = "$DEPLOY_SHA" ] && \
                [ "$current_release_message" = "Exact-SHA two-realm public-discovery cron transaction ${RELEASE_TRANSACTION_ID} before Q" ]; } || \
              { [ -n "$deployed_version_id" ] && [ "$current_version_id" = "$deployed_version_id" ]; }; }; then
            owned=true
          fi

          if [ "$owned" = "false" ]; then
            if [ "$MANIFEST_CRON_BASELINE_STATE" = "present" ] && \
              [ "$current_state" = "present" ] && \
              [ "$current_version_id" = "$MANIFEST_CRON_BASELINE_VERSION_ID" ]; then
              test "$current_release_sha" = "$MANIFEST_CRON_BASELINE_RELEASE_SHA"
              node gate/scripts/verify-public-discovery-cron-deployment.mjs
              exit 0
            fi
            echo "::notice::Manifest cron is absent or owned by another serialized release; recovery will not overwrite it."
            exit 0
          fi

          retain_current=false
          recovery_result="$RUNNER_TEMP/public-template-og-production-qualification-recovery.json"
          if [ ! -s "$RUNNER_TEMP/production-pages-pair-restored.json" ]; then
            if [ "$COMMIT_OUTCOME" = "success" ]; then
              retain_current=true
            elif [ -s "$recovery_result" ] && jq -e \
              '.recovered == false and (.reason == "committed-terminal" or .reason == "superseded")' \
              "$recovery_result" >/dev/null; then
              retain_current=true
            fi
          fi
          if [ "$retain_current" = "true" ]; then
            test "$current_release_sha" = "$DEPLOY_SHA"
            node gate/scripts/verify-public-discovery-cron-deployment.mjs
            exit 0
          fi

          if [ "$MANIFEST_CRON_BASELINE_STATE" = "present" ]; then
            gate/.github/release-gate/node_modules/.bin/wrangler rollback "$MANIFEST_CRON_BASELINE_VERSION_ID" \
              --name "$worker" \
              --message "Restore cron paired with ${MANIFEST_CRON_BASELINE_RELEASE_SHA} after failed ${DEPLOY_SHA} release" \
              --yes
            restored="$RUNNER_TEMP/manifest-cron-restored-deployment.json"
            restored_version="$RUNNER_TEMP/manifest-cron-restored-version.json"
            gate/.github/release-gate/node_modules/.bin/wrangler deployments status \
              --name "$worker" --json > "$restored"
            jq -e --arg version "$MANIFEST_CRON_BASELINE_VERSION_ID" \
              '.versions | length == 1 and .[0].percentage == 100 and .[0].version_id == $version' \
              "$restored" >/dev/null
            gate/.github/release-gate/node_modules/.bin/wrangler versions view \
              "$MANIFEST_CRON_BASELINE_VERSION_ID" --name "$worker" --json > "$restored_version"
            jq -e --arg sha "$MANIFEST_CRON_BASELINE_RELEASE_SHA" \
              '.annotations["workers/tag"] == $sha' "$restored_version" >/dev/null
            node gate/scripts/verify-public-discovery-cron-deployment.mjs
          else
            gate/.github/release-gate/node_modules/.bin/wrangler delete "$worker" --force
            for suffix in settings schedules subdomain; do
              missing="$RUNNER_TEMP/manifest-cron-${suffix}-absent.json"
              missing_status=$(curl -sS --max-time 30 -o "$missing" -w '%{http_code}' \
                -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${worker}/${suffix}")
              test "$missing_status" = "404"
              jq -e '.success == false and (.errors | type == "array")' "$missing" >/dev/null
            done
          fi

      # Recovery and cleanup are separate state-machine phases. This step runs
      # only after every in-job Pages/edge recovery attempt has settled, chooses
      # the exact canonical SHA from durable evidence, and never tries to use a
      # baseline that successful cleanup may already have retired.
      - name: Reconcile failed normal production exposure after recovery
        if: >-
          always() &&
          (failure() || cancelled()) &&
          steps.reconcile_production_exposure.outcome != 'success'
        timeout-minutes: 15
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.PROTECTED_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: '019d1184e655db74b7589794a2a2a533'
          CF_PAGES_PROJECT: communique-site
          CF_PAGES_ALLOWED_ALIAS_BRANCHES: production
        run: |
          set -euo pipefail
          journal="$RUNNER_TEMP/production-release-journal/public-template-og-production-release-journal.json"
          recovery_result="$RUNNER_TEMP/public-template-og-production-qualification-recovery.json"
          test -s "$journal"
          baseline_sha=$(jq -er '.pagesCapture.releaseSha | select(test("^[a-f0-9]{40}$"))' "$journal")
          expected_sha="$DEPLOY_SHA"
          restored_baseline=false
          if [ -s "$RUNNER_TEMP/production-pages-pair-restored.json" ] || \
            { [ -s "$recovery_result" ] && jq -e \
              '.recovered == true and .reason == "recovered"' "$recovery_result" >/dev/null; }; then
            expected_sha="$baseline_sha"
            restored_baseline=true
          elif [ "${{ steps.commit_production_authority.outcome }}" != "success" ]; then
            if [ ! -s "$recovery_result" ] || ! jq -e \
              '.recovered == false and .reason == "committed-terminal"' \
              "$recovery_result" >/dev/null; then
              echo "::error::Terminal exposure cleanup lacks a proved current or restored canonical tuple."
              exit 1
            fi
          fi
          reconciliation=$(node gate/scripts/reconcile-cloudflare-pages-exposure.mjs \
            --prune \
            --expected-production-sha "$expected_sha")
          printf '%s\n' "$reconciliation"
          if ! grep -q 'stale=0;' <<<"$reconciliation" || \
            ! grep -q 'preserved=0;' <<<"$reconciliation"; then
            echo "::error::Recovered production reconciliation retained an unprotected deployment."
            exit 1
          fi
          if [ "$restored_baseline" = "false" ]; then
            previous_url=$(jq -er \
              '.pagesCapture.deploymentUrl |
               select(test("^https://[a-z0-9-]+\\.communique-site\\.pages\\.dev$"))' \
              "$journal")
            node gate/scripts/verify-pages-deployment-retired.mjs --url "$previous_url"
          fi

      # Once the rollback reserve exists, no earlier failure can reach this
      # phase without first traversing every recovery branch above. Removing it
      # here cannot trigger rollback, so a cleanup failure leaves a safe extra
      # URL and fails the job instead of destroying the last known-good pair.
      - name: Retire exact normal rollback reserve after recovery settles
        if: always() && steps.reconcile_production_exposure.outcome == 'success'
        timeout-minutes: 15
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.PROTECTED_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: '019d1184e655db74b7589794a2a2a533'
          CF_PAGES_PROJECT: communique-site
          CF_PAGES_ALLOWED_ALIAS_BRANCHES: production
        run: |
          set -euo pipefail
          journal="$RUNNER_TEMP/production-release-journal/public-template-og-production-release-journal.json"
          reconciliation=$(node gate/scripts/reconcile-cloudflare-pages-exposure.mjs \
            --prune \
            --expected-production-sha "$DEPLOY_SHA")
          printf '%s\n' "$reconciliation"
          if ! grep -q 'stale=0;' <<<"$reconciliation" || \
            ! grep -q 'preserved=0;' <<<"$reconciliation"; then
            echo "::error::Terminal production cleanup retained its rollback reserve or another exposure."
            exit 1
          fi
          previous_url=$(jq -er \
            '.pagesCapture.deploymentUrl |
             select(test("^https://[a-z0-9-]+\\.communique-site\\.pages\\.dev$"))' \
            "$journal")
          node gate/scripts/verify-pages-deployment-retired.mjs --url "$previous_url"

  deploy:
    # Emergency containment publication only. Normal release authority is owned
    # exclusively by the split preview/production activation DAG above.
    needs:
      - source-verify
      - build-artifact
      - build-artifact-replica
      - artifact-consensus
      - activate-preview
      - qualify-preview-generation
    if: >-
      always() &&
      needs.source-verify.result == 'success' &&
      needs.source-verify.outputs.deploy_mode == 'containment' &&
      github.event_name == 'workflow_dispatch' &&
      needs.build-artifact.result == 'skipped' &&
      needs.build-artifact-replica.result == 'skipped' &&
      needs.artifact-consensus.result == 'skipped' &&
      needs.activate-preview.result == 'skipped' &&
      needs.qualify-preview-generation.result == 'skipped' &&
      github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    # The 150-minute ceiling exceeds the 124-minute sum of every declared step
    # bound, including forward recovery, retirement proof, and always-run
    # exposure cleanup after an attempted production upload.
    timeout-minutes: 150
    environment:
      # The source gate proves containment is a manual production-only action
      # before this job can materialize Production environment credentials.
      name: Production
    env:
      DEPLOY_BRANCH: production
      DEPLOY_SHA: ${{ needs.source-verify.outputs.verified_sha }}
      DEPLOY_MODE: ${{ needs.source-verify.outputs.deploy_mode }}
      TRUSTED_GATE_SHA: ${{ needs.source-verify.outputs.trusted_gate_sha }}
      ARTIFACT_ROOT: ${{ github.workspace }}/release-artifact
      DETACHED_ATTESTATION_VERIFIED: ${{ needs.source-verify.outputs.attestation_verified }}
    permissions:
      contents: read
    steps:
      - name: Checkout immutable protected deployment gate
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        timeout-minutes: 5
        with:
          ref: ${{ needs.source-verify.outputs.trusted_gate_sha }}
          path: gate
          persist-credentials: false

      - name: Prove secret-side authority identity
        timeout-minutes: 1
        run: |
          [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$TRUSTED_GATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git -C gate rev-parse HEAD)" = "$TRUSTED_GATE_SHA"
          if [ "$DEPLOY_BRANCH" = "production" ] && [ "$DETACHED_ATTESTATION_VERIFIED" != "true" ]; then
            echo "::error::Production publication requires trusted detached attestation A for exact S."
            exit 1
          fi

      - name: Setup trusted Node.js runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        timeout-minutes: 5
        with:
          node-version-file: 'gate/.node-version'
          cache: npm
          cache-dependency-path: 'gate/.github/release-gate/package-lock.json'

      - name: Install trusted deployment tooling
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --prefix gate/.github/release-gate
          test ! -e gate/node_modules
          ln -s .github/release-gate/node_modules gate/node_modules
        timeout-minutes: 10

      - name: Generate and prove trusted containment artifact locally
        if: env.DEPLOY_MODE == 'containment'
        timeout-minutes: 1
        run: |
          set -euo pipefail
          rm -rf "$ARTIFACT_ROOT"
          mkdir -p "$ARTIFACT_ROOT"
          node gate/scripts/generate-trusted-containment-worker.mjs \
            --source-sha "$DEPLOY_SHA" \
            --output-directory "$ARTIFACT_ROOT/pages"
          python3 <<'PYTHON'
          import json
          import os
          import re
          import tomllib

          with open('gate/wrangler.toml', 'rb') as source:
              values = tomllib.load(source).get('vars', {})
          public_runtime = {
              'PUBLIC_CONVEX_URL': 'https://quirky-chinchilla-352.convex.cloud',
              'ATLAS_BASE_URL': values.get('ATLAS_BASE_URL'),
              'VITE_ATLAS_BASE_URL': values.get('VITE_ATLAS_BASE_URL'),
              'EXPECTED_CELL_MAP_ROOT': values.get('EXPECTED_CELL_MAP_ROOT'),
              'EXPECTED_CELL_MAP_DEPTH': values.get('EXPECTED_CELL_MAP_DEPTH'),
          }
          if not re.fullmatch(r'https://atlas\.commons\.email/v[0-9]{8}', str(public_runtime['ATLAS_BASE_URL'])):
              raise SystemExit('trusted containment ATLAS_BASE_URL is invalid')
          if public_runtime['VITE_ATLAS_BASE_URL'] != public_runtime['ATLAS_BASE_URL']:
              raise SystemExit('trusted containment VITE_ATLAS_BASE_URL differs')
          if not re.fullmatch(r'0x[0-9a-fA-F]{64}', str(public_runtime['EXPECTED_CELL_MAP_ROOT'])):
              raise SystemExit('trusted containment EXPECTED_CELL_MAP_ROOT is invalid')
          if str(public_runtime['EXPECTED_CELL_MAP_DEPTH']) not in {'18', '20', '22', '24'}:
              raise SystemExit('trusted containment EXPECTED_CELL_MAP_DEPTH is invalid')

          metadata = {
              'schemaVersion': 1,
              'sourceSha': os.environ['DEPLOY_SHA'],
              'trustedGateSha': os.environ['TRUSTED_GATE_SHA'],
              'finalizationBoundary': 'secret-job-trusted-containment-v1',
              'mode': 'containment',
              'branch': 'production',
              'manifestGateIncluded': False,
              'convexWorkBudgetIncluded': False,
              'trustedPagesEdgeIncluded': False,
              'publicTemplateOgConsumerIncluded': False,
              'manifestCronIncluded': False,
              'publicRuntime': public_runtime,
          }
          metadata_path = os.path.join(os.environ['ARTIFACT_ROOT'], 'release-metadata.json')
          descriptor = os.open(metadata_path, os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600)
          with os.fdopen(descriptor, 'w', encoding='utf-8', newline='\n') as output:
              output.write(json.dumps(metadata, separators=(',', ':')) + '\n')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              for key, value in public_runtime.items():
                  output.write(f'{key}={value}\n')
          PYTHON
          digest_json=$(node gate/scripts/canonical-artifact-tree-digest.mjs \
            --artifact-root "$ARTIFACT_ROOT" \
            --normalize-modes)
          artifact_digest=$(printf '%s' "$digest_json" | jq -er \
            '.digest | select(test("^[0-9a-f]{64}$"))')
          echo "ARTIFACT_DIGEST=$artifact_digest" >> "$GITHUB_ENV"

      - name: Validate locally generated containment artifact
        if: env.DEPLOY_MODE == 'containment'
        timeout-minutes: 1
        run: |
          TRUSTED_PUBLIC_CONVEX_URL="$PUBLIC_CONVEX_URL" \
          TRUSTED_ATLAS_BASE_URL="$ATLAS_BASE_URL" \
          TRUSTED_VITE_ATLAS_BASE_URL="$VITE_ATLAS_BASE_URL" \
          TRUSTED_EXPECTED_CELL_MAP_ROOT="$EXPECTED_CELL_MAP_ROOT" \
          TRUSTED_EXPECTED_CELL_MAP_DEPTH="$EXPECTED_CELL_MAP_DEPTH" \
            node gate/scripts/validate-pages-release-artifact.mjs \
              --artifact-root "$ARTIFACT_ROOT" \
              --expected-source-sha "$DEPLOY_SHA" \
              --expected-trusted-gate-sha "$TRUSTED_GATE_SHA" \
              --expected-mode containment \
              --expected-branch production

      - name: Derive trusted Wrangler deployment config
        timeout-minutes: 1
        run: |
          set -euo pipefail
          trusted_config=gate/wrangler.containment.toml
          deploy_wrangler_cwd="$RUNNER_TEMP/pages-deploy-config"
          rm -rf "$deploy_wrangler_cwd"
          mkdir -p "$deploy_wrangler_cwd"
          cp "$trusted_config" "$deploy_wrangler_cwd/wrangler.toml"
          {
            echo "DEPLOY_WRANGLER_CWD=$deploy_wrangler_cwd"
            echo "DEPLOY_WRANGLER_CONFIG=$deploy_wrangler_cwd/wrangler.toml"
          } >> "$GITHUB_ENV"
          test "$(find "$deploy_wrangler_cwd" -mindepth 1 -maxdepth 1 -type f -printf '%f\n')" = "wrangler.toml"
          echo "Derived the containment-only deployment config from immutable trusted gate T."

      - name: Validate trusted config and bounded candidate artifact
        timeout-minutes: 1
        env:
          TRUSTED_PUBLIC_CONVEX_URL: ${{ env.PUBLIC_CONVEX_URL }}
          TRUSTED_ATLAS_BASE_URL: ${{ env.ATLAS_BASE_URL }}
          TRUSTED_VITE_ATLAS_BASE_URL: ${{ env.VITE_ATLAS_BASE_URL }}
          TRUSTED_EXPECTED_CELL_MAP_ROOT: ${{ env.EXPECTED_CELL_MAP_ROOT }}
          TRUSTED_EXPECTED_CELL_MAP_DEPTH: ${{ env.EXPECTED_CELL_MAP_DEPTH }}
        run: |
          python3 - "$DEPLOY_WRANGLER_CONFIG" <<'PYTHON'
          import sys
          import tomllib

          with open(sys.argv[1], "rb") as config_file:
              config = tomllib.load(config_file)

          allowed = {
              "name",
              "compatibility_date",
              "compatibility_flags",
              "pages_build_output_dir",
          }
          unexpected = sorted(set(config) - allowed)
          if unexpected:
              sys.exit(
                  "containment Wrangler config retains forbidden capabilities: "
                  + ", ".join(unexpected)
              )
          if set(config) != allowed or config.get("name") != "communique-site":
              sys.exit("containment Wrangler config is not the exact trusted minimal shape")
          PYTHON
          node gate/scripts/validate-pages-release-artifact.mjs \
            --artifact-root "$ARTIFACT_ROOT" \
            --expected-source-sha "$DEPLOY_SHA" \
            --expected-trusted-gate-sha "$TRUSTED_GATE_SHA" \
            --expected-mode containment \
            --expected-branch production

      - name: Resolve deployment URL
        timeout-minutes: 1
        run: echo "DEPLOY_PUBLIC_URL=https://commons.email" >> "$GITHUB_ENV"

      - name: Upload containment artifact to staging preflight authority
        id: containment_preflight_upload
        if: env.DEPLOY_MODE == 'containment' && env.DEPLOY_BRANCH == 'production'
        timeout-minutes: 10
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.PROTECTED_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: '019d1184e655db74b7589794a2a2a533'
        run: |
          node gate/scripts/canonical-artifact-tree-digest.mjs \
            --artifact-root "$ARTIFACT_ROOT" \
            --expected-digest "$ARTIFACT_DIGEST"
          set -o pipefail
          (
            cd "$DEPLOY_WRANGLER_CWD"
            "$GITHUB_WORKSPACE/gate/.github/release-gate/node_modules/.bin/wrangler" pages deploy "$ARTIFACT_ROOT/pages" \
              --no-bundle \
              --project-name communique-site \
              --branch staging \
              --commit-hash "$DEPLOY_SHA"
          ) 2>&1 | tee "$RUNNER_TEMP/containment-preflight-output.txt"

      - name: Prove isolated containment preflight on staging custom authority
        id: containment_preflight_verify
        if: env.DEPLOY_MODE == 'containment' && env.DEPLOY_BRANCH == 'production'
        timeout-minutes: 5
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.PROTECTED_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: '019d1184e655db74b7589794a2a2a533'
          INTERNAL_API_SECRET: ${{ secrets.PROTECTED_INTERNAL_API_SECRET }}
        run: |
          DEPLOY_BRANCH=staging \
            node gate/scripts/verify-pages-preview-release.mjs
          node gate/scripts/verify-containment-deployment.mjs \
            --url "https://staging.commons.email"

      - name: Verify containment preflight has no application bindings
        id: containment_preflight_binding
        if: env.DEPLOY_MODE == 'containment' && env.DEPLOY_BRANCH == 'production'
        timeout-minutes: 5
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.PROTECTED_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: '019d1184e655db74b7589794a2a2a533'
        run: node gate/scripts/verify-pages-containment-bindings.mjs --environment preview

      - name: Capture previous production canonical deployment
        id: capture_previous_production
        if: env.DEPLOY_BRANCH == 'production'
        timeout-minutes: 2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.PROTECTED_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: '019d1184e655db74b7589794a2a2a533'
          CF_PAGES_PROJECT: communique-site
        run: |
          previous=$(node gate/scripts/cloudflare-pages-production-control.mjs capture)
          previous_id=$(printf '%s' "$previous" | jq -er '.deploymentId')
          previous_sha=$(printf '%s' "$previous" | jq -er '.releaseSha')
          previous_url=$(printf '%s' "$previous" | jq -er '.url')
          echo "PREVIOUS_PRODUCTION_URL=${previous_url}" >> "$GITHUB_ENV"
          echo "Captured pre-publication canonical ${previous_id} at ${previous_sha}."

      - name: Deploy containment artifact
        id: containment_pages_deploy
        if: env.DEPLOY_MODE == 'containment'
        timeout-minutes: 10
        run: |
          set -euo pipefail
          node gate/scripts/canonical-artifact-tree-digest.mjs \
            --artifact-root "$ARTIFACT_ROOT" \
            --expected-digest "$ARTIFACT_DIGEST"
          (
            cd "$DEPLOY_WRANGLER_CWD"
            "$GITHUB_WORKSPACE/gate/.github/release-gate/node_modules/.bin/wrangler" pages deploy "$ARTIFACT_ROOT/pages" \
              --no-bundle \
              --project-name communique-site \
              --branch "$DEPLOY_BRANCH" \
              --commit-hash "$DEPLOY_SHA"
          ) 2>&1 | tee "$RUNNER_TEMP/pages-deploy-output.txt"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.PROTECTED_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: '019d1184e655db74b7589794a2a2a533'

      - name: Resolve uploaded deployment URL
        timeout-minutes: 1
        run: |
          deployment_url=$(sed -nE 's/.*Take a peek over at (https:\/\/[a-z0-9-]+\.communique-site\.pages\.dev).*/\1/p' "$RUNNER_TEMP/pages-deploy-output.txt" | head -n 1)

          if [ -z "$deployment_url" ]; then
            echo "::error::Unable to parse immutable Cloudflare Pages deployment URL from wrangler output."
            cat "$RUNNER_TEMP/pages-deploy-output.txt"
            exit 1
          fi

          echo "Captured immutable uploaded deployment URL ${deployment_url}."

      - name: Prove uploaded deployment metadata without invoking pages.dev
        timeout-minutes: 5
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.PROTECTED_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: '019d1184e655db74b7589794a2a2a533'
          CF_PAGES_PROJECT: communique-site
        run: |
          current=$(node gate/scripts/cloudflare-pages-production-control.mjs capture)
          printf '%s' "$current" | jq -e --arg sha "$DEPLOY_SHA" \
            '.releaseSha == $sha and (.deploymentId | type == "string")' >/dev/null

      - name: Verify uploaded containment has no application bindings
        if: env.DEPLOY_MODE == 'containment'
        timeout-minutes: 5
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.PROTECTED_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: '019d1184e655db74b7589794a2a2a533'
        run: node gate/scripts/verify-pages-containment-bindings.mjs --environment production

      - name: Purge CDN cache
        if: env.DEPLOY_BRANCH == 'production'
        run: |
          response=$(curl -sS --max-time 30 -w "\n%{http_code}" -X POST "https://api.cloudflare.com/client/v4/zones/${{ secrets.PROTECTED_CLOUDFLARE_ZONE_ID }}/purge_cache" \
            -H "Authorization: Bearer ${{ secrets.PROTECTED_CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"purge_everything":true}') || {
              echo "::warning::Cloudflare cache purge request failed; deployment health check will still run."
              exit 0
            }

          http_status=$(printf '%s\n' "$response" | tail -n 1)
          body=$(printf '%s\n' "$response" | sed '$d')

          if ! [[ "$http_status" =~ ^[0-9]{3}$ ]]; then
            echo "::warning::Cloudflare cache purge returned an unreadable HTTP status; deployment health check will still run."
            exit 0
          fi

          if (( http_status < 200 || http_status >= 300 )); then
            echo "::warning::Cloudflare cache purge returned HTTP ${http_status}; deployment health check will still run."
            exit 0
          fi

          if ! echo "$body" | jq -e '.success == true' >/dev/null; then
            echo "::warning::Cloudflare cache purge response did not report success; deployment health check will still run."
          fi

      - name: Verify immutable containment artifact
        if: env.DEPLOY_MODE == 'containment'
        timeout-minutes: 5
        env:
          INTERNAL_API_SECRET: ${{ secrets.PROTECTED_INTERNAL_API_SECRET }}
        run: node gate/scripts/verify-containment-deployment.mjs --url "$DEPLOY_PUBLIC_URL"

      # The pre-containment canonical is the known quota-bomb artifact and must
      # never be restored. If containment publication or a later proof fails,
      # forward-deploy the deterministic artifact already proven through the
      # staging custom authority instead.
      - name: Forward-redeploy proven containment after publication failure
        id: forward_recover_containment
        if: >-
          always() &&
          (failure() || cancelled()) &&
          env.DEPLOY_MODE == 'containment' &&
          env.DEPLOY_BRANCH == 'production' &&
          steps.containment_preflight_verify.outcome == 'success' &&
          steps.containment_preflight_binding.outcome == 'success' &&
          steps.containment_pages_deploy.outcome != 'skipped'
        timeout-minutes: 10
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.PROTECTED_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: '019d1184e655db74b7589794a2a2a533'
        run: |
          node gate/scripts/canonical-artifact-tree-digest.mjs \
            --artifact-root "$ARTIFACT_ROOT" \
            --expected-digest "$ARTIFACT_DIGEST"
          (
            cd "$DEPLOY_WRANGLER_CWD"
            "$GITHUB_WORKSPACE/gate/.github/release-gate/node_modules/.bin/wrangler" pages deploy "$ARTIFACT_ROOT/pages" \
              --no-bundle \
              --project-name communique-site \
              --branch production \
              --commit-hash "$DEPLOY_SHA"
          )
          node gate/scripts/verify-pages-containment-bindings.mjs --environment production

      - name: Prove forward containment recovery on the custom domain
        id: verify_forward_containment
        if: always() && steps.forward_recover_containment.outcome == 'success'
        timeout-minutes: 5
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.PROTECTED_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.PROTECTED_CLOUDFLARE_ZONE_ID }}
          INTERNAL_API_SECRET: ${{ secrets.PROTECTED_INTERNAL_API_SECRET }}
        run: |
          purge_response=$(curl -fsS --max-time 30 \
            -X POST "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"purge_everything":true}')
          if ! printf '%s' "$purge_response" | jq -e '.success == true' >/dev/null; then
            echo "::error::The forward-recovery cache purge did not report success."
            exit 1
          fi
          node gate/scripts/verify-containment-deployment.mjs --url "$DEPLOY_PUBLIC_URL"

      - name: Reconcile recovered production exposure
        id: reconcile_recovered_production
        if: >-
          always() &&
          steps.verify_forward_containment.outcome == 'success'
        timeout-minutes: 15
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.PROTECTED_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: '019d1184e655db74b7589794a2a2a533'
          CF_PAGES_PROJECT: communique-site
          CF_PAGES_ALLOWED_ALIAS_BRANCHES: production
        run: |
          reconciliation=$(node gate/scripts/reconcile-cloudflare-pages-exposure.mjs \
            --prune \
            --expected-production-sha "$DEPLOY_SHA")
          printf '%s\n' "$reconciliation"
          if ! grep -q 'stale=0;' <<<"$reconciliation" || \
            ! grep -q 'preserved=0;' <<<"$reconciliation"; then
            echo "::error::Forward-recovery reconciliation retained a noncanonical deployment."
            exit 1
          fi

      - name: Reconcile successful Pages publication
        id: reconcile_success
        if: >-
          success() &&
          steps.containment_pages_deploy.outcome == 'success'
        timeout-minutes: 15
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.PROTECTED_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: '019d1184e655db74b7589794a2a2a533'
          CF_PAGES_PROJECT: communique-site
          CF_PAGES_ALLOWED_ALIAS_BRANCHES: production
        run: |
          reconciliation=$(node gate/scripts/reconcile-cloudflare-pages-exposure.mjs \
            --prune \
            --expected-production-sha "$DEPLOY_SHA")
          printf '%s\n' "$reconciliation"
          if ! grep -q 'stale=0;' <<<"$reconciliation" || \
            ! grep -q 'preserved=0;' <<<"$reconciliation"; then
            echo "::error::Successful reconciliation retained a noncanonical deployment."
            exit 1
          fi

      - name: Prove previous production URL is retired
        if: >-
          always() &&
          env.DEPLOY_BRANCH == 'production' &&
          steps.capture_previous_production.outcome == 'success' &&
          (steps.reconcile_success.outcome == 'success' ||
          steps.reconcile_recovered_production.outcome == 'success')
        timeout-minutes: 5
        run: >-
          node gate/scripts/verify-pages-deployment-retired.mjs
          --url "$PREVIOUS_PRODUCTION_URL"

      # A preflight upload can create a staging deployment even when its custom
      # authority or binding proof fails and canonical publication never starts.
      # Always prune noncanonical exposure. Deliberately omit an expected
      # production SHA: this cleanup must neither restore nor replace the old
      # quota-bomb canonical, and stripped preview bindings are the safe state.
      - name: Fail-safe prune every containment preflight exposure
        id: cleanup_containment_preflight
        if: >-
          always() &&
          env.DEPLOY_MODE == 'containment' &&
          env.DEPLOY_BRANCH == 'production' &&
          steps.containment_preflight_upload.outcome != 'skipped'
        timeout-minutes: 15
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.PROTECTED_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: '019d1184e655db74b7589794a2a2a533'
          CF_PAGES_PROJECT: communique-site
          CF_PAGES_ALLOWED_ALIAS_BRANCHES: production
        run: |
          reconciliation=$(node gate/scripts/reconcile-cloudflare-pages-exposure.mjs --prune)
          printf '%s\n' "$reconciliation"
          if ! grep -q 'stale=0;' <<<"$reconciliation" || \
            ! grep -q 'preserved=0;' <<<"$reconciliation"; then
            echo "::error::Containment preflight cleanup retained a noncanonical deployment."
            exit 1
          fi
