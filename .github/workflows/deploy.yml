name: Deploy to Cloudflare Pages

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch/environment to deploy'
        required: true
        default: production
        type: choice
        options:
          - production
          - staging
      ref:
        description: 'Git ref to deploy. Defaults to branch.'
        required: false
        type: string
        default: ''
      mode:
        description: 'Publication mode (containment is a production-only emergency bootstrap)'
        required: true
        default: normal
        type: choice
        options:
          - normal
          - containment
  workflow_run:
    workflows: [CI Tests]
    types: [completed]
    branches: [staging]

concurrency:
  # Pages publication and forced deletion must never overlap. This repository
  # disables native Git uploads, so one cross-workflow mutex closes the
  # canonical/alias race between deploy.yml and pages-exposure-guard.yml.
  group: cloudflare-pages-publication
  cancel-in-progress: false

env:
  # One nonsecret publication identity fences same-SHA workflow reruns. Realm
  # remains a separate state-machine coordinate.
  RELEASE_TRANSACTION_ID: ${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  source-verify:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    env:
      # T is the exact commit that supplied this protected workflow. A mutable
      # repository variable cannot silently downgrade the release authority.
      TRUSTED_GATE_SHA: ${{ github.workflow_sha }}
      WORKFLOW_REF: ${{ github.workflow_ref }}
      REPOSITORY: ${{ github.repository }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      DEPLOY_BRANCH: ${{ github.event_name == 'workflow_dispatch' && inputs.branch || github.event.workflow_run.head_branch }}
      DEPLOY_EVENT: ${{ github.event_name }}
      DEPLOY_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'normal' }}
      DEPLOY_REQUESTED_REF: ${{ github.event_name == 'workflow_dispatch' && (inputs.ref || inputs.branch) || github.event.workflow_run.head_sha }}
    outputs:
      verified_sha: ${{ steps.resolve-sha.outputs.sha }}
      deploy_mode: ${{ steps.resolve-sha.outputs.mode }}
      attestation_verified: ${{ steps.resolve-sha.outputs.attestation_verified }}
      attestation_proof_sha: ${{ steps.resolve-sha.outputs.attestation_proof_sha }}
      trusted_gate_sha: ${{ steps.resolve-sha.outputs.trusted_gate_sha }}
    steps:
      # Candidate/source objects remain inert. Verification code and the
      # allowed-signers trust root come only from the protected default branch,
      # so source S cannot approve itself by changing its own graph or verifier.
      - name: Require immutable protected workflow authority
        run: |
          set -euo pipefail
          if ! [[ "$TRUSTED_GATE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::github.workflow_sha must be one exact protected workflow commit."
            exit 1
          fi
          expected_workflow_ref="${REPOSITORY}/.github/workflows/deploy.yml@refs/heads/${DEFAULT_BRANCH}"
          if [ "$DEFAULT_BRANCH" != "main" ] || [ "$WORKFLOW_REF" != "$expected_workflow_ref" ]; then
            echo "::error::deploy.yml must execute from protected default branch main."
            exit 1
          fi

      - name: Checkout immutable detached-attestation gate
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.workflow_sha }}
          path: gate
          # The next credential-free step must prove ancestry before reading a
          # runtime version or executing any file supplied by T.
          fetch-depth: 0
          persist-credentials: false

      - name: Authenticate immutable gate before any gate-owned execution
        run: |
          set -euo pipefail
          if [ "$DEFAULT_BRANCH" != "main" ]; then
            echo "::error::The release authority contract requires protected default branch main."
            exit 1
          fi
          gate_checkout=$(git -C gate rev-parse --verify 'HEAD^{commit}')
          trusted_default=$(git -C gate rev-parse --verify "refs/remotes/origin/${DEFAULT_BRANCH}^{commit}")
          if [ "$gate_checkout" != "$TRUSTED_GATE_SHA" ]; then
            echo "::error::Trusted gate checkout did not resolve to github.workflow_sha."
            exit 1
          fi
          if [ "$TRUSTED_GATE_SHA" != "$trusted_default" ]; then
            echo "::error::The trusted workflow commit is not the current protected-main head."
            exit 1
          fi

      - name: Setup trusted Node.js runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: 'gate/.node-version'

      - name: Verify live GitHub release authority before environment eligibility
        timeout-minutes: 2
        env:
          # GITHUB_TOKEN cannot read branch protection. This is a separate,
          # single-repository fine-grained token with Actions:read and
          # Administration:read only; it cannot mutate repository state.
          RELEASE_AUTHORITY_TOKEN: ${{ secrets.PROTECTED_GITHUB_RELEASE_AUTHORITY_READ_TOKEN }}
          API_URL: ${{ github.api_url }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -z "${RELEASE_AUTHORITY_TOKEN:-}" ]; then
            echo "::error::PROTECTED_GITHUB_RELEASE_AUTHORITY_READ_TOKEN is required."
            exit 1
          fi
          case "$DEPLOY_BRANCH" in
            production) release_environment=Production ;;
            staging) release_environment=Staging ;;
            *)
              echo "::error::Unsupported deployment branch for release authority: $DEPLOY_BRANCH"
              exit 1
              ;;
          esac
          headers=(
            -H "Accept: application/vnd.github+json"
            -H "Authorization: Bearer ${RELEASE_AUTHORITY_TOKEN}"
            -H "X-GitHub-Api-Version: 2022-11-28"
          )
          environment_file="$RUNNER_TEMP/github-release-environment.json"
          policies_file="$RUNNER_TEMP/github-release-branch-policies.json"
          protection_file="$RUNNER_TEMP/github-main-protection.json"
          curl -fsS "${headers[@]}" \
            "$API_URL/repos/$REPOSITORY/environments/$release_environment" \
            > "$environment_file"
          curl -fsS "${headers[@]}" \
            "$API_URL/repos/$REPOSITORY/environments/$release_environment/deployment-branch-policies?per_page=100&page=1" \
            > "$policies_file"
          curl -fsS "${headers[@]}" \
            "$API_URL/repos/$REPOSITORY/branches/main/protection" \
            > "$protection_file"
          jq -n \
            --slurpfile environment "$environment_file" \
            --slurpfile branchPolicies "$policies_file" \
            --slurpfile branchProtection "$protection_file" \
            '{
              environment: $environment[0],
              branchPolicies: $branchPolicies[0],
              branchProtection: $branchProtection[0]
            }' | node gate/scripts/verify-github-release-authority.mjs \
              --environment "$release_environment"

      - name: Prove Cloudflare public dynamic route cost shield
        if: env.DEPLOY_MODE == 'normal'
        timeout-minutes: 2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.PROTECTED_CLOUDFLARE_WAF_READ_TOKEN }}
        run: >-
          node gate/scripts/verify-cloudflare-public-dynamic-rate-limit.mjs
          --policy gate/config/cloudflare-public-dynamic-rate-limit.json
          --inventory gate/config/anonymous-dynamic-route-cost-inventory.json

      - name: Prove Cloudflare pages.dev origin closure
        timeout-minutes: 2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.PROTECTED_CLOUDFLARE_ORIGIN_CLOSURE_READ_TOKEN }}
        run: >-
          node gate/scripts/verify-cloudflare-pages-dev-origin-closure.mjs
          --policy gate/config/cloudflare-pages-dev-origin-closure.json

      - name: Resolve source SHA and verify detached attestation
        id: resolve-sha
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_ID: ${{ github.repository_id }}
          SERVER_URL: ${{ github.server_url }}
          CANDIDATE_GIT_DIR: ${{ runner.temp }}/commons-release-source.git
        run: |
          set -euo pipefail
          case "$DEPLOY_BRANCH" in
            production|staging) ;;
            *)
              echo "::error::Unsupported deployment branch: $DEPLOY_BRANCH"
              exit 1
              ;;
          esac
          case "$DEPLOY_MODE" in
            normal) ;;
            containment)
              if [ "$DEPLOY_EVENT" != "workflow_dispatch" ] || [ "$DEPLOY_BRANCH" != "production" ]; then
                echo "::error::Containment is authorized only by a manual production dispatch."
                exit 1
              fi
              ;;
            *)
              echo "::error::Unsupported deployment mode: $DEPLOY_MODE"
              exit 1
              ;;
          esac
          if [ "$DEPLOY_EVENT" = "workflow_dispatch" ] && [ "$GITHUB_REF_NAME" != "$DEFAULT_BRANCH" ]; then
            echo "::error::Dispatch deploy.yml only from the protected default branch; target source is selected by inert branch/ref inputs."
            exit 1
          fi

          git init --bare "$CANDIDATE_GIT_DIR"
          git --git-dir="$CANDIDATE_GIT_DIR" remote add origin "$SERVER_URL/$REPOSITORY.git"
          basic_auth=$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 | tr -d '\n')
          git_with_auth() {
            git -c "http.extraheader=AUTHORIZATION: basic ${basic_auth}" \
              --git-dir="$CANDIDATE_GIT_DIR" "$@"
          }
          git_with_auth fetch --no-tags origin \
            "+refs/heads/${DEPLOY_BRANCH}:refs/heads/deploy-branch"
          if [ "$DEPLOY_BRANCH" = "$DEFAULT_BRANCH" ]; then
            git --git-dir="$CANDIDATE_GIT_DIR" update-ref \
              refs/heads/trusted-default refs/heads/deploy-branch
          else
            git_with_auth fetch --no-tags origin \
              "+refs/heads/${DEFAULT_BRANCH}:refs/heads/trusted-default"
          fi
          branch_head=$(git --git-dir="$CANDIDATE_GIT_DIR" \
            rev-parse --verify 'refs/heads/deploy-branch^{commit}')
          trusted_gate_checkout=$(git -C gate rev-parse --verify 'HEAD^{commit}')
          if [ "$trusted_gate_checkout" != "$TRUSTED_GATE_SHA" ]; then
            echo "::error::Trusted gate checkout did not resolve to github.workflow_sha."
            exit 1
          fi
          trusted_default_head=$(git --git-dir="$CANDIDATE_GIT_DIR" \
            rev-parse --verify 'refs/heads/trusted-default^{commit}')
          if ! git --git-dir="$CANDIDATE_GIT_DIR" cat-file -e "${TRUSTED_GATE_SHA}^{commit}" || \
            [ "$TRUSTED_GATE_SHA" != "$trusted_default_head" ]; then
            echo "::error::Trusted workflow commit is no longer the protected default-branch head."
            exit 1
          fi

          if [ "$DEPLOY_REQUESTED_REF" = "$DEPLOY_BRANCH" ]; then
            verified_sha="$branch_head"
          elif [[ "$DEPLOY_REQUESTED_REF" =~ ^[0-9a-f]{40}$ ]] && \
            git --git-dir="$CANDIDATE_GIT_DIR" cat-file -e "${DEPLOY_REQUESTED_REF}^{commit}"; then
            verified_sha="$DEPLOY_REQUESTED_REF"
          else
            echo "::error::Manual ref must be the selected branch or an exact commit already contained in it."
            exit 1
          fi
          if ! git --git-dir="$CANDIDATE_GIT_DIR" merge-base --is-ancestor \
            "$verified_sha" "$branch_head"; then
            echo "::error::Requested ref ${verified_sha} is not contained in origin/${DEPLOY_BRANCH}."
            exit 1
          fi
          # A slower CI run for push A must not deploy after newer push B. Manual
          # dispatch intentionally retains ancestor semantics for audited rollback.
          if [ "${DEPLOY_EVENT}" = "workflow_run" ]; then
            if [ "$DEPLOY_BRANCH" = "production" ]; then
              echo "::error::Production publication is manual-only after explicit operator sequencing."
              exit 1
            fi
            if [ "${verified_sha}" != "${branch_head}" ]; then
              echo "::error::Skipping stale CI result ${verified_sha}; current ${DEPLOY_BRANCH} head is ${branch_head}."
              exit 1
            fi
          fi

          # Source S may supply application code, but it may not replace any
          # release authority pinned by trusted gate T. Compare Git objects
          # directly so candidate files are never executed to prove themselves.
          node gate/scripts/verify-release-gate-blobs.mjs \
            --repository-git-dir "$CANDIDATE_GIT_DIR" \
            --trusted-sha "$TRUSTED_GATE_SHA" \
            --source-sha "$verified_sha"

          graph_gate=(
            --repository-git-dir "$CANDIDATE_GIT_DIR"
            --source-commit-sha "$verified_sha"
          )
          if [ "$DEPLOY_MODE" = "containment" ]; then
            graph_gate+=(--require-containment-bootstrap-source-ready)
          else
            graph_gate+=(--require-launch-foundations-implemented)
          fi
          node gate/scripts/verify-release-hypergraph.mjs "${graph_gate[@]}"

          attestation_verified=false
          attestation_proof_sha=''
          if [ "$DEPLOY_BRANCH" = "production" ]; then
            attestation_ref="refs/heads/brutalist-attestations/$verified_sha"
            git_with_auth fetch --no-tags origin \
              "+$attestation_ref:refs/brutalist/release-proof"
            attestation_proof_sha=$(git --git-dir="$CANDIDATE_GIT_DIR" \
              rev-parse --verify 'refs/brutalist/release-proof^{commit}')
            [[ "$attestation_proof_sha" =~ ^[0-9a-f]{40}$ ]]
            BRUTALIST_EXPECTED_BASE_SHA="$TRUSTED_GATE_SHA" \
            BRUTALIST_EXPECTED_HEAD_SHA="$verified_sha" \
            BRUTALIST_EXPECTED_REPOSITORY_ID="$REPOSITORY_ID" \
            BRUTALIST_EXPECTED_REPOSITORY_SLUG="$REPOSITORY" \
            BRUTALIST_PROOF_COMMIT_SHA="$attestation_proof_sha" \
            BRUTALIST_REPOSITORY_GIT_DIR="$CANDIDATE_GIT_DIR" \
              node gate/scripts/verify-brutalist-attestation.mjs
            attestation_verified=true
          fi

          {
            echo "sha=${verified_sha}"
            echo "mode=${DEPLOY_MODE}"
            echo "attestation_verified=${attestation_verified}"
            echo "attestation_proof_sha=${attestation_proof_sha}"
            echo "trusted_gate_sha=${TRUSTED_GATE_SHA}"
          } >> "$GITHUB_OUTPUT"

  manual-verify:
    needs: source-verify
    # Containment must never install or execute candidate S. Trusted T verifies
    # S, A, and the containment hypergraph entirely in source-verify instead.
    if: >-
      github.event_name == 'workflow_dispatch' &&
      needs.source-verify.result == 'success' &&
      needs.source-verify.outputs.deploy_mode == 'normal'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      DEPLOY_MODE: ${{ needs.source-verify.outputs.deploy_mode }}
      DEPLOY_BRANCH: ${{ github.event_name == 'workflow_dispatch' && inputs.branch || github.event.workflow_run.head_branch }}
      DETACHED_ATTESTATION_VERIFIED: ${{ needs.source-verify.outputs.attestation_verified }}
      NODE_ENV: test
      CI: true
      PUBLIC_CONVEX_URL: https://placeholder.convex.cloud
      OAUTH_REDIRECT_BASE_URL: http://localhost:5173
      GOOGLE_CLIENT_ID: test-google-client-id
      GOOGLE_CLIENT_SECRET: test-google-client-secret
      FACEBOOK_CLIENT_ID: test-facebook-client-id
      FACEBOOK_CLIENT_SECRET: test-facebook-client-secret
      DISCORD_CLIENT_ID: test-discord-client-id
      DISCORD_CLIENT_SECRET: test-discord-client-secret
      LINKEDIN_CLIENT_ID: test-linkedin-client-id
      LINKEDIN_CLIENT_SECRET: test-linkedin-client-secret
      TWITTER_CLIENT_ID: test-twitter-client-id
      TWITTER_CLIENT_SECRET: test-twitter-client-secret
      INTERNAL_API_SECRET: ci-test-internal-api-secret-padding-32b
      INTERNAL_API_SECRET_PREVIOUS: ci-test-internal-api-secret-previous-32b
      UNSUBSCRIBE_SECRET: ci-test-unsubscribe-secret-padding-32-bytes
      ADDRESS_RESOLUTION_TOKEN_SECRET: ci-test-address-resolution-token-32b-pad
      SESSION_CREATION_SECRET: ci-test-session-creation-secret-32b-padding
      SESSION_CREATION_SECRET_PREVIOUS: ci-test-session-creation-secret-previous-32b-pad
      SESSION_COOKIE_SIGNING_SECRET: ci-test-session-cookie-signing-secret-32b-pad
      SESSION_COOKIE_SIGNING_SECRET_PREVIOUS: ci-test-session-cookie-signing-previous-32b-pad
      BLAST_DISPATCH_SECRET: ci-test-blast-dispatch-secret-32b-padding-x
      BLAST_RECEIPTS_SECRET: ci-test-blast-receipts-secret-32b-padding-x
    steps:
      - name: Checkout source-verified SHA
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.source-verify.outputs.verified_sha }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.node-version'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Enforce Convex query-efficiency guardrail
        run: npm run check:convex-queries

      - name: Enforce Convex server work-budget policy
        run: npm run check:convex-work-budget

      - name: Enforce Convex native usage-limit configuration
        run: npm run check:convex-native-usage-limit-config

      - name: Confirm protected publication authority
        run: |
          if [ "$DEPLOY_BRANCH" = "production" ] && [ "$DETACHED_ATTESTATION_VERIFIED" != "true" ]; then
            echo "::error::Production publication requires a trusted detached attestation for the exact source SHA."
            exit 1
          fi

      - name: Run public-discovery focused verification
        run: node scripts/run-public-discovery-focused-tests.mjs

      - name: Run full test suite
        run: npm run test:run
        timeout-minutes: 10

      - name: Run application type checks
        run: npm run check

      - name: Run Convex type checks
        run: npx tsc --noEmit -p convex/tsconfig.json

  build-candidate-closure:
    # Candidate lifecycle is confined to this disposable runner. Nothing from
    # its workspace is executable release authority: only the bounded Svelte
    # output closure crosses the job boundary as inert data.
    needs: [source-verify, manual-verify]
    if: >-
      always() &&
      needs.source-verify.result == 'success' &&
      needs.source-verify.outputs.deploy_mode == 'normal' &&
      github.ref_name == github.event.repository.default_branch &&
      ((github.event_name == 'workflow_dispatch' && needs.manual-verify.result == 'success') ||
      (github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      DEPLOY_BRANCH: ${{ github.event_name == 'workflow_dispatch' && inputs.branch || github.event.workflow_run.head_branch }}
      DEPLOY_SHA: ${{ needs.source-verify.outputs.verified_sha }}
      DEPLOY_MODE: ${{ needs.source-verify.outputs.deploy_mode }}
    outputs:
      artifact_id: ${{ steps.upload_candidate_closure.outputs.artifact-id }}
    steps:
      - name: Checkout source-verified SHA without credentials
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.source-verify.outputs.verified_sha }}
          path: candidate
          persist-credentials: false

      - name: Prove candidate checkout identity
        run: test "$(git -C candidate rev-parse HEAD)" = "$DEPLOY_SHA"

      - name: Setup candidate Node.js runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: 'candidate/.node-version'

      - name: Isolate primary runner-local npm cache
        run: echo "NPM_CONFIG_CACHE=$RUNNER_TEMP/npm-cache-primary" >> "$GITHUB_ENV"

      - name: Install candidate dependencies
        if: env.DEPLOY_MODE == 'normal'
        run: npm ci
        working-directory: candidate

      - name: Resolve bounded public build inputs
        run: |
          case "$DEPLOY_BRANCH" in
            production) public_convex_url='https://quirky-chinchilla-352.convex.cloud' ;;
            staging) public_convex_url='https://outstanding-firefly-831.convex.cloud' ;;
            *) echo "::error::Unsupported build branch."; exit 1 ;;
          esac
          PUBLIC_CONVEX_URL="$public_convex_url" python3 <<'PYTHON'
          import os
          import re
          import tomllib

          with open('candidate/wrangler.toml', 'rb') as source:
              config = tomllib.load(source)
          values = config.get('vars', {})
          expected = {
              'PUBLIC_CONVEX_URL': os.environ['PUBLIC_CONVEX_URL'],
              'ATLAS_BASE_URL': values.get('ATLAS_BASE_URL'),
              'VITE_ATLAS_BASE_URL': values.get('VITE_ATLAS_BASE_URL'),
              'EXPECTED_CELL_MAP_ROOT': values.get('EXPECTED_CELL_MAP_ROOT'),
              'EXPECTED_CELL_MAP_DEPTH': values.get('EXPECTED_CELL_MAP_DEPTH'),
          }
          if not re.fullmatch(r'https://atlas\.commons\.email/v[0-9]{8}', str(expected['ATLAS_BASE_URL'])):
              raise SystemExit('ATLAS_BASE_URL must be an exact versioned public Atlas URL')
          if expected['VITE_ATLAS_BASE_URL'] != expected['ATLAS_BASE_URL']:
              raise SystemExit('VITE_ATLAS_BASE_URL must equal ATLAS_BASE_URL')
          if not re.fullmatch(r'0x[0-9a-fA-F]{64}', str(expected['EXPECTED_CELL_MAP_ROOT'])):
              raise SystemExit('EXPECTED_CELL_MAP_ROOT is invalid')
          if str(expected['EXPECTED_CELL_MAP_DEPTH']) not in {'18', '20', '22', '24'}:
              raise SystemExit('EXPECTED_CELL_MAP_DEPTH is invalid')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              for key, value in expected.items():
                  output.write(f'{key}={value}\n')
              environment = {'production': 'production', 'staging': 'staging'}[
                  os.environ['DEPLOY_BRANCH']
              ]
              output.write(f'VITE_ENVIRONMENT={environment}\n')
          PYTHON

      - name: Build candidate artifact without deployment credentials
        if: env.DEPLOY_MODE == 'normal'
        timeout-minutes: 15
        run: npm run build
        working-directory: candidate
        env:
          VITE_RELEASE_SHA: ${{ needs.source-verify.outputs.verified_sha }}
          VITE_RUNTIME_CONTAINMENT_MODE: disabled

      - name: Stage only bounded ordinary Svelte output as inert data
        run: |
          set -euo pipefail
          rm -rf candidate-closure
          mkdir -p candidate-closure/.svelte-kit/output
          cp -R candidate/.svelte-kit/cloudflare candidate-closure/.svelte-kit/cloudflare
          cp -R candidate/.svelte-kit/output/server candidate-closure/.svelte-kit/output/server
          cp -R candidate/.svelte-kit/cloudflare-tmp candidate-closure/.svelte-kit/cloudflare-tmp

      - name: Upload untrusted candidate closure as inert data
        id: upload_candidate_closure
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pages-candidate-closure-primary-${{ needs.source-verify.outputs.verified_sha }}
          path: candidate-closure/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1

  build-artifact:
    # Fresh runner boundary: this job executes no candidate lifecycle. It
    # installs only registry/integrity-pinned dependencies with scripts disabled
    # and uses immutable T tooling to turn inert source/build bytes into every
    # executable release artifact.
    needs: [source-verify, manual-verify, build-candidate-closure]
    if: >-
      always() &&
      needs.source-verify.result == 'success' &&
      needs.source-verify.outputs.deploy_mode == 'normal' &&
      needs.build-candidate-closure.result == 'success' &&
      github.ref_name == github.event.repository.default_branch &&
      ((github.event_name == 'workflow_dispatch' && needs.manual-verify.result == 'success') ||
      (github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    env:
      DEPLOY_BRANCH: ${{ github.event_name == 'workflow_dispatch' && inputs.branch || github.event.workflow_run.head_branch }}
      DEPLOY_SHA: ${{ needs.source-verify.outputs.verified_sha }}
      DEPLOY_MODE: ${{ needs.source-verify.outputs.deploy_mode }}
      TRUSTED_GATE_SHA: ${{ needs.source-verify.outputs.trusted_gate_sha }}
    outputs:
